          },
          extraHTML: `
            <button class="btn btn-ghost btn-block num" id="ms-buy-bonus" style="margin-bottom:8px; font-size:12px; border-color:rgba(0,230,118,0.4); color:var(--emerald);" ${running || autoSpin ? 'disabled' : ''}>
              🎁 Купить Блок-Бонус 4 Фриспина (${GameCore.fmt(bonusCost)} 🪙)
            </button>
          `,
          onAction: (bet) => triggerSpin(bet),
          autoSpin: {
            active: autoSpin,
            count: autoCount,
            label: '🔄 Авто',
            onToggle: (bet) => {
              if (autoSpin) {
                autoSpin = false;
                if (autoTimer) clearTimeout(autoTimer);
                renderControls();
              } else {
                autoSpin = true;
                autoCount = 0;
                autoBetVal = bet;
                triggerSpin(bet);
              }
            }
          }
        });

        const buyBtn = betPanel.querySelector('#ms-buy-bonus');
        if (buyBtn) {
          buyBtn.onclick = () => {
            if (running) return;
            const baseBet = Math.max(5, GameCore.getBet());
            const cost = baseBet * 100;
            if (AppState.get().coins < cost) {
              SFX.wrong();
              GameCore.openQuickEarnModal();
              return;
            }
            if (!AppState.placeBet(cost, 'mineslot')) return;
            SFX.tap();
            executeRound(baseBet, false, true);
          };
        }
      }

      renderTopReels(false);
      drawMineScene();
      renderControls();
    }
  });

  // =========================================================================
  // SHARED ENGINE FOR 6x5 CASCADE / TUMBLE SLOTS (OLYMPUS & SWEET BONANZA)
  // =========================================================================
  function registerCascade6x5Slot(cfg) {
    let cleanupFn = null;
    GameCore.registerGame({
      id: cfg.id,
      title: cfg.title,
      icon: cfg.icon,
      category: 'arcade',
      tag: cfg.tag,
      tagColor: cfg.tagColor,
      glow: cfg.glow,
      maxWin: cfg.maxWin,
      rtp: cfg.rtp,
      desc: cfg.desc,
      mathInfo: cfg.mathInfo,
      unmount() {
        if (cleanupFn) {
          cleanupFn();
          cleanupFn = null;
        }
      },
      mount(root) {
        let spinning = false;
        let autoSpin = false;
        let autoCount = 0;
        let autoBetVal = 25;
        let autoTimer = null;
        let stepTimers = [];
        let freeSpins = 0;
        let fsBaseBet = 25;
        let globalFsMult = 0;
        let fsRetriggered = false;
        let pendingSettle = null;

        const nonScatterSyms = cfg.symbols.filter((x) => x.id !== 'scatter');

        function rollCell(isFS, forceScatter = false, allowScatter = true) {
          if (forceScatter) return { ...cfg.scatterSym };
          const orbChance = isFS ? cfg.orbChanceFS : cfg.orbChanceBase;
          if (Math.random() < orbChance) {
            const m = pickWeighted(cfg.orbMultipliers).mult;
            return { id: 'orb', icon: cfg.orbIcon, multOrb: m, label: `x${m}` };
          }
          if (allowScatter) {
            const scProb = isFS ? (cfg.scatterChanceFS || 0.012) : (cfg.scatterChanceBase || 0.036);
            if (Math.random() < scProb) return { ...cfg.scatterSym };
          }
          return { ...pickWeighted(nonScatterSyms) };
        }

        let grid = Array.from({ length: 6 }, () =>
          Array.from({ length: 5 }, () => rollCell(false))
        );
        let highlightKeys = new Set();

        cleanupFn = () => {
          autoSpin = false;
          if (autoTimer) clearTimeout(autoTimer);
          stepTimers.forEach((t) => clearTimeout(t));
          stepTimers = [];
          if (spinning && pendingSettle) {
            pendingSettle(true);
            pendingSettle = null;
          }
        };

        root.innerHTML = `
          <div class="game-stage" style="padding:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; font-size:12px;">
              <span>8+ символов где угодно = Каскад!</span>
              <span id="cs-badge" style="font-weight:900; color:${cfg.tagColor};">4× ${cfg.scatterSym.icon} = ${cfg.fsAward} Фриспинов!</span>
            </div>
            <div id="cs-grid" style="display:grid; grid-template-columns:repeat(6,1fr); gap:5px; background:rgba(8,11,22,0.9); border:1px solid var(--border-subtle); border-radius:14px; padding:8px;"></div>
            <div id="cs-msg" style="text-align:center; margin-top:9px; font-weight:800; font-size:13.5px; min-height:20px; color:var(--gold-light);">
              Лови лавину совпадений и сферы множителей до x500!
            </div>
          </div>
          <div class="bet-panel" id="cs-bet"></div>
        `;

        const gridEl = root.querySelector('#cs-grid');
        const msgEl = root.querySelector('#cs-msg');
        const badgeEl = root.querySelector('#cs-badge');
        const betPanel = root.querySelector('#cs-bet');

        function renderGrid() {
          if (!document.body.contains(gridEl)) return;
          gridEl.innerHTML = '';
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 6; c++) {
              const cell = grid[c][r];
              const el = document.createElement('div');
              const isHit = highlightKeys.has(`${c}_${r}`);
              const isOrb = cell.id === 'orb';
              el.style.cssText = `
                height:46px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
                background:${isHit ? 'rgba(0,230,118,0.28)' : isOrb ? 'rgba(255,184,0,0.22)' : 'rgba(255,255,255,0.04)'};
                border:1px solid ${isHit ? '#00e676' : isOrb ? '#ffb800' : 'rgba(255,255,255,0.07)'};
                transform:${isHit ? 'scale(1.06)' : 'scale(1)'}; transition:all 0.16s; position:relative;
              `;
              el.innerHTML = `
                <span style="font-size:${isOrb ? '17px' : '22px'}; line-height:1;">${cell.icon}</span>
                ${isOrb ? `<span class="num" style="font-size:10px; font-weight:900; color:#fde047;">x${cell.multOrb}</span>` : ''}
              `;
              gridEl.appendChild(el);
            }
          }
          if (freeSpins > 0) {
            badgeEl.innerHTML = cfg.persistentMult
              ? `⚡ ФРИСПИНЫ: <b>${freeSpins}</b> · Накопленный Икс: <b>x${Math.max(1, globalFsMult)}</b>`
              : `🍭 ФРИСПИНЫ: <b>${freeSpins}</b> (Бомбы до x100 активны!)`;
          } else {
            badgeEl.innerHTML = `4× ${cfg.scatterSym.icon} = ${cfg.fsAward} Фриспинов!`;
          }
        }

        function runSpin(betVal, buyBonus = false) {
          if (spinning) return;
          const isFS = freeSpins > 0;
          const bet = isFS ? fsBaseBet : betVal;
          if (!isFS && !buyBonus) {
            if (!AppState.placeBet(bet, cfg.id)) {
              autoSpin = false;
              renderControls();
              return;
            }
          } else if (isFS) {
            freeSpins--;
          }
          if (autoSpin) autoCount++;
          spinning = true;
          highlightKeys = new Set();
          renderControls();

          // Build initial 6x5 grid (max 1 scatter per column!) & pre-compute entire Tumble sequence
          let simGrid = Array.from({ length: 6 }, () => {
            let colHasSc = false;
            return Array.from({ length: 5 }, () => {
              const cell = rollCell(isFS, false, !buyBonus && !colHasSc && !(isFS && fsRetriggered));
              if (cell.id === 'scatter') colHasSc = true;
              return cell;
            });
          });
          if (buyBonus) {
            for (let c = 0; c < 6; c++) {
              for (let r = 0; r < 5; r++) {
                if (simGrid[c][r].id === 'scatter') simGrid[c][r] = rollCell(isFS, false, false);
              }
            }
            const spots = [[0, 1], [2, 2], [3, 0], [5, 3]];
            spots.forEach(([c, r]) => { simGrid[c][r] = rollCell(isFS, true, false); });
          }

          const cascades = [];
          let baseWinMult = 0;
          let safety = 0;

          while (safety < 18) {
            safety++;
            const counts = new Map();
            for (let c = 0; c < 6; c++) {
              for (let r = 0; r < 5; r++) {
                const s = simGrid[c][r];
                if (s.id === 'orb' || s.id === 'scatter') continue;
                counts.set(s.id, (counts.get(s.id) || 0) + 1);
              }
            }
            const winIds = new Set();
            let stepMult = 0;
            for (const [id, cnt] of counts.entries()) {
              if (cnt >= 8) {
                winIds.add(id);
                const symDef = cfg.symbols.find((x) => x.id === id);
                const tier = cnt >= 12 ? symDef.p12 : cnt >= 10 ? symDef.p10 : symDef.p8;
                stepMult += tier;
              }
            }
            if (winIds.size === 0) break;

            const hitSet = new Set();
            for (let c = 0; c < 6; c++) {
              for (let r = 0; r < 5; r++) {
                if (winIds.has(simGrid[c][r].id)) hitSet.add(`${c}_${r}`);
              }
            }
            const snapBefore = simGrid.map((col) => col.map((x) => ({ ...x })));
            baseWinMult += stepMult;

            // Drop remaining & refill from top
            for (let c = 0; c < 6; c++) {
              const survivors = [];
              for (let r = 0; r < 5; r++) {
                if (!hitSet.has(`${c}_${r}`)) survivors.push(simGrid[c][r]);
              }
              while (survivors.length < 5) {
                const colAlreadyHasSc = survivors.some((s) => s.id === 'scatter');
                survivors.unshift(rollCell(isFS, false, !buyBonus && !colAlreadyHasSc && !(isFS && fsRetriggered)));
              }
              simGrid[c] = survivors;
            }

            cascades.push({
              snapBefore,
              hitSet,
              stepMult,
              snapAfter: simGrid.map((col) => col.map((x) => ({ ...x })))
            });
          }

          const finalSnap = simGrid.map((col) => col.map((x) => ({ ...x })));
          let orbSum = 0;
          let scatterCount = 0;
          for (let c = 0; c < 6; c++) {
            for (let r = 0; r < 5; r++) {
              if (finalSnap[c][r].id === 'orb') orbSum += finalSnap[c][r].multOrb;
              if (finalSnap[c][r].id === 'scatter') scatterCount++;
            }
          }

          let appliedMult = 1;
          let nextGlobalFsMult = globalFsMult;
          if (baseWinMult > 0) {
            if (isFS && cfg.persistentMult) {
              if (orbSum > 0) nextGlobalFsMult += orbSum;
              appliedMult = Math.max(1, nextGlobalFsMult);
            } else if (orbSum > 0) {
              appliedMult = orbSum;
            }
          }

          let scatterPay = (!buyBonus && scatterCount >= 4) ? 2 : 0;
          const modeBoost = isFS ? (cfg.fsPayBoost || 1) : (cfg.basePayScale || 1);
          const totalMult = Math.min(5000, Number((baseWinMult * modeBoost * appliedMult + scatterPay).toFixed(2)));
          const winCoins = Math.round(bet * totalMult);

          let settled = false;
          function finishSpin(silent = false) {
            if (settled) return;
            settled = true;
            pendingSettle = null;
            stepTimers.forEach((t) => clearTimeout(t));
            stepTimers = [];
            grid = finalSnap;
            highlightKeys = new Set();
            globalFsMult = nextGlobalFsMult;
            spinning = false;

            if ((!isFS && scatterCount >= 4) || (isFS && !fsRetriggered && scatterCount >= 3)) {
              const addFs = isFS ? 5 : cfg.fsAward;
              if (isFS) {
                fsRetriggered = true;
              } else if (freeSpins === 0) {
                globalFsMult = 0;
                fsRetriggered = false;
              }
              freeSpins += addFs;
              fsBaseBet = bet;
              if (!silent) {
                SFX.jackpot();
                UI.toast(`${cfg.scatterSym.icon} БОНУС! +${addFs} БЕСПЛАТНЫХ СПИНОВ!`, 'gold');
              }
            } else if (isFS && freeSpins === 0) {
              fsRetriggered = false;
            }

            if (winCoins > 0) {
              AppState.winPayout(winCoins, totalMult);
              if (!silent) {
                if (totalMult >= 10) SFX.jackpot();
                else SFX.win();
                msgEl.innerHTML = appliedMult > 1
                  ? `⚡ КАСКАД ×${appliedMult}! Выигрыш +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`
                  : `🎉 Лавина сыграла: +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`;
              }
            } else if (!silent) {
              msgEl.textContent = isFS ? 'Бонусный спин без каскада — крутим дальше!' : 'Попробуй ещё спин!';
            }

            if (!silent) {
              renderGrid();
              renderControls();
              if (autoSpin) {
                autoTimer = setTimeout(() => {
                  if (!autoSpin || !document.body.contains(betPanel)) return;
                  if (freeSpins === 0 && AppState.get().coins < autoBetVal) {
                    autoSpin = false;
                    UI.toast('⏹️ Автокрутка остановлена: пополните баланс задачей 🧠', 'loss');
                    renderControls();
                    return;
                  }
                  runSpin(autoBetVal, false);
                }, 520);
              }
            }
          }
          pendingSettle = finishSpin;

          // Animate initial drop + each tumble cascade!
          if (cascades.length === 0) {
            grid = finalSnap;
            renderGrid();
            SFX.tick(1);
            stepTimers.push(setTimeout(() => finishSpin(false), 260));
          } else {
            let delay = 0;
            cascades.forEach((cas, idx) => {
              stepTimers.push(setTimeout(() => {
                grid = cas.snapBefore;
                highlightKeys = cas.hitSet;
                SFX.tick(Math.min(6, idx + 1));
                msgEl.textContent = `💥 Лавина #${idx + 1}: +${cas.stepMult.toFixed(2)}x...`;
                renderGrid();
              }, delay));
              delay += 330;
              stepTimers.push(setTimeout(() => {
                grid = cas.snapAfter;
                highlightKeys = new Set();
                renderGrid();
              }, delay));
              delay += 220;
            });
            stepTimers.push(setTimeout(() => finishSpin(false), delay + 80));
          }
        }

        function renderControls() {
          if (!document.body.contains(betPanel)) return;
          if (freeSpins > 0) {
            betPanel.innerHTML = `
              <div style="display:flex; gap:8px;">
                <button class="btn btn-purple btn-lg" id="cs-fs-btn" style="flex:2;" ${spinning || autoSpin ? 'disabled' : ''}>
                  ${cfg.icon} Фриспин БЕСПЛАТНО (${freeSpins})
                </button>
                ${autoSpin ? `<button class="btn btn-crimson btn-lg num" id="cs-fs-stop" style="flex:1;">⏹️ СТОП (${autoCount})</button>` : ''}
              </div>
            `;
            betPanel.querySelector('#cs-fs-btn').onclick = () => runSpin(fsBaseBet, false);
            const sb = betPanel.querySelector('#cs-fs-stop');
            if (sb) {
              sb.onclick = () => {
                autoSpin = false;
                if (autoTimer) clearTimeout(autoTimer);
                renderControls();
              };
            }
            return;
          }

          const curBet = Math.max(5, GameCore.getBet());
          const buyMult = cfg.buyMult || 45;
          GameCore.renderBetControls(betPanel, {
            minBet: 5,
            disabled: spinning,
            actionLabel: `${cfg.icon} КРУТИТЬ 6×5`,
            onBetChange: (b) => {
              const bb = betPanel.querySelector('#cs-buy');
              if (bb) bb.textContent = `🎁 Купить ${cfg.fsAward} Фриспинов (${GameCore.fmt(b * buyMult)} 🪙)`;
            },
            extraHTML: `
              <button class="btn btn-ghost btn-block num" id="cs-buy" style="margin-bottom:8px; font-size:12px; border-color:${cfg.tagColor}66; color:${cfg.tagColor};" ${spinning || autoSpin ? 'disabled' : ''}>
                🎁 Купить ${cfg.fsAward} Фриспинов (${GameCore.fmt(curBet * buyMult)} 🪙)
              </button>
            `,
            onAction: (bet) => runSpin(bet, false),
            autoSpin: {
              active: autoSpin,
              count: autoCount,
              label: '🔄 Авто',
              onToggle: (bet) => {
                if (autoSpin) {
                  autoSpin = false;
                  if (autoTimer) clearTimeout(autoTimer);
                  renderControls();
                } else {
                  autoSpin = true;
                  autoCount = 0;
                  autoBetVal = bet;
                  runSpin(bet, false);
                }
              }
            }
          });

          const buyBtn = betPanel.querySelector('#cs-buy');
          if (buyBtn) {
            buyBtn.onclick = () => {
              if (spinning) return;
              const baseBet = Math.max(5, GameCore.getBet());
              const cost = baseBet * buyMult;
              if (AppState.get().coins < cost) {
                SFX.wrong();
                GameCore.openQuickEarnModal();
                return;
              }
              if (!AppState.placeBet(cost, cfg.id)) return;
              SFX.tap();
              runSpin(baseBet, true);
            };
          }
        }

        renderGrid();
        renderControls();
      }
    });
  }

          finalMat[4][1] = { ...BOOK_SYMS[0] };

        // Standard 10 paylines with Book acting as Wild (divided properly across 10 lines!)
        for (const line of LINES_10) {
          const syms = line.map((r, c) => finalMat[c][r]);
          const nonWild = syms.find((s) => s.id !== 'book') || BOOK_SYMS[1];
          let len = 0;
          for (let c = 0; c < 5; c++) {
            if (syms[c].id === nonWild.id || syms[c].id === 'book') len++;
            else break;
          }
          if (len >= nonWild.minMatch) {
            const p = len === 2 ? nonWild.m2 : len === 3 ? nonWild.m3 : len === 4 ? nonWild.m4 : nonWild.m5;
            totalMult += p * (isFS ? 1.50 : 1.66);
            for (let c = 0; c < len; c++) hitSet.add(`${c}_${line[c]}`);
          }
        }

        // Count Book scatters anywhere
        let books = 0;
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < 3; r++) {
            if (finalMat[c][r].id === 'book') books++;
          }
        }
        if (!buyBonus && books >= 3) {
          totalMult += books === 3 ? 2 : books === 4 ? 20 : 150;
          for (let c = 0; c < 5; c++) {
            for (let r = 0; r < 3; r++) if (finalMat[c][r].id === 'book') hitSet.add(`${c}_${r}`);
          }
        } else if (buyBonus && books >= 3) {
          for (let c = 0; c < 5; c++) {
            for (let r = 0; r < 3; r++) if (finalMat[c][r].id === 'book') hitSet.add(`${c}_${r}`);
          }
        }

        // Special Expanding Symbol during Free Spins!
        let expandedCols = [];
        if (isFS && specialSym) {
          for (let c = 0; c < 5; c++) {
            if (finalMat[c].some((s) => s.id === specialSym.id)) expandedCols.push(c);
          }
          if (expandedCols.length >= specialSym.minMatch) {
            // Expand whole reels!
            finalMat = finalMat.map((col, c) =>
              expandedCols.includes(c) ? [{ ...specialSym }, { ...specialSym }, { ...specialSym }] : col
            );
            expandedCols.forEach((c) => {
              hitSet.add(`${c}_0`);
              hitSet.add(`${c}_1`);
              hitSet.add(`${c}_2`);
            });
            const cnt = expandedCols.length;
            const expPay = cnt === 2 ? specialSym.m2 : cnt === 3 ? specialSym.m3 : cnt === 4 ? specialSym.m4 : specialSym.m5;
            totalMult += expPay * 21.5; // Pays across all 10 lines!
          }
        }

        totalMult = Math.min(5000, Number(totalMult.toFixed(2)));
        const winCoins = Math.round(bet * totalMult);

        let settled = false;
        function finish(silent = false) {
          if (settled) return;

          pendingSettle = null;
          mat = finalMat;

            }

            specialSym = null;
            fsRetriggered = false;
          }

          if (winCoins > 0) {

            if (!silent) {

              else SFX.win();
              msgEl.innerHTML = expandedCols.length >= (specialSym ? specialSym.minMatch : 99)
                ? `🌟 РАСШИРЕНИЕ ${specialSym ? specialSym.icon : ''} НА ${expandedCols.length} БАРАБАНА! +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`
                : `📖 Выигрыш по линиям: +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`;
            }

  async function brFbTransfer(fromId, toId, amount, feedText) {
    const amt = Math.max(1, Math.floor(amount || 0));
    const fromRef = fbState.db.doc('profiles/' + fromId);
    const toRef = fbState.db.doc('profiles/' + toId);
    return fbState.db.runTransaction(async (tx) => {
      const fromDoc = await tx.get(fromRef);
      const toDoc = await tx.get(toRef);
      const fromCoins = fromDoc.exists ? (fromDoc.data().coins || 0) : 0;
      if (fromCoins < amt) throw new Error('NOT_ENOUGH_COINS');
      const nextFrom = fromCoins - amt;
      const nextTo = (toDoc.exists ? (toDoc.data().coins || 0) : 0) + amt;
      tx.update(fromRef, { coins: nextFrom, updatedAt: fbTs() });
      if (toDoc.exists) tx.update(toRef, { coins: nextTo, updatedAt: fbTs() }); else tx.set(toRef, { id: toId, name: toId, roomCode: 'MAIN', coins: nextTo, createdAt: fbTs(), updatedAt: fbTs() });
      return { nextFrom, nextTo };
    }).then(async (r) => { if (feedText) { const room = await brFbMyRoom(); if (room) await brFbFeedAdd(room, feedText, 'transfer'); } return r; });
  }
  async function brFbMyRoom() {
    const doc = await fbState.db.doc('profiles/' + brFbId()).get();
    return doc.exists ? brFbRoomNormalize(doc.data().roomCode) : 'MAIN';
  }

  async function brFbHandleRob(body) {
    const okAuth = await brFbInit(); if (!okAuth) return null;
    const uid = brFbId();
    const name = brFbName();
    const targetId = String(body.targetId || '');
    const meRef = fbState.db.doc('profiles/' + uid);
    const tRef = fbState.db.doc('profiles/' + targetId);
    const result = await fbState.db.runTransaction(async (tx) => {
      const meDoc = await tx.get(meRef); const tDoc = await tx.get(tRef);
      if (!tDoc.exists) throw new Error('TARGET_NOT_FOUND');
      const me = meDoc.data(); const target = tDoc.data();
      const myCoins = me.coins || 0;
      if (body.success) {
        const lock = target.vaultLock || 0;
        const pct = Math.max(0.06, 0.16 - lock * 0.025);
        const stolen = Math.max(50, Math.min(2500, Math.round((target.coins || 0) * pct)));
        const nextMe = myCoins + stolen;
        tx.update(meRef, { coins: nextMe, robsOk: (me.robsOk || 0) + 1, updatedAt: fbTs() });
        tx.update(tRef, { coins: Math.max(0, (target.coins || 0) - stolen), updatedAt: fbTs() });
        return { myCoins: nextMe, stolen, fine: 0 };
      }
      const fine = Math.min(myCoins, Math.max(40, Math.round(myCoins * 0.12)));
      tx.update(meRef, { coins: myCoins - fine, updatedAt: fbTs() });
      tx.update(tRef, { coins: (target.coins || 0) + fine, updatedAt: fbTs() });
      return { myCoins: myCoins - fine, stolen: 0, fine };
    });
    const room = await brFbMyRoom();
    const targetName = escapeHtml(String((await fbState.db.doc('profiles/' + targetId).get()).data().name || targetId));
    if (body.success) await brFbFeedAdd(room, '🐀 ' + name + ' вскрыл сейф ' + targetName + ' и унёс +' + GameCore.fmt(result.stolen) + ' 🪙!', 'rob');
    else await brFbFeedAdd(room, '🚔 ' + name + ' попался на взломе ' + targetName + ' (' + (body.reasonLabel || '') + ') — штраф -' + GameCore.fmt(result.fine) + ' 🪙!', 'rob');
    return { ok: true, myCoins: result.myCoins, stolen: result.stolen, fine: result.fine };
  }

  async function brFbHandleBeg() {
    const okAuth = await brFbInit(); if (!okAuth) return null;
    const uid = brFbId();
    const name = brFbName();
    const room = await brFbMyRoom();
    const meRef = fbState.db.doc('profiles/' + uid);
    const beg = await fbState.db.runTransaction(async (tx) => {
      const doc = await tx.get(meRef);
      const d = doc.exists ? doc.data() : {};
      const now = fbTs();
      if (d.lastBegAt && now - d.lastBegAt < 30 * 60 * 1000) {
        const waitMin = Math.ceil((30 * 60 * 1000 - (now - d.lastBegAt)) / 60000);
        throw new Error('BEG_COOLDOWN:' + waitMin);
      }
      tx.update(meRef, { lastBegAt: now, updatedAt: fbTs() });
      return true;
    }).catch((e) => e);
    if (beg instanceof Error) {
      const m = /BEG_COOLDOWN:(\d+)/.exec(beg.message || '');
      return { ok: false, error: 'Подожди ' + (m ? m[1] : 'чуть-чуть') + ' мин до следующей просьбы!' };
    }
    await fbState.db.collection('begRequests').add({ roomCode: room, fromId: uid, fromName: name, amount: 120, status: 'open', ts: fbTs(), expiresAt: fbTs() + 48 * 3600 * 1000 });
    await brFbFeedAdd(room, '🥺 ' + name + ' клянчит на дошик: «скинь 120 🪙, братан!»', 'beg');
    const doc = await fbState.db.doc('profiles/' + uid).get();
    return { ok: true, myCoins: doc.data().coins || 0, message: '🥠 Просьба отправлена в тусовку! Друзья увидят её в игре.' };
  }

  async function brFbHandleDuel(body) {
    const okAuth = await brFbInit(); if (!okAuth) return null;
    const uid = brFbId();
    const name = brFbName();
    const targetId = String(body.targetId || '');
    const stake = Math.floor(Number(body.stake) || 0);
    if (stake <= 0) return { ok: false, error: 'Ставка должна быть больше нуля!' };
    const meRef = fbState.db.doc('profiles/' + uid);
    const tRef = fbState.db.doc('profiles/' + targetId);
    const targetDoc = await tRef.get();
    if (!targetDoc.exists) return { ok: false, error: 'Игрок не найден в тусовке' };
    const targetName = targetDoc.data().name || targetId;
    const task = BrainTasks.generate('mix', stake >= 1000 ? 2 : 1, { choiceOnly: true });
    const myCoinsAfter = await fbState.db.runTransaction(async (tx) => {
      const meDoc = await tx.get(meRef);
      const me = meDoc.data();
      const coins = me.coins || 0;
      if (coins < stake) throw new Error('NOT_ENOUGH_COINS');
      tx.update(meRef, { coins: coins - stake, updatedAt: fbTs() });
      tx.set(fbState.db.collection('duels').doc(), {
        roomCode: me.roomCode || 'MAIN',
        fromId: uid, fromName: name, toId: targetId, toName: targetName,
        stake, pot: stake * 2,
        question: task.question, options: task.options, answerB64: brFbB64(task.answer),
        status: 'pending', fromResult: null, toResult: null, winner: null,
        createdAt: fbTs(), expiresAt: fbTs() + 72 * 3600 * 1000
      });
      return coins - stake;
    }).catch((e) => (e.message === 'NOT_ENOUGH_COINS' ? null : Promise.reject(e)));
    if (myCoinsAfter === null) return { ok: false, error: 'Недостаточно монет для этой ставки!' };
    const room = await brFbMyRoom();
    await brFbFeedAdd(room, '⚔️ ' + name + ' вызвал ' + targetName + ' на дуэль на ' + GameCore.fmt(stake) + ' 🪙!', 'duel');
    return { ok: true, myCoins: myCoinsAfter, instantResult: null, message: '⚔️ Вызов отправлен! ' + targetName + ' увидит его в игре.' };
  }

  async function brFbDuelList() {
    const okAuth = await brFbInit(); if (!okAuth) return { incoming: [], outgoing: [], openBegs: [] };
    const uid = brFbId();
    const room = await brFbMyRoom();
    const [inSnap, outSnap, begSnap] = await Promise.all([
      fbState.db.collection('duels').where('toId', '==', uid).where('status', '==', 'pending').get(),
      fbState.db.collection('duels').where('fromId', '==', uid).where('status', '==', 'pending').get(),
      fbState.db.collection('begRequests').where('roomCode', '==', room).where('status', '==', 'open').get()
    ]);
    return {
      incoming: inSnap.docs.map((d) => ({ docId: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt),
      outgoing: outSnap.docs.map((d) => ({ docId: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt),
      openBegs: begSnap.docs.map((d) => ({ docId: d.id, ...d.data() })).filter((b) => b.fromId !== uid).sort((a, b) => b.ts - a.ts)
    };
  }

  async function brFbDuelAccept(docId) {
    const uid = brFbId();
    const ref = fbState.db.doc('duels/' + docId);
    const meRef = fbState.db.doc('profiles/' + uid);
    return fbState.db.runTransaction(async (tx) => {
      const duelDoc = await tx.get(ref);
      const meDoc = await tx.get(meRef);
      if (!duelDoc.exists || duelDoc.data().status !== 'pending') throw new Error('DUEL_NOT_PENDING');
      const me = meDoc.data();
      const stake = duelDoc.data().stake;
      if ((me.coins || 0) < stake) throw new Error('NOT_ENOUGH_COINS');
      tx.update(meRef, { coins: (me.coins || 0) - stake, updatedAt: fbTs() });
      tx.update(ref, { status: 'active', acceptedAt: fbTs() });
      return { ...duelDoc.data(), docId };
    });
  }
  async function brFbDuelDecline(docId) {
    const uid = brFbId();
    const ref = fbState.db.doc('duels/' + docId);
    const fromRef = fbState.db.doc('profiles/placeholder');
    await fbState.db.runTransaction(async (tx) => {
      const duelDoc = await tx.get(ref);
      if (!duelDoc.exists || duelDoc.data().status !== 'pending') return;
      const d = duelDoc.data();
      tx.update(ref, { status: 'declined' });
      const fRef = fbState.db.doc('profiles/' + d.fromId);
      const fDoc = await tx.get(fRef);
      if (fDoc.exists) tx.update(fRef, { coins: (fDoc.data().coins || 0) + d.stake, updatedAt: fbTs() });
    });
    const room = await brFbMyRoom();
    await brFbFeedAdd(room, '🛡️ Дуэль отклонена. Ставка возвращена.', 'duel');
    return { ok: true };

  async function brFbDuelCancel(docId) {
    const uid = brFbId();
    const ref = fbState.db.doc('duels/' + docId);
    await fbState.db.runTransaction(async (tx) => {
      const duelDoc = await tx.get(ref);
      if (!duelDoc.exists || duelDoc.data().status !== 'pending') return;
      const d = duelDoc.data();
      if (d.fromId !== uid) throw new Error('NOT_YOUR_DUEL');
      tx.update(ref, { status: 'cancelled' });
      const fRef = fbState.db.doc('profiles/' + uid);
      const fDoc = await tx.get(fRef);
      if (fDoc.exists) tx.update(fRef, { coins: (fDoc.data().coins || 0) + d.stake, updatedAt: fbTs() });
    });
    return { ok: true };
  }
  async function brFbDuelSubmitAnswer(docId, chosenB64, timeMs) {
    const uid = brFbId();
    const name = brFbName();
    const ref = fbState.db.doc('duels/' + docId);
    const room = await brFbMyRoom();
    await fbState.db.runTransaction(async (tx) => {
      const duelDoc = await tx.get(ref);
      if (!duelDoc.exists) throw new Error('DUEL_NOT_FOUND');
      const d = duelDoc.data();
      if (d.status !== 'active') throw new Error('DUEL_NOT_ACTIVE');
      const correct = chosenB64 === d.answerB64;
      const result = { ok: correct, timeMs: Math.max(0, Math.floor(timeMs || 0)), at: fbTs() };
      const isFrom = d.fromId === uid;
      const next = isFrom ? { fromResult: result } : { toResult: result };
      const merged = { ...d, ...next };
      // Если обе попытки есть — решаем исход
      if (merged.fromResult && merged.toResult) {
        const f = merged.fromResult, t = merged.toResult;
        let winner = 'draw';
        if (f.ok && t.ok) winner = (f.timeMs <= t.timeMs) ? 'from' : 'to';
        else if (f.ok) winner = 'from';
        else if (t.ok) winner = 'to';
        merged.status = 'resolved';
        merged.winner = winner;
        tx.update(ref, { ...next, status: 'resolved', winner });
        if (winner !== 'draw') {
          const winnerId = winner === 'from' ? d.fromId : d.toId;
          const wRef = fbState.db.doc('profiles/' + winnerId);
          const wDoc = await tx.get(wRef);
          if (wDoc.exists) tx.update(wRef, { coins: (wDoc.data().coins || 0) + d.pot, updatedAt: fbTs() });
        } else {
          for (const pid of [d.fromId, d.toId]) {
            const pRef = fbState.db.doc('profiles/' + pid);
            const pDoc = await tx.get(pRef);
            if (pDoc.exists) tx.update(pRef, { coins: (pDoc.data().coins || 0) + d.stake, updatedAt: fbTs() });
          }
        }
      } else {
        tx.update(ref, next);
      }
    });
    const duelAfter = await ref.get();
    const d = duelAfter.data();
    if (d.status === 'resolved') {
      const winnerName = d.winner === 'from' ? d.fromName : d.winner === 'to' ? d.toName : null;
      await brFbFeedAdd(room, winnerName ? ('🏆 ' + winnerName + ' победил в дуэли на ' + GameCore.fmt(d.stake) + ' 🪙!') : '🤝 Дуэль завершилась ничьей — ставки возвращены.', 'duel');
    }
    const meDoc = await fbState.db.doc('profiles/' + uid).get();
    return { ok: true, myCoins: meDoc.exists ? meDoc.data().coins : 0, resolved: d.status === 'resolved', winner: d.winner || null };
  }
  async function brFbBegGive(docId) {
    const uid = brFbId();
    const name = brFbName();
    const room = await brFbMyRoom();
    const ref = fbState.db.doc('begRequests/' + docId);
    await fbState.db.runTransaction(async (tx) => {
      const reqDoc = await tx.get(ref);

      const d = reqDoc.data();

      const fromRef = fbState.db.doc('profiles/' + uid);

  async function apiPost(endpoint, body) {
    if (window.BR_FB && typeof window.BR_FB.call === 'function') {
      const fbRes = await window.BR_FB.call(endpoint, body);
      if (fbRes !== undefined && fbRes !== null) return fbRes;
      if (window.BR_FB.enabled) return null;
    }
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...getAuthPayload(), ...body })
      });
      if (!res.ok) return null;
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  async function syncNow(extra = {}) {
    if (!window.AppState) return null;
    const st = AppState.get();
    const delta = AppState.consumeSyncDelta();
    const payload = {
      coinsDelta: delta.coinsDelta,
      jpDelta: delta.jpDelta,
      clientCoinsHint: st.coins,
      level: st.level,
      xp: st.xp,
      prestigeCores: st.prestigeCores || 0,
      vaultLock: (st.upgrades && st.upgrades.vault_lock) || 0,
      stats: {
        tasksSolved: st.stats.tasksSolved || 0,
        tasksWrong: st.stats.tasksWrong || 0,
        biggestWin: st.stats.biggestWin || 0,
        biggestMult: st.stats.biggestMult || 0,
        totalWagered: st.stats.totalWagered || 0,
        brokeCount: st.stats.brokeCount || 0,
        bestStreak: st.bestStreak || 0
      },
      ...extra
    };
    const data = await apiPost('/api/sync', payload);
    if (data && data.ok) {
      staticMode = false;
      const prevCoins = AppState.get().coins;
      AppState.applyServerSnapshot(data.user.coins, data.jackpotPool);
      if (data.externalNotice && window.UI) {
        UI.toast(data.externalNotice, data.user.coins >= prevCoins ? 'win' : 'loss');
      }
      boardData = {
        me: data.user,
        roomCode: data.roomCode || 'MAIN',
        roomName: data.roomName || 'Тусовка Друзей',
        shareUrl: data.shareUrl || '',
        inviteUrl: data.inviteUrl || '',
        players: data.players || [],
        feed: data.feed || [],
        jackpotPool: data.jackpotPool || 5000,
        botUsername: data.botUsername || '',
        demoMode: !!data.demoMode
      };
      refreshIfVisible();
      return data;
    }

    // Fallback for GitHub Pages / offline static hosting: everything still works 24/7!
    staticMode = true;
    buildStaticBoardSnapshot(extra.gameEvent);
    return null;
  }

  function scheduleSync() {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(), 900);

  function openHeistModal(targetPlayer) {
    if (!window.BrainTasks || !window.UI) return;
    SFX.tap();

    const lockLvl = targetPlayer.vaultLock || 0;
    const diffIdx = Math.min(3, 2 + Math.floor(lockLvl / 2));
    const task = BrainTasks.generate('mix', diffIdx, { choiceOnly: true });
    const limitSec = Math.max(10, 16 - lockLvl);
    let timeLeft = limitSec;
    let finished = false;

    UI.openModal(`
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div style="font-weight:900; font-size:17px; color:var(--gold-light);">🐀 Взлом сейфа: ${escapeHtml(targetPlayer.name)}</div>
        <span class="num" id="heist-timer" style="font-weight:900; font-size:16px; color:var(--crimson);">⏱️ ${timeLeft.toFixed(1)}с</span>
      </div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
        В банке соперника: <b class="num" style="color:var(--gold-light)">${GameCore.fmt(targetPlayer.coins)} 🪙</b>
        ${lockLvl > 0 ? ` · 🔒 Защита Ур.${lockLvl}` : ' · 🔓 Без замка!'}<br/>
        Успеешь решить — уведёшь куш, ошибёшься — заплатишь штраф!
      </div>
      <div style="height:5px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; margin-bottom:10px;">
        <div id="heist-bar" style="height:100%; width:100%; background:linear-gradient(90deg, var(--gold), var(--crimson));"></div>
      </div>
      <div class="task-question-box" style="margin:8px 0 12px; padding:14px; font-size:18px;">${task.question}</div>
      <div class="answers-grid" id="heist-opts"></div>
    `);

    const tEl = document.getElementById('heist-timer');
    const bEl = document.getElementById('heist-bar');
    const grid = document.getElementById('heist-opts');

    async function resolveHeist(success, reasonLabel) {
      if (finished) return;
      finished = true;
      if (robTimerIv) {
        clearInterval(robTimerIv);
        robTimerIv = null;
      }
      UI.closeModal();

      if (staticMode) {
        const loc = loadLocalArena();
        const npc = loc.npcs.find((x) => x.id === targetPlayer.id);
        const curCoins = AppState.get().coins;
        if (!npc) return;
        if (success) {
          const pct = Math.max(0.06, 0.16 - (npc.vaultLock || 0) * 0.025);
          const stolen = Math.max(50, Math.min(2500, Math.round(npc.coins * pct)));
          npc.coins = Math.max(0, npc.coins - stolen);
          loc.myRobs = (loc.myRobs || 0) + 1;
          loc.feed.unshift({ time: nowTimeStr(), text: `🐀 Ты вскрыл сейф ${npc.name} и унёс +${GameCore.fmt(stolen)} 🪙!` });
          saveLocalArena(loc);
          AppState.setExactCoinsFromAction(curCoins + stolen);
          SFX.jackpot();
          UI.toast(`🐀 УСПЕХ! Ты увёл +${GameCore.fmt(stolen)} 🪙 у ${targetPlayer.name}!`, 'gold');
        } else {
          const fine = Math.min(curCoins, Math.max(40, Math.round(curCoins * 0.12)));
          npc.coins += fine;
          loc.feed.unshift({ time: nowTimeStr(), text: `🚔 Сирена! Попытка взлома ${npc.name} провалилась (${reasonLabel}) — штраф -${GameCore.fmt(fine)} 🪙!` });
          saveLocalArena(loc);
          AppState.setExactCoinsFromAction(curCoins - fine);
          SFX.explosion();
          UI.toast(`🚔 ПОЙМАН! Штраф -${GameCore.fmt(fine)} 🪙 в пользу ${targetPlayer.name}!`, 'loss');
        }
        buildStaticBoardSnapshot();
        return;
      }

      const res = await apiPost('/api/rob', {
        targetId: targetPlayer.id,
        success,
        reasonLabel
      });
      if (!res || !res.ok) {
        SFX.wrong();
        UI.toast((res && res.error) || 'Не удалось провернуть взлом', 'loss');
        return;
      }
      AppState.setExactCoinsFromAction(res.myCoins);
      if (res.stolen > 0) {
        SFX.jackpot();
        UI.toast(`🐀 УСПЕХ! Ты увёл +${GameCore.fmt(res.stolen)} 🪙 у ${targetPlayer.name}!`, 'gold');
      } else {
        SFX.explosion();
        UI.toast(`🚔 ПОЙМАН! Сирена сработала — штраф -${GameCore.fmt(res.fine)} 🪙 в пользу ${targetPlayer.name}!`, 'loss');
      }
      await syncNow();
    }

    const start = performance.now();
    robTimerIv = setInterval(() => {
      if (finished || !document.getElementById('heist-timer')) {
        clearInterval(robTimerIv);
        robTimerIv = null;
        return;
      }
      timeLeft = Math.max(0, limitSec - (performance.now() - start) / 1000);
      if (tEl) tEl.textContent = `⏱️ ${timeLeft.toFixed(1)}с`;
      if (bEl) bEl.style.width = `${(timeLeft / limitSec) * 100}%`;
      if (timeLeft <= 0) resolveHeist(false, 'истекло время');
    }, 100);

    if (grid) {
      task.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          const ok = opt === task.answer;
          resolveHeist(ok, ok ? 'чистый взлом' : 'ошибка в коде');
        };
        grid.appendChild(btn);
      });
    }
  }

            dTask.options.forEach((opt) => {
              const ob = document.createElement('button');
              ob.className = 'answer-btn';
              ob.textContent = opt;
              ob.onclick = () => {
                if (done) return;
                done = true;
                clearTimeout(duelTimer);
                UI.closeModal();
                const loc = loadLocalArena();
                const npc = loc.npcs.find((x) => x.id === targetPlayer.id);
                if (opt === dTask.answer) {
                  if (npc) npc.coins = Math.max(0, npc.coins - stake);
                  loc.feed.unshift({ time: nowTimeStr(), text: `⚔️ Ты разгромил ${targetPlayer.name} в дуэли и забрал +${stake} 🪙!` });

                  SFX.jackpot();
                  UI.toast(`⚔️ ПОБЕДА В ДУЭЛИ! +${stake} 🪙 у ${targetPlayer.name}!`, 'gold');
                } else {
                  if (npc) npc.coins += stake;

              };
              dg.appendChild(ob);

        await syncNow();
      };
    });

  function estRewardForState(st, dIdx) {
    const base = [15, 35, 75, 160][dIdx];
    const sm = AppState.getStreakMultiplier(st.streak);
    const bm = AppState.getTotalBrainMult ? AppState.getTotalBrainMult() : 1;
    return Math.round(base * sm * bm);
  }

  // Non-Stop 60s Brain Blitz (+1.5s per right answer)
  function startBlitzSession(arena, mainRoot) {
    if (!arena) return;
    if (taskTimerIv) { clearInterval(taskTimerIv); taskTimerIv = null; }
    if (blitzIv) { clearInterval(blitzIv); blitzIv = null; }

    let timeLeft = 60.0;
    let solvedCount = 0;
    let sessionCoins = 0;
    let finished = false;
    const fastCats = ['arith', 'algebra', 'prob', 'seq', 'science'];

    arena.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-weight:800; color:var(--purple-light);">⚡ НОН-СТОП БЛИЦ · <b class="num" id="bl-score">0</b> решено</span>
        <span class="num" id="bl-time" style="font-size:18px; font-weight:900; color:var(--gold-light);">⏱️ 60.0с</span>
      </div>
      <div style="height:6px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; margin-bottom:10px;">
        <div id="bl-bar" style="height:100%; width:100%; background:linear-gradient(90deg, var(--purple), var(--emerald));"></div>
      </div>
      <div style="font-size:12px; color:var(--emerald); text-align:center; margin-bottom:6px;" class="num" id="bl-coins">
        Добыто за Блиц: +0 🪙 (каждый верный ответ даёт +0.7 сек!)
      </div>
      <div id="bl-body"></div>
    `;

    const scoreEl = arena.querySelector('#bl-score');
    const timeEl = arena.querySelector('#bl-time');
    const barEl = arena.querySelector('#bl-bar');
    const coinsEl = arena.querySelector('#bl-coins');
    const bodyEl = arena.querySelector('#bl-body');

    function endBlitz() {
      if (finished) return;
      finished = true;
      if (blitzIv) { clearInterval(blitzIv); blitzIv = null; }
      AppState.recordBlitzBest(solvedCount);
      SFX.win();
      bodyEl.innerHTML = `
        <div style="text-align:center; padding:18px 8px;">
          <div style="font-size:38px;">🏆</div>
          <div style="font-size:20px; font-weight:900; margin-top:6px;">Блиц завершён!</div>
          <div style="font-size:14px; color:var(--text-secondary); margin-top:6px;">
            Решено задач: <b class="num" style="color:#fff">${solvedCount}</b> · Заработано: <b class="num" style="color:var(--gold-light)">+${GameCore.fmt(sessionCoins)} 🪙</b>
          </div>
          <div style="display:flex; gap:8px; justify-content:center; margin-top:16px;">
            <button class="btn btn-purple btn-lg" id="bl-again">🔥 Ещё Блиц!</button>
            <button class="btn btn-gold btn-lg" id="bl-go-lobby">🎰 В Казино</button>
          </div>
        </div>
      `;
      bodyEl.querySelector('#bl-again').onclick = () => startBlitzSession(arena, mainRoot);
      bodyEl.querySelector('#bl-go-lobby').onclick = () => navigate('lobby');
    }

    let lastTick = performance.now();
    blitzIv = setInterval(() => {
      if (finished || !document.body.contains(arena)) {
        clearInterval(blitzIv);
        blitzIv = null;
        return;
      }
      const now = performance.now();
      timeLeft -= (now - lastTick) / 1000;
      lastTick = now;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (timeEl) timeEl.textContent = '⏱️ 0.0с';
        if (barEl) barEl.style.width = '0%';
        endBlitz();
        return;
      }
      if (timeEl) timeEl.textContent = `⏱️ ${timeLeft.toFixed(1)}с`;
      if (barEl) barEl.style.width = `${Math.min(100, (timeLeft / 60) * 100)}%`;
    }, 100);

    function nextBlitzQuestion() {
      if (finished) return;
      const diffIdx = Math.min(3, Math.floor(solvedCount / 7));
      const t = BrainTasks.generate('mix', diffIdx, { choiceOnly: true });
      const cat = t.categoryId || 'arith';
      bodyEl.innerHTML = `
        <div class="task-question-box" style="margin:8px 0 12px; padding:14px;">${t.question}</div>
        <div class="answers-grid" id="bl-opts"></div>
      `;
      const grid = bodyEl.querySelector('#bl-opts');
      t.options.forEach((opt) => {
        const b = document.createElement('button');
        b.className = 'answer-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (finished) return;
          const ok = opt === t.answer;
          const res = AppState.recordTaskResult({
            correct: ok,
            category: cat,
            diffIdx,
            speedRatio: 0.9
          });
          refreshStreakHeader();
          if (ok) {
            SFX.correct();
            solvedCount++;
            sessionCoins += res.earnedCoins;
            timeLeft = Math.min(75, timeLeft + 0.7);
            if (scoreEl) scoreEl.textContent = solvedCount;
            if (coinsEl) coinsEl.textContent = `Добыто за Блиц: +${GameCore.fmt(sessionCoins)} 🪙 (+0.7с!)`;
          } else {
            SFX.wrong();
            timeLeft = Math.max(0, timeLeft - 4.0);
          }
          nextBlitzQuestion();
        };
        grid.appendChild(b);
      });
    }

    nextBlitzQuestion();
  }

  function spawnTaskInArena(arena) {
    if (!arena) return;
    if (taskTimerIv) {
      clearInterval(taskTimerIv);
      taskTimerIv = null;
    }

    const st = AppState.get();
    const diff = st.selectedDiff || 0;
    const task = BrainTasks.generate(selectedCat, diff);
    const actualCat = task.categoryId || (selectedCat === 'mix' ? 'arith' : selectedCat);
    const catMeta = BrainTasks.CATEGORIES.find((c) => c.id === actualCat) || BrainTasks.CATEGORIES[0];

    const extraTime = (st.upgrades.time_warp || 0) * 1.5;
    const totalSec = BrainTasks.DIFFICULTIES[diff].timeSec + extraTime;
    let startTs = Date.now();
    let solved = false;

    arena.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-secondary);">
        <span><b style="color:var(--cyan)">${catMeta.icon} ${catMeta.name}</b> · ${BrainTasks.DIFFICULTIES[diff].name}</span>
        <span class="num" id="ta-timer" style="font-weight:800;">⏱️ ${totalSec.toFixed(1)}с (лимит!)</span>
      </div>
      <div style="height:5px; background:rgba(255,255,255,0.08); border-radius:99px; margin-top:7px; overflow:hidden;">
        <div id="ta-bar" style="height:100%; width:100%; background:linear-gradient(90deg, var(--emerald), var(--cyan)); transition:width 0.15s linear;"></div>
      </div>
      <div id="ta-body"></div>
      <div id="ta-feedback" style="margin-top:12px;"></div>
    `;

    const timerEl = arena.querySelector('#ta-timer');
    const barEl = arena.querySelector('#ta-bar');
    const bodyEl = arena.querySelector('#ta-body');
    const fbEl = arena.querySelector('#ta-feedback');

    taskTimerIv = setInterval(() => {
      if (solved || !document.body.contains(arena)) {
        clearInterval(taskTimerIv);
        taskTimerIv = null;
        return;
      }
      const el = (Date.now() - startTs) / 1000;
      const rem = Math.max(0, totalSec - el);
      if (timerEl) {
        timerEl.textContent = `⏱️ ${rem.toFixed(1)}с`;
        timerEl.style.color = rem <= 4.0 ? 'var(--crimson)' : 'var(--text-secondary)';
      }
      if (barEl) {
        barEl.style.width = `${(rem / totalSec) * 100}%`;
        if (rem <= 4.0) barEl.style.background = 'var(--crimson)';
      }
      if (rem <= 0) {
        bodyEl.querySelectorAll('button').forEach((b) => {
          b.disabled = true;
          if (task.answer && b.textContent === task.answer) b.classList.add('correct');
        });
        finishTask(false, `⏱️ Время вышло!${task.answer ? ' Правильный ответ: ' + task.answer : ''}`);
      }
    }, 100);

    function finishTask(isOk, customWrongText = '') {
      if (solved) return;
      solved = true;
      if (taskTimerIv) {
        clearInterval(taskTimerIv);
        taskTimerIv = null;
      }
      const elapsed = (Date.now() - startTs) / 1000;
      const speedRatio = Math.max(0, 1 - elapsed / totalSec);
      const res = AppState.recordTaskResult({
        correct: isOk,
        category: actualCat,
        diffIdx: diff,
        speedRatio
      });

      refreshStreakHeader();

      if (isOk) {
        SFX.correct();
        fbEl.innerHTML = `
          <div style="background:rgba(0,230,118,0.13); border:1px solid rgba(0,230,118,0.4); border-radius:14px; padding:12px;">
            <div style="font-weight:800; color:var(--emerald); font-size:15px;">
              ✅ Отлично! Начислено +${GameCore.fmt(res.earnedCoins)} 🪙 и +${res.earnedXp} XP
            </div>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">${task.explain}</div>
          </div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-emerald btn-lg" id="ta-next" style="flex:2">Следующая задача ⚡</button>
            <button class="btn btn-gold" id="ta-play-casino" style="flex:1">🎰 В казино</button>
          </div>
        `;
      } else {
        SFX.wrong();
        const fineTag = res.penaltyCoins > 0 ? ` · Штраф −${res.penaltyCoins} 🪙` : '';
        fbEl.innerHTML = `
          <div style="background:rgba(255,61,113,0.13); border:1px solid rgba(255,61,113,0.4); border-radius:14px; padding:12px;">
            <div style="font-weight:800; color:var(--crimson); font-size:15px;">
              ❌ Ошибка${customWrongText ? ': ' + customWrongText : ''}${res.shieldUsed ? ' (🛡️ Щит спас комбо!)' : fineTag}
            </div>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">${task.explain}</div>
          </div>
          <button class="btn btn-purple btn-lg btn-block" id="ta-next" style="margin-top:10px;">Попробовать следующую задачу →</button>
        `;
      }

      const nextB = fbEl.querySelector('#ta-next');
      if (nextB) nextB.onclick = () => spawnTaskInArena(arena);
      const goCas = fbEl.querySelector('#ta-play-casino');
      if (goCas) goCas.onclick = () => navigate('lobby');
    }

    if (task.type === 'choice') {
      bodyEl.innerHTML = `
        <div class="task-question-box">${task.question}</div>
        <div class="answers-grid" id="ta-opts"></div>
      `;
      const optsGrid = bodyEl.querySelector('#ta-opts');
      task.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          optsGrid.querySelectorAll('button').forEach((b) => {
            b.disabled = true;
            if (b.textContent === task.answer) b.classList.add('correct');
          });
          const ok = opt === task.answer;
          if (!ok) btn.classList.add('wrong');
          finishTask(ok, `правильный ответ ${task.answer}`);
        };
        optsGrid.appendChild(btn);
      });
    } else if (task.type === 'memory') {
      const N = task.size;
      const targetSet = new Set(task.targets);
      const foundSet = new Set();
      let canClick = false;

      bodyEl.innerHTML = `
        <div style="text-align:center; font-weight:700; font-size:14px; margin-top:12px; color:var(--gold-light);" id="mem-hint">
          👀 Запомните подсвеченные нейро-узлы (${task.targets.length} шт.)!
        </div>
        <div class="memory-grid" id="mem-grid" style="grid-template-columns:repeat(${N}, 1fr);"></div>
      `;
      const grid = bodyEl.querySelector('#mem-grid');
      const hint = bodyEl.querySelector('#mem-hint');
      const cells = [];

      for (let i = 0; i < N * N; i++) {
        const c = document.createElement('div');
        c.className = `mem-cell ${targetSet.has(i) ? 'lit' : ''}`;
        c.onclick = () => {
          if (!canClick || solved || foundSet.has(i)) return;
          if (targetSet.has(i)) {
            foundSet.add(i);
            c.classList.add('found');
            SFX.gem(foundSet.size);
            hint.textContent = `Найдено: ${foundSet.size} из ${targetSet.size}`;
            if (foundSet.size === targetSet.size) {
              canClick = false;
              finishTask(true);
            }
          } else {
            c.classList.add('mistake');
            canClick = false;
            cells.forEach((el, idx) => {
              if (targetSet.has(idx) && !foundSet.has(idx)) el.classList.add('lit');
            });
            finishTask(false, 'выбрана пустая клетка');
          }
        };
        cells.push(c);
        grid.appendChild(c);
      }

      setTimeout(() => {
        if (solved) return;
        cells.forEach((c) => c.classList.remove('lit'));
        startTs = Date.now();
        canClick = true;
        if (hint) hint.textContent = `👆 Нажмите все ${targetSet.size} запомненных клеток без промахов!`;
      }, task.showMs);
    } else if (task.type === 'stroop') {
      let stepIdx = 0;

      function renderStroopStep() {
        const step = task.steps[stepIdx];
        bodyEl.innerHTML = `
          <div style="text-align:center; margin-top:10px; font-size:13px; color:var(--text-secondary);">
            Раунд внимания <b class="num">${stepIdx + 1}/${task.steps.length}</b>
          </div>
          <div style="text-align:center; font-weight:800; font-size:15px; margin-top:6px; color:var(--cyan);">
            ${step.modeLabel}
          </div>
          <div class="task-question-box" style="font-size:34px; letter-spacing:2px; color:${step.inkHex};">
            ${step.wordText}
          </div>
          <div class="answers-grid" id="st-opts"></div>
        `;
        const box = bodyEl.querySelector('#st-opts');
        task.colors.forEach((col) => {
          const btn = document.createElement('button');
          btn.className = 'answer-btn';
          btn.innerHTML = `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${col.hex};margin-right:6px;"></span>${col.label}`;
          btn.onclick = () => {
            if (col.id === step.correctId) {
              stepIdx++;
              if (stepIdx >= task.steps.length) {
                finishTask(true);
              } else {
                SFX.tap();
                renderStroopStep();
              }
            } else {
              btn.classList.add('wrong');
              finishTask(false, 'сработал автоматический рефлекс Струпа');
            }
          };
          box.appendChild(btn);
        });
      }
      renderStroopStep();
    }
  }

      };
    };

    main.querySelector('#prof-export').onclick = () => {
      try {
        const raw = localStorage.getItem('brainroyale_state_v1');
        const payload = { app: 'brainroyale', version: 1, savedAt: new Date().toISOString(), state: raw ? JSON.parse(raw) : {} };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'brainroyale-save-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
        UI.toast('Сохранение скачано', 'win');

        UI.toast('Не удалось сохранить: ' + ((e && e.message) || e), 'loss');

      if (!f) return;
      if (f.size > 2 * 1024 * 1024) { UI.toast('Файл слишком большой', 'loss'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          const stObj = (parsed && parsed.app === 'brainroyale') ? parsed.state : parsed;
          if (!stObj || typeof stObj !== 'object' || Array.isArray(stObj)) throw new Error('Это не файл сохранения BrainRoyale');
          if (stObj.coins !== undefined && typeof stObj.coins !== 'number') throw new Error('Поле «coins» повреждено');
          const soloMode = !(window.BR_FB && window.BR_FB.enabled);
          UI.openModal(`
            <h3 style="margin-top:0;">Загрузить сохранение?</h3>
            <p style="font-size:13px; color:var(--text-secondary);">Прогресс, ачивки, прокачка и квесты будут <b>заменены</b> данными из файла.<br><br>
            ${soloMode
              ? 'Оффлайн-режим: будет восстановлен и баланс из файла (обманывать тут некого — игра полностью локальная).'
              : '🛡️ <b>Баланс НЕ восстанавливается из файла</b> — он берётся из облака/текущего прогресса. Откатить проигранное обратно нельзя.'}</p>

            </div>
          `);
          document.getElementById('confirm-import').onclick = () => {
            try {
              let toSave = stObj;
              if (!soloMode) {
                const current = AppState.get();
                toSave = { ...stObj, coins: current.coins, jackpotPool: current.jackpotPool };
              }
              localStorage.setItem('brainroyale_state_v1', JSON.stringify(toSave));
              UI.closeModal();
              UI.toast(soloMode ? 'Сохранение загружено!' : 'Остальное загружено, баланс — из облака', 'gold');
              setTimeout(() => window.location.reload(), 700);
            } catch (e) {
              UI.toast('Не удалось записать сохранение', 'loss');
            }
          };
        } catch (e) {
          UI.toast('Ошибка файла: ' + ((e && e.message) || e), 'loss');
        }
      };
      reader.readAsText(f);
    };

    main.querySelector('#prof-errorlog').onclick = () => {
      const errs = (window.BR_ERROR_LOG && window.BR_ERROR_LOG.read()) || [];
      const report = [
        'BrainRoyale ' + (window.BR_VERSION || '?') + ' · Отчёт об ошибке',
        'Дата: ' + new Date().toLocaleString(),
        'Платформа: ' + (navigator.userAgent || 'unknown'),
        'Ошибок в журнале: ' + errs.length,
        ''
      ].concat(errs.map((e, i) => (i + 1) + '. [' + new Date(e.t).toLocaleString() + '] ' + e.msg + (e.extra ? ' @ ' + e.extra : ''))).join('\n');
      UI.openModal(`
        <h3 style="margin-top:0;">🐞 Отчёт об ошибке</h3>
        <p style="font-size:12px; color:var(--text-secondary);">Если игра зависла или что-то сломалось — скопируй отчёт и отправь разработчику. Личные данные не собираются.</p>
        <textarea id="err-report" readonly style="width:100%; height:170px; box-sizing:border-box; background:#0d1326; color:#9fd0ff; border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:10px; font-size:11px; font-family:ui-monospace,monospace;"></textarea>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn btn-ghost" style="flex:1" id="err-clear">Очистить журнал</button>
          <button class="btn btn-emerald" style="flex:2" id="err-copy">📋 Копировать</button>
        </div>
      `);
      document.getElementById('err-report').value = report;
      document.getElementById('err-copy').onclick = async () => {
        try {
          await navigator.clipboard.writeText(report);
          UI.toast('Отчёт скопирован!', 'win');
        } catch (_) {
          const ta = document.getElementById('err-report');
          ta.select();
          try { document.execCommand('copy'); UI.toast('Отчёт скопирован!', 'win'); }
          catch (e2) { UI.toast('Выдели текст и скопируй вручную', 'gold'); }
        }
      };
      document.getElementById('err-clear').onclick = () => {
        if (window.BR_ERROR_LOG) window.BR_ERROR_LOG.clear();
        UI.closeModal();
        UI.toast('Журнал очищен', 'info');
      };
    };
  }

  function renderMain() {
    const main = document.getElementById('main-content');
    if (!main) return;
    if (currentTab === 'lobby') renderLobby(main);
    else if (currentTab === 'earn') renderEarn(main);
    else if (currentTab === 'friends' && window.SocialArena) window.SocialArena.renderFriendsTab(main);
    else if (currentTab === 'lab') renderLab(main);
    else if (currentTab === 'profile') renderProfile(main);
  }

  // Android Hardware Back Button hook called from MainActivity.java!
  window.handleAndroidBack = function () {
    if (document.getElementById('active-modal')) {
      UI.closeModal();
      return true;
    }
    if (activeGame) {
      navigate('lobby');
      return true;
    }
    if (currentTab !== 'lobby') {
      navigate('lobby');
      return true;
    }
    return false;
  };

  function init() {
    AppState.subscribe((ev) => {
      updateHeader();
      if (ev && ev.type === 'jackpot' && window.UI) {
        UI.toast(`🏆 МЕГА-ДЖЕКПОТ СОРВАН: +${GameCore.fmt(ev.amount)} 🪙!`, 'gold');
      }
    });

    document.getElementById('brand-home').onclick = () => navigate('lobby');
    document.getElementById('hdr-earn-btn').onclick = () => {
      SFX.tap();
      navigate('earn');
    };
    document.getElementById('hdr-mute-btn').onclick = () => {
      AppState.toggleMute();
      updateHeader();
    };

    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.onclick = () => {
        SFX.tap();
        navigate(btn.dataset.tab);
      };
    });

    const stTop = document.getElementById('scroll-top');
    if (stTop) {
      window.addEventListener('scroll', () => {
        stTop.classList.toggle('visible', (window.scrollY || document.documentElement.scrollTop || 0) > 420);
      }, { passive: true });
      stTop.onclick = () => {
        try { if (window.BR_HAPTIC) window.BR_HAPTIC.impact('light'); } catch (_) {}
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }

    updateHeader();
    renderMain();
  }

  document.addEventListener('DOMContentLoaded', init);

  return {
    navigate,
    openGame
  };
})();

  </script>
</body>
</html>
