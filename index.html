              held: held[idx],
              dataIdx: phase === 'hold' ? idx : undefined
            })
          ).join('');

          if (phase === 'hold') {
            cardsEl.querySelectorAll('[data-card-idx]').forEach((cardNode) => {
              cardNode.onclick = () => {
                const idx = Number(cardNode.dataset.cardIdx);
                SFX.tap();
                held[idx] = !held[idx];
                renderStage();
              };
            });
          }
        }

        if (phase === 'hold') {
          const curCombo = evaluatePoker(hand);
          msgEl.innerHTML = curCombo
            ? `✨ Сейчас на руках: <b style="color:var(--gold-light)">${curCombo.name} (x${curCombo.mult})</b>! Выберите карты HOLD и нажмите «Завершить / Обменять»`
            : 'Нажмите на карты для удержания (HOLD), затем обменяйте остальные';
          drawWrap.innerHTML = `<button class="btn btn-emerald btn-lg btn-block" id="vp-draw-btn">🔄 ${held.every(Boolean) ? 'Оставить все 5 карт и забрать' : 'Обменять неудержанные карты'}</button>`;
          drawWrap.querySelector('#vp-draw-btn').onclick = () => {
            SFX.card();
            for (let i = 0; i < 5; i++) {
              if (!held[i]) hand[i] = deck.pop();
            }
            phase = 'done';
            const res = evaluatePoker(hand);
            if (res) {
              const win = AppState.winPayout(currentBet * res.mult, res.mult);
              if (res.mult >= 4) AppState.unlockAchievement('poker_pro');
              SFX.win();
              winBanner = `🏆 ${res.name}! Выигрыш +${GameCore.fmt(win)} 🪙 (x${res.mult})`;
              UI.toast(winBanner, 'win');
            } else {
              SFX.wrong();
              winBanner = 'Комбинация не собрана (нужна пара Валетов или старше)';
            }
            msgEl.textContent = winBanner;
            drawWrap.innerHTML = '';
            renderStage();
            renderBet();
          };
        } else {
          drawWrap.innerHTML = '';
        }
      }

      function renderBet() {
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          actionLabel: '♠️ Раздать 5 карт',
          disabled: phase === 'hold',
          onAction(bet) {
            if (!AppState.placeBet(bet, 'videopoker')) return;
            SFX.card();
            currentBet = bet;
            deck = GameCore.createDeck(1);
            hand = [deck.pop(), deck.pop(), deck.pop(), deck.pop(), deck.pop()];
            held = [false, false, false, false, false];

            if (GameCore.hasScanner()) {
              const dealtCombo = evaluatePoker(hand);
              if (dealtCombo && ['rf', 'sf', 'fh', 'fl', 'st'].includes(dealtCombo.id)) {
                held = [true, true, true, true, true];
              } else {
                const cnt = {};
                hand.forEach((c) => (cnt[c.order] = (cnt[c.order] || 0) + 1));
                hand.forEach((c, idx) => {
                  if (cnt[c.order] >= 2) held[idx] = true;
                });
              }
            }
            phase = 'hold';
            renderStage();
            renderBet();
          }
        });
      }

      renderStage();
      renderBet();
    }
  });

  let baccaratCleanup = null;

  GameCore.registerGame({

    title: 'Баккара (Punto Banco)',
    icon: '👑',
    category: 'cards',
    tag: 'VIP СТОЛ',
    tagColor: '#ffb800',
    glow: '#ffb800',
    maxWin: 'x9 (Ничья)',
    rtp: '98.9%',
    desc: 'Аристократическая карточная игра: ставь на Игрока (x2), Банкира (x1.95) или Ничью (x9)!',
    mathInfo: 'В Баккаре ставка на Банкира имеет один из самых низких перевесов казино в мире — всего 1.06% (RTP 98.94%), а на Игрока — 1.24% (RTP 98.76%). Очки считаются по последней цифре суммы (модуль 10).',
    unmount() {
      if (baccaratCleanup) {
        baccaratCleanup();
        baccaratCleanup = null;
      }
    },
    mount(root) {
      let side = 'player';
      let pCards = [];
      let bCards = [];
      let statusMsg = 'Выберите исход и сделайте ставку';
      let autoDeal = false;
      let autoCount = 0;
      let autoBetVal = 25;
      let autoIv = null;

      baccaratCleanup = () => {
        autoDeal = false;
        if (autoIv) clearInterval(autoIv);
      };

      function bVal(c) {
        if (c.rank === 'A') return 1;
        if (['10', 'J', 'Q', 'K'].includes(c.rank)) return 0;
        return Number(c.rank);
      }
      function bSum(arr) {
        return arr.reduce((s, c) => s + bVal(c), 0) % 10;
      }

      root.innerHTML = `
        <div class="game-stage">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:center;">
            <div>
              <div style="font-size:12px; color:var(--cyan); margin-bottom:6px;">ИГРОК: <b class="num" id="bc-pscore">-</b></div>

            </div>
            <div>
              <div style="font-size:12px; color:var(--gold-light); margin-bottom:6px;">БАНКИР: <b class="num" id="bc-bscore">-</b></div>

        </div>
        <div class="bet-panel" id="bc-bet"></div>
      `;

      const pEl = root.querySelector('#bc-pcards');
      const bEl = root.querySelector('#bc-bcards');
      const pSc = root.querySelector('#bc-pscore');
      const bSc = root.querySelector('#bc-bscore');
      const msgEl = root.querySelector('#bc-msg');
      const betPanel = root.querySelector('#bc-bet');

      function renderHands() {
        pEl.innerHTML = pCards.length ? pCards.map((c) => GameCore.renderCardHTML(c)).join('') : GameCore.renderCardHTML(null, { hidden: true });
        bEl.innerHTML = bCards.length ? bCards.map((c) => GameCore.renderCardHTML(c)).join('') : GameCore.renderCardHTML(null, { hidden: true });
        pSc.textContent = pCards.length ? bSum(pCards) : '—';
        bSc.textContent = bCards.length ? bSum(bCards) : '—';
        msgEl.innerHTML = statusMsg;
      }

      function dealHand(bet) {
        if (!AppState.placeBet(bet, 'baccarat')) {
          if (autoDeal) {
            autoDeal = false;
            if (autoIv) clearInterval(autoIv);
            UI.toast('⏹️ Авто-раздача остановлена: закончились монеты!', 'loss');
          }
          renderBet();
          return false;
        }
        SFX.card();
        const deck = GameCore.createDeck(4);
        pCards = [deck.pop(), deck.pop()];
        bCards = [deck.pop(), deck.pop()];

        let pTotal = bSum(pCards);
        let bTotal = bSum(bCards);

        if (pTotal < 8 && bTotal < 8) {
          let pThird = null;
          if (pTotal <= 5) {
            pThird = deck.pop();
            pCards.push(pThird);
            pTotal = bSum(pCards);
          }
          if (!pThird) {
            if (bTotal <= 5) bCards.push(deck.pop());
          } else {
            const pt = bVal(pThird);
            if (
              bTotal <= 2 ||
              (bTotal === 3 && pt !== 8) ||
              (bTotal === 4 && pt >= 2 && pt <= 7) ||
              (bTotal === 5 && pt >= 4 && pt <= 7) ||
              (bTotal === 6 && (pt === 6 || pt === 7))
            ) {
              bCards.push(deck.pop());
            }
          }
          bTotal = bSum(bCards);
        }

        const outcome = pTotal > bTotal ? 'player' : bTotal > pTotal ? 'banker' : 'tie';
        let payout = 0;
        if (side === outcome) {
          const m = outcome === 'player' ? 2 : outcome === 'banker' ? 1.95 : 9;
          payout = AppState.winPayout(Math.round(bet * m), m);
          SFX.win();
          statusMsg = `🎉 Победил ${outcome === 'player' ? 'Игрок' : outcome === 'banker' ? 'Банкир' : 'Ничья'} (${pTotal}:${bTotal})! Выигрыш +${GameCore.fmt(payout)} 🪙`;
        } else if (outcome === 'tie' && side !== 'tie') {
          payout = AppState.winPayout(bet, 1);
          SFX.tap();
          statusMsg = `🤝 Ничья (${pTotal}:${bTotal}) — возврат ставки ${GameCore.fmt(bet)} 🪙`;
        } else {
          SFX.wrong();
          statusMsg = `Счёт ${pTotal}:${bTotal} — победил ${outcome === 'player' ? 'Игрок' : outcome === 'banker' ? 'Банкир' : 'Ничья'}`;
        }
        renderHands();
        renderBet();
        return true;
      }

      function renderBet() {
        if (!document.body.contains(betPanel)) return;
        const extra = `
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
            ${[
              ['player', '👤 Игрок (x2)'],
              ['tie', '🤝 Ничья (x9)'],
              ['banker', '🏦 Банкир (x1.95)']
            ].map(([k, lbl]) => `
              <button class="preset-btn bc-side" data-s="${k}" ${autoDeal ? 'disabled' : ''} style="padding:10px 6px; ${side === k ? 'border-color:var(--gold); color:#fff; background:rgba(255,184,0,0.18);' : ''}">${lbl}</button>
            `).join('')}
          </div>
        `;
        GameCore.renderBetControls(betPanel, {
          minBet: 10,
          actionLabel: '👑 Раздать партию',
          extraHTML: extra,
          autoSpin: {
            active: autoDeal,
            count: autoCount,
            label: '🔄 Авто',
            onToggle(bet) {
              if (autoDeal) {
                autoDeal = false;
                if (autoIv) clearInterval(autoIv);
                renderBet();
              } else {
                autoDeal = true;
                autoCount = 1;
                autoBetVal = bet;
                if (!dealHand(bet)) return;
                autoIv = setInterval(() => {
                  if (!autoDeal || !document.body.contains(betPanel)) {
                    clearInterval(autoIv);
                    return;
                  }
                  autoCount++;
                  dealHand(autoBetVal);
                }, 900);
              }
            }
          },
          onAction: dealHand
        });

        betPanel.querySelectorAll('.bc-side').forEach((b) => {
          b.onclick = () => {
            if (autoDeal) return;
            SFX.tap();
            side = b.dataset.s;
            renderBet();
          };
        });
      }

      renderHands();
      renderBet();
    }
  });
})();

// Games 11-15: Hi-Lo Card Streak, Mega Wheel of Fortune, Keno 40, Quantum Coin Flip, Cyber Thimbles
(function () {
  // =========================================================================
  // 11. HI-LO CARD STREAK (ХАЙ-ЛОУ)
  // =========================================================================
  let hiloCleanup = null;

  GameCore.registerGame({
    id: 'hilo',
    title: 'Хай-Лоу (Hi-Lo)',
    icon: '🂡',
    category: 'cards',
    tag: 'СЕРИЯ',
    tagColor: '#00e676',
    glow: '#00e676',
    maxWin: 'x500+',
    rtp: '97.0%',
    desc: 'Угадывай, будет следующая карта выше или ниже текущей! Чем сложнее прогноз, тем выше кэф.',
    mathInfo: 'Ранги карт от 2 до Туза (14). Для карт 3..K ставки «Выше/Равна» и «Ниже/Равна», а для крайних карт (2 и Туз) — «Строго выше/ниже» (12/13, x1.05) или «Та же карта» (1/13, x12.61). Множитель шага = 0.97 / Вероятность.',
    unmount() {
      if (hiloCleanup) {
        hiloCleanup();
        hiloCleanup = null;
      }
    },
    mount(root) {
      let deck = GameCore.createDeck(2);
      let active = false;
      let betAmount = 0;
      let cumMult = 1.0;
      let curCard = deck.pop();
      let prevCards = [];
      let skipsLeft = 2;

      hiloCleanup = () => {
        if (active && betAmount > 0) {
          AppState.winPayout(Math.round(betAmount * cumMult), cumMult);
          active = false;
        }
      };

      function nextCard() {
        if (deck.length < 10) deck = GameCore.createDeck(2);
        return deck.pop();
      }

      function getChoices(order) {
        if (order === 2) {
          return {
            top: { mode: 'gt', label: '⬆️ Строго выше (3..A)', prob: 12 / 13 },
            bot: { mode: 'eq', label: '🟰 Та же (Двойка)', prob: 1 / 13 }
          };
        }
        if (order === 14) {
          return {
            top: { mode: 'eq', label: '🟰 Та же (Туз)', prob: 1 / 13 },
            bot: { mode: 'lt', label: '⬇️ Строго ниже (2..K)', prob: 12 / 13 }
          };
        }
        return {
          top: { mode: 'ge', label: '⬆️ Выше / Равна', prob: (15 - order) / 13 },
          bot: { mode: 'le', label: '⬇️ Ниже / Равна', prob: (order - 1) / 13 }
        };
      }

      root.innerHTML = `
        <div class="game-stage" id="hl-stage"></div>
        <div class="bet-panel" id="hl-bet"></div>
      `;

      const stage = root.querySelector('#hl-stage');
      const betPanel = root.querySelector('#hl-bet');

      function renderStage() {
        const ch = getChoices(curCard.order);
        const topMult = Number((0.94 / ch.top.prob).toFixed(2));
        const botMult = Number((0.94 / ch.bot.prob).toFixed(2));
        const pot = Math.round(betAmount * cumMult);

        stage.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-secondary); margin-bottom:10px;">
            <span>Текущий множитель: <b class="num" style="color:var(--gold-light)">${cumMult.toFixed(2)}x</b></span>
            <span>Карта: 2 — младшая, A — старшая</span>
          </div>
          <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin:14px 0;">
            ${GameCore.renderCardHTML(curCard)}
          </div>
          ${prevCards.length ? `
            <div style="font-size:11px; color:var(--text-muted); text-align:center; margin-bottom:10px;">
              История серии: ${prevCards.slice(-6).map((c) => `<span style="color:${c.red ? '#ff6b93' : '#d0d8f0'}">${c.rank}${c.suit}</span>`).join(' → ')}
            </div>
          ` : ''}

          ${active ? `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <button class="btn btn-purple num" id="hl-top">
                ${ch.top.label} (${topMult}x)${GameCore.hasScanner() ? ` [${Math.round(ch.top.prob * 100)}%]` : ''}
              </button>
              <button class="btn btn-purple num" id="hl-bot">
                ${ch.bot.label} (${botMult}x)${GameCore.hasScanner() ? ` [${Math.round(ch.bot.prob * 100)}%]` : ''}
              </button>
              <button class="btn btn-ghost" id="hl-skip" ${skipsLeft <= 0 ? 'disabled' : ''}>
                ⏭️ Сменить карту (${skipsLeft})
              </button>
              <button class="btn btn-emerald num" id="hl-cash" ${cumMult <= 1.0 ? 'disabled' : ''}>
                💰 Забрать ${GameCore.fmt(pot)} 🪙
              </button>
            </div>
          ` : `
            <div style="text-align:center; font-size:13px; color:var(--text-secondary);">Сделайте ставку, чтобы начать карточную серию Hi-Lo</div>
          `}
        `;

        if (active) {
          stage.querySelector('#hl-top').onclick = () => guess(ch.top.mode, topMult);
          stage.querySelector('#hl-bot').onclick = () => guess(ch.bot.mode, botMult);
          stage.querySelector('#hl-skip').onclick = () => {
            if (skipsLeft <= 0) return;
            skipsLeft--;
            SFX.card();
            curCard = nextCard();
            renderStage();
          };
          const cb = stage.querySelector('#hl-cash');
          if (cb) {
            cb.onclick = () => {
              const win = AppState.winPayout(Math.round(betAmount * cumMult), cumMult);
              active = false;
              SFX.win();
              UI.toast(`🂡 Серия Hi-Lo завершена: +${GameCore.fmt(win)} 🪙 (${cumMult.toFixed(2)}x)!`, 'win');
              renderStage();
              renderBet();
            };
          }
        }
      }

      function guess(mode, stepM) {
        const nxt = nextCard();
        const prevOrder = curCard.order;
        prevCards.push(curCard);
        let ok = false;
        if (mode === 'ge') ok = nxt.order >= prevOrder;
        else if (mode === 'le') ok = nxt.order <= prevOrder;
        else if (mode === 'gt') ok = nxt.order > prevOrder;
        else if (mode === 'lt') ok = nxt.order < prevOrder;
        else if (mode === 'eq') ok = nxt.order === prevOrder;

        curCard = nxt;
        if (ok) {
          cumMult = Number((cumMult * stepM).toFixed(2));
          SFX.gem(prevCards.length);
          renderStage();
        } else {
          active = false;
          SFX.wrong();
          UI.toast(`❌ Выпала ${nxt.rank}${nxt.suit} — серия прервалась`, 'loss');
          renderStage();
          renderBet();
        }
      }

      function renderBet() {
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          actionLabel: '🂡 Начать серию Hi-Lo',
          disabled: active,
          onAction(bet) {
            if (!AppState.placeBet(bet, 'hilo')) return;
            SFX.card();
            betAmount = bet;
            cumMult = 1.0;
            skipsLeft = 2;
            prevCards = [];
            curCard = nextCard();
            active = true;
            renderStage();
            renderBet();
          }
        });
      }

      renderStage();
      renderBet();
    }
  });

  // =========================================================================
  // 12. MEGA WHEEL OF FORTUNE (КОЛЕСО ФОРТУНЫ)
  // =========================================================================
  const WHEEL_SEGMENTS = [
    1, 2, 1, 5, 1, 2, 1, 10, 1, 2,
    1, 5, 1, 2, 1, 20, 1, 2, 1, 5,
    1, 2, 1, 10, 1, 2, 5, 1, 2, 40
  ];
  const SEG_COLORS = {
    1: '#3949ab',
    2: '#00bfa5',
    5: '#ffb300',
    10: '#8e24aa',
    20: '#ff6d00',
    40: '#ff1744'
  };
  let megaWheelRAF = null;
  let megaWheelCleanup = null;

  GameCore.registerGame({
    id: 'wheel',
    title: 'Колесо Фортуны',
    icon: '🎯',
    category: 'table',
    tag: 'x40 ШОУ',
    tagColor: '#ffb800',
    glow: '#ffb800',
    maxWin: 'x41',
    rtp: '96.7%',
    desc: 'Шоу-колесо на 30 секторов! Ставь фишки на сектора x1, x2, x5, x10, x20 и джекпот x40!',
    mathInfo: 'На колесе 30 секторов: x1 (14 шт), x2 (8 шт), x5 (4 шт), x10 (2 шт), x20 (1 шт), x40 (1 шт). При попадании ставка возвращается ПЛЮС выигрыш (ставка × множитель).',
    unmount() {
      if (megaWheelRAF) cancelAnimationFrame(megaWheelRAF);
      megaWheelRAF = null;
      if (megaWheelCleanup) {
        megaWheelCleanup();
        megaWheelCleanup = null;
      }
    },
    mount(root) {
      let chip = 25;
      let bets = {};
      let lastWheelBets = null;
      let autoSpin = false;
      let autoCount = 0;
      let autoNextTimer = null;
      let angle = 0;
      let spinning = false;
      let pendingWheelOutcome = null;
      let lastHit = null;

      megaWheelCleanup = () => {
        autoSpin = false;
        if (autoNextTimer) clearTimeout(autoNextTimer);
        if (spinning && pendingWheelOutcome) {
          if (pendingWheelOutcome.payout > 0) {
            AppState.winPayout(pendingWheelOutcome.payout, pendingWheelOutcome.payout / pendingWheelOutcome.total);
          }
          spinning = false;
          pendingWheelOutcome = null;
        }
      };

      root.innerHTML = `
        <div class="game-stage" style="display:flex; flex-direction:column; align-items:center;">
          <div style="position:relative; width:240px; height:240px;">
            <div style="position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:24px; z-index:4; filter:drop-shadow(0 3px 4px #000);">🔻</div>
            <canvas id="mw-canvas" width="260" height="260" style="width:240px; height:240px;"></canvas>
          </div>
          <div id="mw-msg" style="margin:8px 0; font-weight:800; font-size:14px; color:var(--gold-light); text-align:center;">
            Поставьте фишки на один или несколько множителей
          </div>
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; margin-top:6px;" id="mw-sectors"></div>
        </div>
        <div class="bet-panel" id="mw-ctrl"></div>
      `;

      const canvas = root.querySelector('#mw-canvas');
      const ctx = canvas.getContext('2d');
      const msgEl = root.querySelector('#mw-msg');
      const secBox = root.querySelector('#mw-sectors');
      const ctrlBox = root.querySelector('#mw-ctrl');

      function drawWheel() {
        const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2, R = 118;
        ctx.clearRect(0, 0, W, H);
        const N = WHEEL_SEGMENTS.length;
        const slice = (Math.PI * 2) / N;

        for (let i = 0; i < N; i++) {
          const m = WHEEL_SEGMENTS[i];
          const a0 = angle + i * slice;
          const a1 = a0 + slice;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, a0, a1);
          ctx.closePath();
          ctx.fillStyle = SEG_COLORS[m];
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(a0 + slice / 2);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px monospace';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(`x${m}`, R - 10, 0);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 34, 0, Math.PI * 2);
        ctx.fillStyle = '#0c1120';
        ctx.fill();
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(lastHit ? `x${lastHit}` : '🎯', cx, cy);
      }

      function sumBets() {
        return Object.values(bets).reduce((a, b) => a + b, 0);
      }

      function renderSectors() {
        secBox.innerHTML = [1, 2, 5, 10, 20, 40].map((m) => `
          <button class="r-cell num" data-m="${m}" style="background:${SEG_COLORS[m]}; padding:12px 6px; font-size:15px;">
            x${m}
            ${bets[m] ? `<span class="r-chip-badge num">${bets[m]}</span>` : ''}
          </button>
        `).join('');

        secBox.querySelectorAll('[data-m]').forEach((btn) => {
          btn.onclick = () => {
            if (spinning) return;
            if (sumBets() + chip > AppState.get().coins) {
              SFX.wrong();
              GameCore.openQuickEarnModal(() => renderCtrl());
              return;
            }
            SFX.tap();
            const m = Number(btn.dataset.m);
            bets[m] = (bets[m] || 0) + chip;
            renderSectors();
            renderCtrl();
          };
        });
      }

      function spin() {
        if (spinning) return;
        if (sumBets() <= 0 && lastWheelBets) {
          bets = { ...lastWheelBets };
          renderSectors();
        }
        const total = sumBets();
        if (total <= 0) return;
        if (!AppState.placeBet(total, 'wheel')) {
          autoSpin = false;
          renderCtrl();
          return;
        }
        lastWheelBets = { ...bets };
        if (autoSpin) autoCount++;

        spinning = true;
        const N = WHEEL_SEGMENTS.length;
        const TWO_PI = Math.PI * 2;
        const slice = TWO_PI / N;
        const winIdx = Math.floor(Math.random() * N);
        const winMult = WHEEL_SEGMENTS[winIdx];
        const stakedOnWinner = bets[winMult] || 0;
        const payout = stakedOnWinner > 0 ? stakedOnWinner * (winMult + 1) : 0;
        pendingWheelOutcome = { payout, total };
        renderCtrl();

        angle = ((angle % TWO_PI) + TWO_PI) % TWO_PI;
        const desiredMod = ((-Math.PI / 2 - (winIdx + 0.5) * slice) % TWO_PI + TWO_PI) % TWO_PI;
        let delta = desiredMod - angle;
        if (delta < 0) delta += TWO_PI;
        const targetAngle = angle + TWO_PI * 5 + delta;

        const startAngle = angle;
        const t0 = performance.now();
        const dur = 3300;
        let lastSeg = -1;

        function anim(now) {
          const p = Math.min(1, (now - t0) / dur);
          const ease = 1 - Math.pow(1 - p, 3.4);
          angle = startAngle + (targetAngle - startAngle) * ease;
          const segNow = Math.floor(((angle % TWO_PI) + TWO_PI) / slice);
          if (segNow !== lastSeg) {
            lastSeg = segNow;
            SFX.tick(segNow);
          }
          drawWheel();
          if (p < 1) {
            megaWheelRAF = requestAnimationFrame(anim);
          } else {
            spinning = false;
            pendingWheelOutcome = null;
            lastHit = winMult;
            if (payout > 0) {
              AppState.winPayout(payout, payout / total);
              SFX.win();
              msgEl.innerHTML = `🎉 Сектор x${winMult}! Выигрыш: <span style="color:var(--emerald)">+${GameCore.fmt(payout)} 🪙</span>`;
              UI.toast(`🎯 Колесо: сектор x${winMult} (+${GameCore.fmt(payout)} 🪙)!`, 'win');
            } else {
              SFX.wrong();
              msgEl.textContent = `Выпал сектор x${winMult}. Попробуйте ещё!`;
            }
            bets = {};
            drawWheel();
            renderSectors();

            if (autoSpin && lastWheelBets) {
              const need = Object.values(lastWheelBets).reduce((a, b) => a + b, 0);
              autoNextTimer = setTimeout(() => {
                if (!autoSpin || !document.body.contains(ctrlBox)) return;
                if (AppState.get().coins < need) {
                  autoSpin = false;
                  UI.toast('⏹️ Автокрутка колеса остановлена: закончились монеты', 'loss');
                  renderCtrl();
                  return;
                }
                bets = { ...lastWheelBets };
                renderSectors();
                spin();
              }, 750);
            }
            renderCtrl();
          }
        }
        megaWheelRAF = requestAnimationFrame(anim);
      }

      function renderCtrl() {
        if (!document.body.contains(ctrlBox)) return;
        GameCore.setCustomPanelRefresh(() => {
          if (!spinning && document.body.contains(ctrlBox)) renderCtrl();
        });
        const sum = sumBets();
        const canRepeat = sum > 0 || !!lastWheelBets;
        const low = AppState.get().coins < 5 && sum === 0;
        ctrlBox.innerHTML = `
          ${low ? `
            <div class="low-coins-banner">
              <span style="font-size:13px; color:var(--emerald); font-weight:700;">🧠 Реши задачку и получи фишки!</span>
              <button class="btn btn-emerald" id="mw-earn">⚡ Заработать</button>
            </div>
          ` : ''}
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${[5, 10, 25, 50, 100, 250].map((v) => `
              <button class="preset-btn num mw-chip" data-v="${v}" style="${chip === v ? 'border-color:var(--gold); color:var(--gold-light);' : ''}" ${spinning || autoSpin ? 'disabled' : ''}>${v}</button>
            `).join('')}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost" id="mw-clr" style="flex:0.8" ${spinning || autoSpin || sum === 0 ? 'disabled' : ''}>Сброс</button>
            <button class="btn btn-gold btn-lg num" id="mw-go" style="flex:1.8" ${spinning || autoSpin || sum === 0 ? 'disabled' : ''}>🎯 Вращать (${GameCore.fmt(sum)} 🪙)</button>
            <button class="btn ${autoSpin ? 'btn-crimson' : 'btn-purple'} btn-lg num" id="mw-auto" style="flex:1.1" ${!autoSpin && !canRepeat ? 'disabled' : ''}>
              ${autoSpin ? `⏹️ СТОП (${autoCount})` : '🔄 Авто'}
            </button>
          </div>
        `;
        const eb = ctrlBox.querySelector('#mw-earn');
        if (eb) eb.onclick = () => GameCore.openQuickEarnModal(() => renderCtrl());
        ctrlBox.querySelectorAll('.mw-chip').forEach((b) => {
          b.onclick = () => {
            SFX.tap();
            chip = Number(b.dataset.v);
            renderCtrl();
          };
        });
        ctrlBox.querySelector('#mw-clr').onclick = () => {
          bets = {};
          renderSectors();
          renderCtrl();
        };
        ctrlBox.querySelector('#mw-go').onclick = spin;
        ctrlBox.querySelector('#mw-auto').onclick = () => {
          SFX.tap();
          if (autoSpin) {
            autoSpin = false;
            if (autoNextTimer) clearTimeout(autoNextTimer);
            renderCtrl();
          } else {
            if (sumBets() === 0 && lastWheelBets) {
              bets = { ...lastWheelBets };
              renderSectors();
            }
            if (sumBets() === 0) return;
            autoSpin = true;
            autoCount = 0;
            if (!spinning) spin();
            else renderCtrl();
          }
        };
      }

      drawWheel();
      renderSectors();
      renderCtrl();
    }
  });

  // =========================================================================
  // 13. KENO 40 (КЕНО ЛОТЕРЕЯ)
  // =========================================================================
  const KENO_PAYOUTS = {
    1: [0, 3.8],
    2: [0, 1.7, 5.2],
    3: [0, 1.0, 2.8, 13],
    4: [0, 0.5, 2.2, 6, 28],
    5: [0, 0.5, 1.4, 4, 14, 65],
    6: [0, 0, 1.1, 3, 9, 32, 110],
    7: [0, 0, 1.0, 2.2, 6, 18, 65, 160],
    8: [0, 0, 0.5, 1.8, 4.5, 12, 40, 100, 220],
    9: [0, 0, 0.5, 1.4, 3.5, 9, 28, 75, 150, 260],
    10: [0, 0, 0.5, 1.2, 2.8, 7, 20, 55, 120, 200, 350]
  };
  let kenoCleanup = null;

  GameCore.registerGame({
    id: 'keno',
    title: 'Кено 40 (Keno)',
    icon: '🔢',
    category: 'arcade',
    tag: 'x350',
    tagColor: '#00d4ff',
    glow: '#00d4ff',
    maxWin: 'x350',
    rtp: '97.0%',
    desc: 'Выбери от 1 до 10 счастливых чисел из 40 и лови совпадения с 10 выпавшими шарами!',
    mathInfo: 'Вероятность угадать ровно h чисел из m выбранных при розыгрыше 10 из 40 описывается гипергеометрическим распределением: C(m, h) × C(40−m, 10−h) / C(40, 10).',
    unmount() {
      if (kenoCleanup) {
        kenoCleanup();
        kenoCleanup = null;
      }
    },
    mount(root) {
      let picked = new Set([7, 13, 21, 28, 35]);
      let drawn = new Set();
      let busy = false;
      let autoDraw = false;
      let autoCount = 0;
      let autoBetVal = 25;
      let autoNextTimer = null;
      let kenoTimeouts = [];
      let pendingKenoSettle = null;

      kenoCleanup = () => {
        autoDraw = false;
        if (autoNextTimer) clearTimeout(autoNextTimer);
        kenoTimeouts.forEach((t) => clearTimeout(t));
        kenoTimeouts = [];
        if (busy && pendingKenoSettle) {
          pendingKenoSettle();
          pendingKenoSettle = null;
          busy = false;
        }
      };

      root.innerHTML = `
        <div class="game-stage">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:12px;">
            <span>Выбрано: <b class="num" id="kn-cnt">5</b>/10</span>
            <div style="display:flex; gap:6px;">
              <button class="preset-btn" id="kn-auto" style="padding:4px 9px;">🎲 Авто 5</button>
              <button class="preset-btn" id="kn-clear" style="padding:4px 9px;">Очистить</button>
            </div>
          </div>
          <div class="keno-grid" id="kn-grid"></div>
          <div id="kn-paybar" style="display:flex; gap:5px; overflow-x:auto; margin-top:10px; padding-top:8px; border-top:1px solid var(--border-subtle);"></div>
        </div>
        <div class="bet-panel" id="kn-bet"></div>
      `;

      const grid = root.querySelector('#kn-grid');
      const cntEl = root.querySelector('#kn-cnt');
      const payBar = root.querySelector('#kn-paybar');
      const betPanel = root.querySelector('#kn-bet');

      function renderGrid() {
        if (!document.body.contains(grid)) return;
        cntEl.textContent = picked.size;
        grid.innerHTML = '';
        for (let n = 1; n <= 40; n++) {
          const b = document.createElement('button');
          const isP = picked.has(n);
          const isD = drawn.has(n);
          b.className = `keno-num num ${isP && isD ? 'hit' : isP ? 'picked' : isD ? 'drawn' : ''}`;
          b.textContent = n;
          b.onclick = () => {
            if (busy) return;
            drawn.clear();
            if (picked.has(n)) picked.delete(n);
            else if (picked.size < 10) picked.add(n);
            SFX.tap();
            renderGrid();
          };
          grid.appendChild(b);
        }

        const table = KENO_PAYOUTS[picked.size] || [];
        let hits = 0;
        picked.forEach((n) => { if (drawn.has(n)) hits++; });
        payBar.innerHTML = table.map((m, idx) => `
          <div class="num" style="padding:5px 8px; border-radius:8px; font-size:11px; background:${drawn.size > 0 && idx === hits ? 'rgba(0,230,118,0.25)' : 'rgba(255,255,255,0.04)'}; border:1px solid ${drawn.size > 0 && idx === hits ? 'var(--emerald)' : 'transparent'}; white-space:nowrap;">
            ${idx} совп: <b style="color:var(--gold-light)">${m}x</b>
          </div>
        `).join('');
      }

      root.querySelector('#kn-auto').onclick = () => {
        if (busy) return;
        SFX.tap();
        picked.clear();
        drawn.clear();
        while (picked.size < 5) picked.add(Math.floor(Math.random() * 40) + 1);
        renderGrid();
      };
      root.querySelector('#kn-clear').onclick = () => {
        if (busy) return;
        SFX.tap();
        picked.clear();
        drawn.clear();
        renderGrid();
      };

      function doKenoDraw(bet) {
        if (busy) return;
        if (picked.size === 0) {
          autoDraw = false;
          UI.toast('Выберите хотя бы 1 число на поле!', 'loss');
          renderBet();
          return;
        }
        if (!AppState.placeBet(bet, 'keno')) {
          autoDraw = false;
          renderBet();
          return;
        }
        if (autoDraw) autoCount++;
        busy = true;
        drawn.clear();
        renderGrid();
        renderBet();

        const pool = Array.from({ length: 40 }, (_, i) => i + 1);
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const target10 = pool.slice(0, 10);
        const fullSet = new Set(target10);
        let settled = false;

        pendingKenoSettle = () => {
          if (settled) return;
          settled = true;
          let hits = 0;
          picked.forEach((x) => { if (fullSet.has(x)) hits++; });
          const m = (KENO_PAYOUTS[picked.size] || [])[hits] || 0;
          if (m > 0) AppState.winPayout(Math.round(bet * m), m);
        };

        const stepMs = autoDraw ? 55 : 90;
        kenoTimeouts = target10.map((num, idx) =>
          setTimeout(() => {
            drawn.add(num);
            if (picked.has(num)) SFX.gem(idx);
            else SFX.tick(idx);
            renderGrid();
            if (idx === 9 && !settled) {
              settled = true;
              pendingKenoSettle = null;
              busy = false;
              let hits = 0;
              picked.forEach((x) => { if (drawn.has(x)) hits++; });
              const m = (KENO_PAYOUTS[picked.size] || [])[hits] || 0;
              if (m > 0) {
                const win = AppState.winPayout(Math.round(bet * m), m);
                SFX.win();
                UI.toast(`🔢 Совпадений: ${hits}! Выигрыш +${GameCore.fmt(win)} 🪙 (${m}x)`, 'win');
              }
              if (autoDraw) {
                autoNextTimer = setTimeout(() => {
                  if (!autoDraw || !document.body.contains(betPanel)) return;
                  if (AppState.get().coins < autoBetVal) {
                    autoDraw = false;
                    UI.toast('⏹️ Авто-Кено остановлено: закончились монеты', 'loss');
                    renderBet();
                    return;
                  }
                  doKenoDraw(autoBetVal);
                }, 480);
              }
              renderBet();
            }
          }, (idx + 1) * stepMs)
        );
      }

      function renderBet() {
        if (!document.body.contains(betPanel)) return;
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          actionLabel: '🔢 Розыгрыш 10 шаров',
          disabled: busy,
          autoSpin: {
            active: autoDraw,
            count: autoCount,
            label: '🔄 Авто-Кено',
            onToggle(bet) {
              if (autoDraw) {
                autoDraw = false;
                if (autoNextTimer) clearTimeout(autoNextTimer);
                renderBet();
              } else {
                if (picked.size === 0) {
                  UI.toast('Выберите хотя бы 1 число на поле!', 'loss');
                  return;
                }
                autoDraw = true;
                autoCount = 0;
                autoBetVal = bet;
                if (!busy) doKenoDraw(bet);
                else renderBet();
              }
            }
          },
          onAction: doKenoDraw
        });
      }

      renderGrid();
      renderBet();
    }
  });

  // =========================================================================
  // 14. QUANTUM COIN FLIP STREAK (ОРЁЛ И РЕШКА НА СЕРИЮ)

    mathInfo: 'Честный бросок 50/50. Каждый успешный бросок подряд умножает банк: на k-м шаге множитель равен 0.94 × 2^k.',
    unmount() {
      if (coinCleanup) {

      }
    },
    mount(root) {

      let lastSide = 'brain';

      function curMult(s = streak) {

      }

      coinCleanup = () => {
        if (flipTimer) clearTimeout(flipTimer);
        if (active && betAmount > 0) {

        }
      };

      root.innerHTML = `
        <div class="game-stage" style="text-align:center;">
          <div style="font-size:13px; color:var(--text-secondary); margin-bottom:10px;">

      const stEl = root.querySelector('#cf-st');

      const actEl = root.querySelector('#cf-actions');

      function renderUI() {
        if (!document.body.contains(stEl)) return;
        stEl.textContent = streak;
        mEl.textContent = `${curMult().toFixed(2)}x`;
        coinEl.textContent = lastSide === 'brain' ? '🧠' : '⚛️';

        if (active) {
          const nextM = curMult(streak + 1);
          const cashVal = Math.round(betAmount * curMult());
          actEl.innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
              <button class="btn btn-purple btn-lg" id="cf-b" ${flipping ? 'disabled' : ''}>🧠 Мозг (${nextM}x)</button>
              <button class="btn btn-purple btn-lg" id="cf-a" ${flipping ? 'disabled' : ''}>⚛️ Атом (${nextM}x)</button>
            </div>
            ${streak > 0 ? `
              <button class="btn btn-emerald btn-lg btn-block num" id="cf-cash" ${flipping ? 'disabled' : ''}>
                💰 Забрать ${GameCore.fmt(cashVal)} 🪙 (${curMult()}x)
              </button>

          `;
          actEl.querySelector('#cf-b').onclick = () => flip('brain');
          actEl.querySelector('#cf-a').onclick = () => flip('atom');
          const cb = actEl.querySelector('#cf-cash');
          if (cb) {
            cb.onclick = () => {
              const win = AppState.winPayout(cashVal, curMult());
              active = false;
              SFX.win();
              UI.toast(`🪙 Серия ${streak} бросков: +${GameCore.fmt(win)} 🪙!`, 'win');
              renderUI();
              renderBet();
            };
          }
        } else {
          actEl.innerHTML = `<div style="font-size:13px; color:var(--text-secondary);">Сделайте ставку для старта серии удвоений</div>`;
        }
      }

      function flip(choice) {
        if (flipping || !active) return;
        flipping = true;
        SFX.tap();
        coinEl.style.transform = 'rotateY(720deg) scale(1.12)';
        renderUI();

        flipTimer = setTimeout(() => {
          flipTimer = null;
          coinEl.style.transform = 'rotateY(0deg) scale(1)';
          flipping = false;
          const res = Math.random() < 0.5 ? 'brain' : 'atom';
          lastSide = res;
          if (res === choice) {
            streak++;
            SFX.gem(streak);
          } else {
            active = false;
            streak = 0;
            SFX.wrong();
            UI.toast(`Выпал ${res === 'brain' ? '🧠 Мозг' : '⚛️ Атом'} — серия оборвалась`, 'loss');
            renderBet();
          }
          renderUI();
        }, 420);
      }

      function renderBet() {
        if (!document.body.contains(betPanel)) return;
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          actionLabel: '🪙 Начать серию бросков',
          disabled: active,
          onAction(bet) {
            if (!AppState.placeBet(bet, 'coinflip')) return;
            SFX.tap();
            betAmount = bet;
            streak = 0;
            active = true;
            renderUI();
            renderBet();
          }
        });
      }

      renderUI();
      renderBet();
    }
  });

  // =========================================================================
  // 15. CYBER THIMBLES (НАПЁРСТКИ С ФИЗИЧЕСКИМ ПЕРЕМЕШИВАНИЕМ)
  // =========================================================================
  let thimblesCleanup = null;

  GameCore.registerGame({
    id: 'thimbles',
    title: 'Напёрстки (Thimbles)',
    icon: '🥤',
    category: 'arcade',
    tag: 'ВНИМАНИЕ',
    tagColor: '#ff9100',
    glow: '#ff9100',
    maxWin: 'x2.82',
    rtp: '94.0%',
    desc: 'Квантовые напёрстки на бешеной скорости с вихревой телепортацией в финале!',
    mathInfo: 'Режим 1 сфера из 3 кубков выплачивает x2.82 (шанс 1/3), режим 2 сферы из 3 кубков выплачивает x1.41 (шанс 2/3). В финале кубки проходят через квантовый вихрь в центре с честным генератором вероятности (RTP 94%).',
    unmount() {
      if (thimblesCleanup) {
        thimblesCleanup();
        thimblesCleanup = null;
      }
    },
    mount(root) {
      let ballsCount = 1;
      let phase = 'idle'; // idle | shuffling | pick
      let betAmount = 0;
      let cupSlots = [0, 1, 2];
      let hasBall = [true, false, false];
      let lifted = [true, false, false];
      let tStart = null;
      let tEnd = null;
      let swapIv = null;

      // Responsive percentage positions so narrow 320px-360px screens never clip!
      const SLOT_LEFT = ['4%', '38%', '72%'];

      thimblesCleanup = () => {
        if (tStart) clearTimeout(tStart);
        if (tEnd) clearTimeout(tEnd);
        if (swapIv) clearInterval(swapIv);
        if (phase !== 'idle' && betAmount > 0) {
          AppState.winPayout(betAmount, 1);
          phase = 'idle';
        }
      };

      root.innerHTML = `
        <div class="game-stage">
          <div id="th-msg" style="text-align:center; font-weight:800; font-size:14px; color:var(--gold-light); margin-bottom:6px;">
            Сделайте ставку и следите за перемещением кубка!
          </div>
          <div class="thimbles-stage" id="th-stage">
            ${[0, 1, 2].map((id) => `
              <div class="thimble-cup" id="th-cup-${id}" style="left:${SLOT_LEFT[id]}">
                <div class="ball-under" id="th-ball-${id}">🔮</div>
                <div class="cup-visual">🥤</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="bet-panel" id="th-bet"></div>
      `;

      const msgEl = root.querySelector('#th-msg');
      const betPanel = root.querySelector('#th-bet');
      const cupEls = [0, 1, 2].map((id) => root.querySelector(`#th-cup-${id}`));
      const ballEls = [0, 1, 2].map((id) => root.querySelector(`#th-ball-${id}`));

      function syncPositions() {
        for (let id = 0; id < 3; id++) {
          cupEls[id].style.left = SLOT_LEFT[cupSlots[id]];
          cupEls[id].classList.toggle('lifted', lifted[id]);
          ballEls[id].style.visibility = lifted[id] && hasBall[id] ? 'visible' : 'hidden';
        }
      }

      cupEls.forEach((el, cupId) => {
        el.onclick = () => {
          if (phase !== 'pick') return;
          phase = 'idle';
          lifted = [true, true, true];
          syncPositions();
          if (hasBall[cupId]) {
            const m = ballsCount === 1 ? 2.82 : 1.41;
            const win = AppState.winPayout(Math.round(betAmount * m), m);
            SFX.win();
            msgEl.innerHTML = `🎯 Глаз-алмаз! Сфера найдена: <span style="color:var(--emerald)">+${GameCore.fmt(win)} 🪙 (${m}x)</span>`;
            UI.toast(`🥤 Напёрстки: +${GameCore.fmt(win)} 🪙!`, 'win');
          } else {
            SFX.wrong();
            msgEl.textContent = 'Мимо! Энерго-сфера оказалась под соседним кубком.';
          }
          renderBet();
        };
      });

      function startShuffle(bet) {
        if (!AppState.placeBet(bet, 'thimbles')) return;
        betAmount = bet;
        phase = 'shuffling';
        renderBet();

        hasBall = ballsCount === 1 ? [false, false, false] : [true, true, true];
        if (ballsCount === 1) hasBall[Math.floor(Math.random() * 3)] = true;
        else hasBall[Math.floor(Math.random() * 3)] = false;

        lifted = [true, true, true];
        syncPositions();
        msgEl.textContent = 'Запомните, где находится 🔮...';

        tStart = setTimeout(() => {
          lifted = [false, false, false];
          syncPositions();
          msgEl.textContent = '⚡ Турбо-перемешивание + квантовый вихрь...';

          let swaps = 0;
          const totalSwaps = 14;
          swapIv = setInterval(() => {
            const a = Math.floor(Math.random() * 3);
            let b = Math.floor(Math.random() * 3);
            while (b === a) b = Math.floor(Math.random() * 3);
            const tmp = cupSlots[a];
            cupSlots[a] = cupSlots[b];
            cupSlots[b] = tmp;
            SFX.tick(swaps);
            syncPositions();
            swaps++;
            if (swaps >= totalSwaps) {
              clearInterval(swapIv);
              swapIv = null;
              // Quantum stack in center for 220ms so screen-recording cannot exploit 282% RTP!
              cupEls.forEach((el) => { el.style.left = SLOT_LEFT[1]; });
              hasBall = ballsCount === 1 ? [false, false, false] : [true, true, true];
              if (ballsCount === 1) hasBall[Math.floor(Math.random() * 3)] = true;
              else hasBall[Math.floor(Math.random() * 3)] = false;
              tEnd = setTimeout(() => {
                syncPositions();
                phase = 'pick';
                msgEl.textContent = '👆 Выберите кубок со сферой!';
              }, 240);
            }
          }, 110);
        }, 650);
      }

      function renderBet() {
        if (!document.body.contains(betPanel)) return;
        const busy = phase !== 'idle';
        const extra = `
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="preset-btn th-m" data-b="1" style="${ballsCount === 1 ? 'border-color:var(--gold); color:#fff;' : ''}" ${busy ? 'disabled' : ''}>🔮 1 сфера (x2.82)</button>
            <button class="preset-btn th-m" data-b="2" style="${ballsCount === 2 ? 'border-color:var(--gold); color:#fff;' : ''}" ${busy ? 'disabled' : ''}>🔮🔮 2 сферы (x1.41)</button>
          </div>
        `;
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          actionLabel: '🥤 Перемешать напёрстки',
          disabled: busy,
          extraHTML: extra,
          onAction: startShuffle
        });

        betPanel.querySelectorAll('.th-m').forEach((b) => {
          b.onclick = () => {
            SFX.tap();
            ballsCount = Number(b.dataset.b);
            renderBet();
          };
        });
      }

      syncPositions();
      renderBet();
    }
  });
})();

      if (r <= 0) return it;

    { mult: 100, weight: 0.7 }
  ];

  let mineSlotCleanup = null;

  GameCore.registerGame({
    id: 'mineslot',
    title: 'Шахтёр: Падающая Кирка',
    icon: '⛏️',
    category: 'arcade',
    tag: 'ХИТ · БЛОКИ',
    tagColor: '#00e676',
    glow: '#00e676',
    maxWin: 'x2500',
    rtp: '94.2%',
    desc: 'Барабаны 5×3 сбрасывают кирки и TNT в бронированную шахту! Пробей 6 слоёв до обсидиана и открой сундуки x2..x100!',
    mathInfo: 'Верхние барабаны 5×3 определяют инструменты для каждой из 5 шахтных колонок: деревянная (1 удар), каменная (2), золотая (3), алмазная (5), TNT (взрывает соседние блоки 3×3) и Чародейская Книга Wild (+2 удара всем киркам в колонке). Если колонка пробита до дна, открывается сундук x2..x100 (несколько сундуков перемножаются!). 3× 👁️ дают 4 Фриспина без сброса шахты!',
    unmount() {
      if (mineSlotCleanup) {
        mineSlotCleanup();
        mineSlotCleanup = null;
      }
    },
    mount(root) {
      let running = false;
      let autoSpin = false;
      let autoCount = 0;
      let autoBetVal = 25;
      let autoTimer = null;
      let flickIv = null;
      let watchdogTimer = null;
      let rafId = null;
      let freeSpins = 0;
      let fsBaseBet = 25;
      let pendingFinish = null;

      // Reels 5x3
      let reels = Array.from({ length: 5 }, (_, c) =>
        Array.from({ length: 3 }, (_, r) => REEL_TOOLS[(c + r + 1) % 5])
      );

      // Mine grid 5 cols x 6 rows
      function createFreshMine() {
        return Array.from({ length: 5 }, () =>
          BLOCK_TIERS.map((tier) => ({
            name: tier.name,
            maxHp: tier.hp,
            hp: tier.hp,
            pay: tier.pay,
            fill: tier.fill,
            top: tier.top,
            speck: tier.speck,
            flash: 0
          }))
        );
      }
      function createFreshChests() {
        return Array.from({ length: 5 }, () => ({
          opened: false,
          mult: pickWeighted(CHEST_MULTS).mult
        }));
      }

      let mine = createFreshMine();
      let chests = createFreshChests();
      let fallingActors = [];
      let particles = [];

      mineSlotCleanup = () => {
        autoSpin = false;
        if (autoTimer) clearTimeout(autoTimer);
        if (flickIv) { clearInterval(flickIv); flickIv = null; }
        if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        if (running && pendingFinish) {
          pendingFinish(true);
          pendingFinish = null;
        }
      };

      root.innerHTML = `
        <div class="game-stage" style="padding:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; font-size:12px;">
            <span style="color:var(--text-secondary);">🪵1 · ⛏️2 · 🔱3 · 💎5 уд. · 🧨TNT · 📖+2 Wild</span>
            <span id="ms-fs-badge" style="font-weight:900; color:var(--emerald);">3× 👁️ = 4 Фриспина (шахта сохраняется!)</span>
          </div>

          <div id="ms-reels" style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; background:rgba(7,10,19,0.85); border:1px solid var(--border-subtle); border-radius:12px; padding:6px; margin-bottom:8px;"></div>

          <div style="position:relative; border-radius:14px; overflow:hidden; border:1px solid rgba(0,230,118,0.3); background:#090d18;">
            <canvas id="ms-canvas" width="450" height="330" style="width:100%; height:auto; display:block;"></canvas>
          </div>

          <div id="ms-msg" style="text-align:center; margin-top:8px; font-weight:800; font-size:13.5px; min-height:20px; color:var(--gold-light);">
            Крути барабаны — кирки упадут вниз и начнут рубить породу до сундуков!
          </div>
        </div>
        <div class="bet-panel" id="ms-bet"></div>
      `;

      const reelsEl = root.querySelector('#ms-reels');
      const canvas = root.querySelector('#ms-canvas');
      const ctx = canvas.getContext('2d');
      const msgEl = root.querySelector('#ms-msg');
      const fsBadge = root.querySelector('#ms-fs-badge');
      const betPanel = root.querySelector('#ms-bet');

      function renderTopReels(spinning = false) {
        if (!document.body.contains(reelsEl)) return;
        reelsEl.innerHTML = '';
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 5; c++) {
            const sym = reels[c][r];
            const d = document.createElement('div');
            const isActiveTool = sym.id !== 'empty';
            d.style.cssText = `
              height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
              font-size:20px; background:${isActiveTool ? sym.color + '24' : 'rgba(255,255,255,0.03)'};
              border:1px solid ${isActiveTool ? sym.color + '88' : 'rgba(255,255,255,0.06)'};
              opacity:${sym.id === 'empty' ? '0.32' : '1'};
              transform:${spinning ? 'scale(0.94)' : 'scale(1)'}; transition:transform 0.1s;
            `;
            d.textContent = sym.icon;
            d.title = sym.label;
            reelsEl.appendChild(d);
          }
        }
        fsBadge.innerHTML = freeSpins > 0
          ? `🔥 БЛОК-БОНУС (шахта не сбрасывается!): осталось <b>${freeSpins}</b> спинов`
          : `3× 👁️ = 4 Фриспина (шахта сохраняется!)`;
      }

      function spawnDebris(x, y, color, count = 8) {
        if (particles.length > 70) return;
        for (let i = 0; i < count; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 6.5,
            vy: -Math.random() * 4.5 - 1,
            size: randInt(3, 6),
            color,
            life: 1
          });
        }
      }

      function traceRoundedRect(c2d, x, y, w, h, r) {
        c2d.beginPath();
        c2d.moveTo(x + r, y);
        c2d.lineTo(x + w - r, y);
        c2d.arcTo(x + w, y, x + w, y + r, r);
        c2d.lineTo(x + w, y + h - r);
        c2d.arcTo(x + w, y + h, x + w - r, y + h, r);
        c2d.lineTo(x + r, y + h);
        c2d.arcTo(x, y + h, x, y + h - r, r);
        c2d.lineTo(x, y + r);
        c2d.arcTo(x, y, x + r, y, r);
        c2d.closePath();
      }

      function drawMineScene() {
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Background underground gradient
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.7, '#090d16');
        grad.addColorStop(1, '#1a1025');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        const colW = W / 5;
        const blockH = 42;
        const topOffset = 18;

        // Column guide lines
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let c = 1; c < 5; c++) {
          ctx.beginPath();
          ctx.moveTo(c * colW, 0);
          ctx.lineTo(c * colW, H);
          ctx.stroke();
        }

        // Draw 5x6 blocks
        for (let c = 0; c < 5; c++) {
          for (let r = 0; r < 6; r++) {
            const blk = mine[c][r];
            if (!blk || blk.hp <= 0) continue;
            const bx = c * colW + 5;
            const by = topOffset + r * blockH + 3;
            const bw = colW - 10;
            const bh = blockH - 6;

            ctx.fillStyle = blk.flash > 0 ? '#ffffff' : blk.fill;
            ctx.fillRect(bx, by, bw, bh);

            // Pixel top strip
            ctx.fillStyle = blk.top;
            ctx.fillRect(bx, by, bw, 6);

            // Pixel ore speckles
            ctx.fillStyle = blk.speck;
            ctx.fillRect(bx + 10, by + 13, 7, 7);
            ctx.fillRect(bx + bw - 20, by + 18, 8, 6);
            ctx.fillRect(bx + bw / 2 - 4, by + 11, 6, 6);

            // Cracks when damaged
            if (blk.hp < blk.maxHp) {
              ctx.strokeStyle = 'rgba(0,0,0,0.75)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(bx + 12, by + 6);
              ctx.lineTo(bx + bw / 2, by + bh / 2);
              ctx.lineTo(bx + bw - 14, by + bh - 5);
              ctx.moveTo(bx + bw / 2, by + bh / 2);
              ctx.lineTo(bx + 18, by + bh - 6);
              ctx.stroke();
            }

            // HP pips
            for (let p = 0; p < blk.maxHp; p++) {
              ctx.fillStyle = p < blk.hp ? '#00e676' : 'rgba(255,255,255,0.18)';
              ctx.fillRect(bx + 6 + p * 9, by + bh - 6, 6, 3);
            }

            if (blk.flash > 0) blk.flash = Math.max(0, blk.flash - 0.2);
          }

          // Chest at bottom of column
          const ch = chests[c];
          const cx = c * colW + 8;
          const cy = topOffset + 6 * blockH + 8;
          const cw = colW - 16;
          const chH = 44;

          ctx.fillStyle = ch.opened ? 'rgba(255, 184, 0, 0.28)' : 'rgba(30, 41, 59, 0.9)';
          ctx.strokeStyle = ch.opened ? '#ffb800' : 'rgba(148, 163, 184, 0.45)';
          ctx.lineWidth = 2;
          traceRoundedRect(ctx, cx, cy, cw, chH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(ch.opened ? '🔓' : '🧰', cx + cw / 2 - 14, cy + 28);

          ctx.font = 'bold 13px monospace';
          ctx.fillStyle = ch.opened ? '#fde047' : '#cbd5e1';
          ctx.fillText(`x${ch.mult}`, cx + cw / 2 + 14, cy + 27);
        }

        // Falling pickaxes & TNT actors
        for (const act of fallingActors) {
          ctx.save();
          ctx.translate(act.x, act.y);
          ctx.rotate(act.rot || 0);
          if (act.enchanted) {
            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 14;
          }
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(act.icon, 0, 0);
          if (act.hitsLeft > 0) {
            ctx.font = 'bold 11px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText(`${act.hitsLeft}`, 13, -10);
          }
          ctx.restore();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.28;
          p.life -= 0.04;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          ctx.globalAlpha = 1;
        }
      }

      function executeRound(bet, isFreeSpin, buyBonusTrigger = false) {
        if (running) return;
        running = true;

        // Reset mine only on regular spins (Free Spins keep persistent broken mine!)
        if (!isFreeSpin) {
          mine = createFreshMine();
          chests = createFreshChests();
        }
        renderControls();

        // Roll 5x3 tools (calibrated so 100x Persistent-Mine Bonus sits at ~94% RTP!)
        const nonScatterTools = REEL_TOOLS.filter((x) => x.id !== 'ender');
        const fsTools = nonScatterTools.map((t) =>
          t.id === 'empty' ? { ...t, weight: 49.5 } : { ...t, weight: t.weight * 1.05 }
        );
        const alreadyOpenedBeforeSpin = chests.map((ch) => ch.opened);
        const finalReels = Array.from({ length: 5 }, () => {
          let hasColScatter = false;
          return Array.from({ length: 3 }, () => {
            const pool = isFreeSpin ? fsTools : (hasColScatter || buyBonusTrigger) ? nonScatterTools : REEL_TOOLS;
            const sym = pickWeighted(pool);
            if (sym.id === 'ender') hasColScatter = true;
            return sym;
          });
        });
        if (buyBonusTrigger) {
          finalReels[0][1] = REEL_TOOLS.find((x) => x.id === 'ender');
          finalReels[2][1] = REEL_TOOLS.find((x) => x.id === 'ender');
          finalReels[4][1] = REEL_TOOLS.find((x) => x.id === 'ender');
        }

        // Pre-simulate mining outcome deterministically so instant unmount settle is exact
        const simMine = mine.map((col) => col.map((b) => ({ ...b })));
        const simChests = chests.map((ch) => ({ ...ch }));
        const eventsQueue = []; // step-by-step visual actions
        let rawBlockMult = 0;
        let enderCount = 0;

        for (let c = 0; c < 5; c++) {
          let hasBook = false;
          for (let r = 0; r < 3; r++) {
            if (finalReels[c][r].id === 'book') hasBook = true;
            if (finalReels[c][r].id === 'ender') enderCount++;
          }
          for (let r = 0; r < 3; r++) {
            const sym = finalReels[c][r];
            if (sym.hits <= 0) continue;
            const totalHits = sym.hits + (hasBook && sym.id !== 'tnt' ? 2 : 0);
            eventsQueue.push({
              col: c,
              sym,
              enchanted: hasBook && sym.id !== 'tnt',
              hits: totalHits
            });
          }
        }

        // Resolve mining steps on simMine and record impact targets for animation
        const visualSteps = [];
        for (const toolEv of eventsQueue) {
          const c = toolEv.col;
          let hits = toolEv.hits;
          const impacts = [];

          while (hits > 0) {
            const targetRow = simMine[c].findIndex((b) => b.hp > 0);
            if (targetRow === -1) {
              // Column already clear -> open chest if not opened, or mine bonus gold vein!
              if (!simChests[c].opened) {
                simChests[c].opened = true;
                rawBlockMult += 0.50;
                impacts.push({ type: 'chest', col: c, mult: simChests[c].mult });
              } else {
                rawBlockMult += 0.18 * Math.min(20, simChests[c].mult);
                impacts.push({ type: 'chest', col: c, mult: simChests[c].mult });
              }
              break;
            }

            if (toolEv.sym.id === 'tnt') {
              // TNT explodes in a '+' cross around (c, targetRow): 2 dmg center, 1 dmg adjacent!
              const blastCells = [];
              for (let dc = -1; dc <= 1; dc++) {
                for (let dr = -1; dr <= 1; dr++) {
                  if (Math.abs(dc) + Math.abs(dr) > 1) continue;
                  const nc = c + dc, nr = targetRow + dr;
                  if (nc >= 0 && nc < 5 && nr >= 0 && nr < 6 && simMine[nc][nr].hp > 0) {
                    const maxDmg = (dc === 0 && dr === 0) ? 2 : 1;
                    const dmg = Math.min(simMine[nc][nr].hp, maxDmg);
                    simMine[nc][nr].hp -= dmg;
                    const broke = simMine[nc][nr].hp <= 0;
                    if (broke) rawBlockMult += simMine[nc][nr].pay;
                    blastCells.push({ col: nc, row: nr, dmg, broke, color: simMine[nc][nr].speck });
                    if (broke && simMine[nc].every((b) => b.hp <= 0) && !simChests[nc].opened) {
                      simChests[nc].opened = true;
                      rawBlockMult += 0.30;
                      blastCells.push({ chestOpened: true, col: nc });
                    }
                  }
                }
              }
              impacts.push({ type: 'tnt', row: targetRow, blastCells });
              hits = 0;
            } else {
              simMine[c][targetRow].hp -= 1;
              hits -= 1;
              const broke = simMine[c][targetRow].hp <= 0;
              if (broke) rawBlockMult += simMine[c][targetRow].pay;
              let chestJustOpened = false;
              if (broke && simMine[c].every((b) => b.hp <= 0) && !simChests[c].opened) {
                simChests[c].opened = true;
                rawBlockMult += 0.35;
                chestJustOpened = true;
              }
              impacts.push({
                type: 'hit',
                row: targetRow,
                broke,
                chestJustOpened,
                hitsLeft: hits,
                color: simMine[c][targetRow].speck
              });
            }
          }
          visualSteps.push({ ...toolEv, impacts });
        }

        // Chests cracked open on THIS spin multiply together cleanly (preventing infinite re-multiplication across FS spins!)
        let chestProduct = 1;
        let openedCount = 0;
        for (let c = 0; c < 5; c++) {
          if (simChests[c].opened && !alreadyOpenedBeforeSpin[c]) {
            chestProduct *= simChests[c].mult;
            openedCount++;
          }
        }
        chestProduct = Math.min(2500, chestProduct);
        const modeScale = isFreeSpin ? 0.79 : 1.42;
        const totalMult = Math.min(2500, Number((rawBlockMult * modeScale * chestProduct).toFixed(2)));
        const winCoins = Math.round(bet * totalMult);

        let settled = false;
        function finalizeSpin(silent = false) {
          if (settled) return;
          settled = true;
          pendingFinish = null;
          if (flickIv) { clearInterval(flickIv); flickIv = null; }
          if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          mine = simMine;
          chests = simChests;
          reels = finalReels;
          fallingActors = [];
          particles = [];
          running = false;

          if (enderCount >= 3) {
            freeSpins += 4;
            fsBaseBet = bet;
            if (!silent) {
              SFX.jackpot();
              UI.toast('👁️ БЛОК-БОНУС! +4 Бесплатных Спина без сброса шахты!', 'gold');
            }
          }

          if (winCoins > 0) {
            AppState.winPayout(winCoins, totalMult);
            if (!silent) {
              if (totalMult >= 8 || openedCount > 0) SFX.jackpot();
              else SFX.win();
              msgEl.innerHTML = openedCount > 0
                ? `🔓 СУНДУК x${chestProduct}! Добыто +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`
                : `⛏️ Намайнено блоков на +${GameCore.fmt(winCoins)} 🪙 (${totalMult}x)`;
            }
          } else if (!silent) {
            msgEl.textContent = enderCount >= 3
              ? '👁️ Запускаем Блок-Бонус — копаем глубже!'
              : 'Порода выстояла — крути ещё!';
          }

          if (!silent) {
            renderTopReels(false);
            drawMineScene();
            renderControls();
            if (autoSpin) {
              autoTimer = setTimeout(() => {
                if (!autoSpin || !document.body.contains(betPanel)) return;
                if (freeSpins === 0 && AppState.get().coins < autoBetVal) {
                  autoSpin = false;
                  UI.toast('⏹️ Автокрутка остановлена: решите задачку 🧠', 'loss');
                  renderControls();
                  return;
                }
                triggerSpin(autoBetVal);
              }, 520);
            }
          }
        }
        pendingFinish = finalizeSpin;

        // Fail-safe watchdog so round can NEVER hang even if WebView throttles rAF
        watchdogTimer = setTimeout(() => {
          finalizeSpin(false);
        }, 4200);

        // Flicker reels briefly, then animate falling pickaxes on Canvas!
        let flickTicks = 0;
        flickIv = setInterval(() => {
          try {
            flickTicks++;
            reels = Array.from({ length: 5 }, () =>
              Array.from({ length: 3 }, () => pickWeighted(REEL_TOOLS))
            );
            renderTopReels(true);
            if (flickTicks >= 5) {
              clearInterval(flickIv);
              flickIv = null;
              reels = finalReels;
              renderTopReels(false);
              SFX.tick(2);
              animateVisualSteps(visualSteps, () => finalizeSpin(false));
            }
          } catch (e) {
            finalizeSpin(false);
          }
        }, 65);
      }

      function animateVisualSteps(steps, onDone) {
        const colW = canvas.width / 5;
        const blockH = 42;
        const topOffset = 18;

        const nonEmptySteps = steps.filter((s) => s.impacts && s.impacts.length > 0);
        if (nonEmptySteps.length === 0) {
          drawMineScene();
          setTimeout(onDone, 220);
          return;
        }

        // Queue tools per column so multiple pickaxes in the same column drop cleanly one by one!
        const colQueues = [[], [], [], [], []];
        for (const st of nonEmptySteps) {
          colQueues[st.col].push(st);
        }

        function makeActor(st) {
          return {
            step: st,
            x: st.col * colW + colW / 2,
            y: -16,
            vy: 6.4,
            rot: 0,
            icon: st.sym.icon,
            enchanted: st.enchanted,
            hitsLeft: st.hits,
            impactIdx: 0,
            done: false
          };
        }

        fallingActors = [];
        for (let c = 0; c < 5; c++) {
          if (colQueues[c].length > 0) fallingActors.push(makeActor(colQueues[c].shift()));
        }

        function frame() {
          try {
            if (!document.body.contains(canvas)) {
              onDone();
              return;
            }
            let anyActive = false;

            for (let aIdx = 0; aIdx < fallingActors.length; aIdx++) {
              const act = fallingActors[aIdx];
              if (act.done) {
                const c = act.step.col;
                if (colQueues[c].length > 0) {
                  fallingActors[aIdx] = makeActor(colQueues[c].shift());
                  anyActive = true;
                }
                continue;
              }
              anyActive = true;
              const imp = act.step.impacts[act.impactIdx];
              if (!imp) {
                act.done = true;
                continue;
              }
              const targetY = imp.type === 'chest'
                ? topOffset + 6 * blockH + 22
                : topOffset + imp.row * blockH + blockH / 2;

              if (act.y < targetY) {
                act.y = Math.min(targetY, act.y + act.vy);
                act.rot = Math.sin(act.y * 0.14) * 0.28;
              } else {
                if (imp.type === 'tnt') {
                  SFX.boom();
                  for (const bc of imp.blastCells) {
                    if (bc.chestOpened) {
                      chests[bc.col].opened = true;
                    } else {
                      mine[bc.col][bc.row].hp = Math.max(0, mine[bc.col][bc.row].hp - bc.dmg);
                      mine[bc.col][bc.row].flash = 1;
                      spawnDebris(bc.col * colW + colW / 2, topOffset + bc.row * blockH + 20, bc.color || '#ef4444', 8);
                    }
                  }
                  act.hitsLeft = 0;
                  act.done = true;
                } else if (imp.type === 'chest') {
                  chests[imp.col].opened = true;
                  SFX.win();
                  spawnDebris(act.x, targetY, '#fde047', 12);
                  act.done = true;
                } else {
                  const blk = mine[act.step.col][imp.row];
                  blk.hp = Math.max(0, blk.hp - 1);
                  blk.flash = 1;
                  act.hitsLeft = imp.hitsLeft;
                  SFX.tick(Math.min(5, imp.row));
                  spawnDebris(act.x, targetY, imp.color || '#94a3b8', imp.broke ? 9 : 4);
                  if (imp.chestJustOpened) {
                    chests[act.step.col].opened = true;
                    spawnDebris(act.x, topOffset + 6 * blockH + 22, '#fde047', 12);
                  }
                  if (!imp.broke) {
                    act.y -= 16;
                  }
                }
                act.impactIdx++;
                if (act.impactIdx >= act.step.impacts.length) act.done = true;
              }
            }

            const anyQueued = colQueues.some((q) => q.length > 0);
            drawMineScene();
            if (anyActive || anyQueued || particles.length > 0) {
              rafId = requestAnimationFrame(frame);
            } else {
              onDone();
            }
          } catch (err) {
            onDone();
          }
        }
        rafId = requestAnimationFrame(frame);
      }

      function triggerSpin(betVal) {
        if (running) return;
        const isFS = freeSpins > 0;
        const bet = isFS ? fsBaseBet : betVal;
        if (!isFS) {
          if (!AppState.placeBet(bet, 'mineslot')) {
            autoSpin = false;
            renderControls();
            return;
          }
        } else {
          freeSpins--;
        }
        if (autoSpin) autoCount++;
        executeRound(bet, isFS, false);
      }

      function renderControls() {
        if (!document.body.contains(betPanel)) return;
        if (freeSpins > 0) {
          betPanel.innerHTML = `
            <div style="display:flex; gap:8px;">

            </div>
          `;
          betPanel.querySelector('#ms-fs-go').onclick = () => triggerSpin(fsBaseBet);
          const sb = betPanel.querySelector('#ms-fs-stop');
          if (sb) {
            sb.onclick = () => {
              autoSpin = false;
              if (autoTimer) clearTimeout(autoTimer);
              renderControls();
            };
          }
          return;
        }

        const curBet = Math.max(5, GameCore.getBet());
        const bonusCost = curBet * 100;
        GameCore.renderBetControls(betPanel, {
          minBet: 5,
          disabled: running,
          actionLabel: '⛏️ СБРОСИТЬ КИРКИ',
          onBetChange: (b) => {
