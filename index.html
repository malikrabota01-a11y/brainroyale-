  <script>
    window.BR_VERSION = '2.9.0';
    (function () {
      var KEY = 'br_error_log_v1';
      function push(msg, extra) {
        try {
          var list = [];
          try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) {}
          list.push({ t: Date.now(), msg: String(msg || 'unknown error').slice(0, 300), extra: String(extra || '').slice(0, 300) });
          localStorage.setItem(KEY, JSON.stringify(list.slice(-15)));
        } catch (_) { /* буфер недоступен — не мешаем игре */ }
      }
      window.BR_ERROR_LOG = {
        read: function () { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) { return []; } },
        clear: function () { try { localStorage.removeItem(KEY); } catch (_) {} }
      };
      window.addEventListener('error', function (ev) {
        push((ev && ev.message) || (ev && ev.error && ev.error.message) || 'script error',
             (ev && ev.filename) ? (ev.filename + ':' + (ev.lineno || 0)) : '');
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev && ev.reason;
        push('Promise: ' + ((r && r.message) || r || 'unknown'), '');
      });
    })();
  </script>

  <style>
:root {
  --bg-deep: #070a13;
  --bg-main: #0c1120;
  --bg-card: #131b31;
  --bg-card-hover: #192442;
  --bg-elevated: #1d294b;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(0, 230, 118, 0.35);

  --gold: #ffb800;
  --gold-light: #ffd54f;
  --gold-dark: #c78c00;
  --emerald: #00e676;
  --emerald-dark: #00b248;
  --cyan: #00d4ff;
  --purple: #8c52ff;
  --purple-light: #b388ff;
  --crimson: #ff3d71;
  --crimson-dark: #c60055;
  --amber: #ff9100;

  --text-primary: #f5f7ff;
  --text-secondary: #9aa7c7;
  --text-muted: #627094;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;

  --shadow-soft: 0 8px 28px rgba(0, 0, 0, 0.45);
  --shadow-gold: 0 4px 20px rgba(255, 184, 0, 0.28);
  --shadow-emerald: 0 4px 20px rgba(0, 230, 118, 0.28);
  --shadow-purple: 0 4px 22px rgba(140, 82, 255, 0.32);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

input, textarea {
  user-select: text;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', system-ui, sans-serif;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.mono, .num {
  font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* App Shell */
.app-shell {
  max-width: 920px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  position: relative;
  background: radial-gradient(circle at 50% -10%, rgba(140, 82, 255, 0.16), transparent 55%),
              radial-gradient(circle at 90% 20%, rgba(0, 212, 255, 0.09), transparent 45%),
              var(--bg-main);
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
}

/* Sticky Top Header */
.top-header {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(12, 17, 32, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  min-width: 0;
}

.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #8c52ff, #00d4ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  box-shadow: 0 3px 12px rgba(140, 82, 255, 0.4);
  flex-shrink: 0;
}

.brand-info {
  min-width: 0;
}

.brand-title {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.rank-mini {
  font-size: 11px;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}

.xp-bar-mini {
  width: 54px;
  height: 5px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 99px;
  overflow: hidden;
}

.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  border-radius: 99px;
  transition: width 0.35s ease;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.balance-pill {
  display: flex;
  align-items: center;
  background: rgba(255, 184, 0, 0.12);
  border: 1px solid rgba(255, 184, 0, 0.35);
  border-radius: 999px;
  padding: 4px 5px 4px 11px;
  gap: 7px;
  box-shadow: inset 0 0 12px rgba(255, 184, 0, 0.08);
}

.balance-coin {
  font-size: 16px;
}

.balance-val {
  font-weight: 800;
  font-size: 15px;
  color: var(--gold-light);
  letter-spacing: -0.3px;
}

.earn-plus-btn {
  background: linear-gradient(135deg, var(--emerald), #00b0ff);
  color: #04120b;
  border: none;
  border-radius: 999px;
  padding: 5px 10px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: transform 0.12s ease, filter 0.15s;
}

.earn-plus-btn:active {
  transform: scale(0.94);
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s, transform 0.12s;
}

.icon-btn:active {
  transform: scale(0.93);
}

.apk-top-btn {
  background: linear-gradient(135deg, #00c853, #009624);
  color: #fff;
  text-decoration: none;
  font-size: 12px;
  font-weight: 800;
  padding: 7px 10px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 3px 10px rgba(0, 200, 83, 0.3);
  white-space: nowrap;
}

/* Main Content */
.main-content {
  flex: 1;
  padding: 14px;
}

/* Hero Banner */
.hero-banner {
  background: linear-gradient(135deg, rgba(140, 82, 255, 0.25), rgba(0, 230, 118, 0.16));
  border: 1px solid rgba(140, 82, 255, 0.35);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  background: rgba(0, 230, 118, 0.16);
  border: 1px solid rgba(0, 230, 118, 0.4);
  color: var(--emerald);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.25;
}

.hero-sub {
  margin: 0;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.45;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 2px;
}

/* Buttons */
.btn {
  border: none;
  border-radius: var(--radius-md);
  padding: 11px 16px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: transform 0.12s ease, filter 0.15s ease, opacity 0.15s;
  color: var(--text-primary);
}

.btn:active:not(:disabled) {
  transform: scale(0.96);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-emerald {
  background: linear-gradient(135deg, #00e676, #00bfa5);
  color: #04170e;
  box-shadow: var(--shadow-emerald);
}

.btn-gold {
  background: linear-gradient(135deg, #ffd54f, #ffb300);
  color: #1c1200;
  box-shadow: var(--shadow-gold);
}

.btn-purple {
  background: linear-gradient(135deg, #8c52ff, #5e35b1);
  color: #fff;
  box-shadow: var(--shadow-purple);
}

.btn-crimson {
  background: linear-gradient(135deg, #ff3d71, #d500f9);
  color: #fff;
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

.btn-block {
  width: 100%;
}

.btn-lg {
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 800;
}

/* Filter Chips */
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filter-chip.active {
  background: linear-gradient(135deg, var(--purple), #4f46e5);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 3px 12px rgba(140, 82, 255, 0.35);
}

/* Casino Game Lobby Grid */
.games-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media (min-width: 620px) {
  .games-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

.game-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s;
}

.game-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateY(-2px);
}

.game-card:active {
  transform: scale(0.97);
}

.game-card-glow {
  position: absolute;
  width: 90px;
  height: 90px;
  right: -20px;
  top: -20px;
  border-radius: 50%;
  filter: blur(28px);
  opacity: 0.35;
  pointer-events: none;
}

.game-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.game-icon-box {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.game-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.game-title {
  font-weight: 800;
  font-size: 15px;
  margin: 2px 0 3px;
}

.game-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.35;
}

.game-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  padding-top: 8px;
}

.game-max-win {
  color: var(--gold-light);
  font-weight: 700;
}

/* Active Game View */
.game-screen {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.game-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 9px 12px;
}

.game-topbar-title {
  font-weight: 800;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.game-stage {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  position: relative;
  overflow: hidden;
  min-height: 260px;
}

/* Bet Control Panel */
.bet-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bet-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bet-field-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-deep);
  border: 1px solid rgba(255, 184, 0, 0.3);
  border-radius: var(--radius-md);
  padding: 6px 10px;
  gap: 6px;
}

.bet-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--gold-light);
  font-size: 17px;
  font-weight: 800;
}

.bet-quick-btns {
  display: flex;
  gap: 5px;
}

.chip-mini-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-weight: 700;
  font-size: 12px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
}

.chip-mini-btn:active {
  transform: scale(0.94);
}

.preset-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.preset-btn {
  flex: 1;
  min-width: 52px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 6px 8px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.preset-btn:hover {
  color: var(--gold-light);
  border-color: rgba(255, 184, 0, 0.35);
}

/* No Coins Inline Rescue Box */
.low-coins-banner {
  background: linear-gradient(135deg, rgba(0, 230, 118, 0.14), rgba(0, 212, 255, 0.12));
  border: 1px dashed rgba(0, 230, 118, 0.55);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

/* History Pills */
.history-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.history-strip::-webkit-scrollbar { display: none; }

.hist-pill {
  padding: 4px 9px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}
.hist-low { background: rgba(255, 61, 113, 0.18); color: #ff6b93; border: 1px solid rgba(255,61,113,0.3); }
.hist-mid { background: rgba(0, 230, 118, 0.16); color: #00e676; border: 1px solid rgba(0,230,118,0.3); }
.hist-high { background: rgba(255, 184, 0, 0.2); color: #ffd54f; border: 1px solid rgba(255,184,0,0.45); }

/* Playing Cards */
.cards-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  min-height: 98px;
  align-items: center;
}

.playing-card {
  width: 66px;
  height: 94px;
  border-radius: 10px;
  background: linear-gradient(160deg, #ffffff, #e8edf7);
  color: #121726;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px 7px;
  position: relative;
  font-weight: 800;
  animation: cardDeal 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
  border: 2px solid transparent;
}

.playing-card.red {
  color: #d50032;
}

.playing-card.held {
  border-color: var(--gold);
  transform: translateY(-8px);
  box-shadow: 0 10px 22px rgba(255, 184, 0, 0.45);
}

.playing-card.back {
  background: repeating-linear-gradient(
    45deg,
    #311b92,
    #311b92 7px,
    #4527a0 7px,
    #4527a0 14px
  );
  border: 2px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}

.card-corner {
  font-size: 13px;
  line-height: 1;
}

.card-center-suit {
  font-size: 28px;
  text-align: center;
  line-height: 1;
}

.card-hold-badge {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #140e00;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

@keyframes cardDeal {
  from { opacity: 0; transform: translateY(-18px) scale(0.88); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Mines 5x5 Grid */
.mines-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 340px;
  margin: 0 auto;
}

.mine-cell {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  background: linear-gradient(145deg, #1d294b, #151e38);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 4px 0 #0b1020;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  transition: transform 0.12s, background 0.2s, border-color 0.2s;
}

.mine-cell:hover:not(.opened):not(:disabled) {
  border-color: var(--cyan);
  background: #23325c;
}

.mine-cell:active:not(.opened):not(:disabled) {
  transform: translateY(2px);
}

.mine-cell.gem {
  background: linear-gradient(145deg, rgba(0, 230, 118, 0.25), rgba(0, 191, 165, 0.15));
  border-color: var(--emerald);
  box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
  animation: popIn 0.22s ease;
}

.mine-cell.bomb {
  background: linear-gradient(145deg, rgba(255, 61, 113, 0.35), rgba(198, 0, 85, 0.25));
  border-color: var(--crimson);
  box-shadow: 0 0 18px rgba(255, 61, 113, 0.45);
  animation: shake 0.35s ease;
}

.mine-cell.dimmed {
  opacity: 0.48;
}

@keyframes popIn {
  0% { transform: scale(0.7); }
  70% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }

// WebAudio Synthesizer + Android Haptic Bridge
window.SFX = (function () {
  let ctx = null;
  let muted = false;

  function ensureCtx() {
    if (muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  // Unlock WebAudio on iOS Safari on the very first touch/click gesture
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    const unlockIosAudio = () => {
      try {
        const c = ensureCtx();
        if (c) {
          const buf = c.createBuffer(1, 1, 22050);
          const src = c.createBufferSource();
          src.buffer = buf;
          src.connect(c.destination);
          src.start(0);
        }
      } catch (e) {}
      window.removeEventListener('touchend', unlockIosAudio, true);
      window.removeEventListener('click', unlockIosAudio, true);
    };
    window.addEventListener('touchend', unlockIosAudio, true);
    window.addEventListener('click', unlockIosAudio, true);
  }

  function vibrate(ms) {
    try {
      const tgHaptic = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback;
      if (tgHaptic) {
        const dur = Array.isArray(ms) ? ms.reduce((a, b) => a + b, 0) : Number(ms) || 10;
        if (dur >= 90) tgHaptic.notificationOccurred('success');
        else if (dur >= 30) tgHaptic.impactOccurred('medium');
        else tgHaptic.impactOccurred('light');
        return;
      }
      if (window.AndroidBridge && typeof window.AndroidBridge.vibrate === 'function') {
        window.AndroidBridge.vibrate(Array.isArray(ms) ? ms[0] : ms);
        return;
      }
      if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    } catch (e) {}
  }

  function tone(freq, dur, type = 'sine', vol = 0.14, delay = 0, slideTo = null) {
    const c = ensureCtx();
    if (!c) return;
    try {
      const osc = c.createOscillator();
      const gain = c.createGain();
      const start = c.currentTime + delay;
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), start + dur);
      }
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(vol, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, start + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    } catch (e) {}
  }

  function noiseBurst(dur = 0.28, vol = 0.22) {
    const c = ensureCtx();
    if (!c) return;
    try {
      const bufferSize = Math.floor(c.sampleRate * dur);
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.8);
      }
      const noise = c.createBufferSource();
      noise.buffer = buffer;
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 650;
      const gain = c.createGain();
      gain.gain.value = vol;
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(c.destination);
      noise.start();
    } catch (e) {}
  }

  return {
    isMuted: () => muted,
    setMuted: (m) => { muted = !!m; },
    toggleMute: () => { muted = !muted; return muted; },
    vibrate,
    tap() {
      tone(520, 0.045, 'triangle', 0.07);
      vibrate(8);
    },
    tick(step = 0) {
      tone(700 + (step % 8) * 45, 0.035, 'sine', 0.06);
    },
    card() {
      tone(340, 0.06, 'triangle', 0.09, 0, 680);
      vibrate(10);
    },
    gem(combo = 1) {
      const base = 520 * Math.pow(1.06, Math.min(combo, 16));
      tone(base, 0.14, 'sine', 0.14);
      tone(base * 1.5, 0.18, 'triangle', 0.1, 0.04);
      vibrate(18);
    },
    correct() {
      tone(587.33, 0.11, 'sine', 0.14, 0);
      tone(880, 0.2, 'sine', 0.15, 0.08);
      vibrate(22);
    },
    wrong() {
      tone(220, 0.16, 'sawtooth', 0.11, 0, 150);
      tone(165, 0.22, 'sawtooth', 0.11, 0.1, 120);
      vibrate(55);
    },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
        tone(f, 0.2, 'triangle', 0.14, idx * 0.065);
      });
      vibrate(35);
    },
    jackpot() {
      [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, idx) => {
        tone(f, 0.28, 'triangle', 0.16, idx * 0.07);
      });
      vibrate(90);
    },
    boom() {
      noiseBurst(0.38, 0.26);
      tone(130, 0.35, 'sawtooth', 0.18, 0, 38);
      vibrate(95);
    },
    explosion() {
      noiseBurst(0.38, 0.26);
      tone(130, 0.35, 'sawtooth', 0.18, 0, 38);
      vibrate(95);
    },
    coin() {
      tone(1320, 0.07, 'square', 0.07);
      tone(1760, 0.13, 'sine', 0.12, 0.045);
      vibrate(12);
    },
    cashout() {
      [1567.98, 2093, 2637].forEach((f, i) => tone(f, 0.17, 'triangle', 0.12, i * 0.05));
      vibrate(28);
    },
    levelup() {
      [659.25, 830.61, 987.77, 1318.5].forEach((f, i) => tone(f, 0.24, 'sine', 0.13, i * 0.075));
      vibrate(45);
    },
    spin() {
      for (let i = 0; i < 7; i++) tone(850 + Math.random() * 350, 0.03, 'square', 0.04, i * 0.055);
      vibrate(6);
    },
    lose() {
      tone(196, 0.22, 'sawtooth', 0.09, 0, 128);
      vibrate(45);
    },
    sparkle() {
      [2093, 2637, 3136].forEach((f, i) => tone(f, 0.18, 'sine', 0.075, i * 0.06));
      vibrate(14);
    }
  };
})();

// === fx.js ===
// Визуальный «сок» игры: конфетти, баннер BIG WIN, вспышки, тряска экрана.
// Уважает prefers-reduced-motion. Всё синтезировано DOM+CSS, без ассетов.
window.FX = (function () {
  const reduced = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmtN = (n) => (window.GameCore && window.GameCore.fmt ? window.GameCore.fmt(n) : String(Math.round(n)));

  function layer() {
    let l = document.getElementById('fx-layer');
    if (!l) {
      l = document.createElement('div');
      l.id = 'fx-layer';
      document.body.appendChild(l);
    }
    return l;
  }

  function confetti(count) {
    if (reduced) return;
    const EMOJI = ['🪙', '✨', '⭐', '🎉', '💛', '💎'];
    const l = layer();
    const n = Math.max(8, Math.min(120, count | 0));
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'fx-confetti';
      p.textContent = EMOJI[i % EMOJI.length];
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.fontSize = (13 + Math.random() * 18) + 'px';
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      p.style.animationDuration = (1.5 + Math.random() * 1.3) + 's';
      l.appendChild(p);
      setTimeout(() => p.remove(), 3400);
    }
  }

  function bigWinBanner(title, subtitle, tier) {
    if (reduced) {
      if (window.UI) window.UI.toast(title + (subtitle ? ' — ' + subtitle : ''), 'gold');
      return;
    }
    const l = layer();
    const b = document.createElement('div');
    b.className = 'fx-bigwin' + (tier ? ' tier-' + tier : '');
    b.innerHTML = '<div class="fx-bigwin-title">' + title + '</div>' + (subtitle ? '<div class="fx-bigwin-sub">' + subtitle + '</div>' : '');
    l.appendChild(b);
    setTimeout(() => {
      b.classList.add('out');
      setTimeout(() => b.remove(), 450);
    }, tier === 'mega' ? 2500 : 1800);
  }

  function shake(intensity) {
    if (reduced) return;
    document.body.classList.remove('fx-shake', 'fx-shake-hard');
    void document.body.offsetWidth;
    document.body.classList.add(intensity === 'hard' ? 'fx-shake-hard' : 'fx-shake');
    setTimeout(() => document.body.classList.remove('fx-shake', 'fx-shake-hard'), 650);
  }

  function flash(color) {
    if (reduced) return;
    const l = layer();
    const f = document.createElement('div');
    f.className = 'fx-flash';
    f.style.background = color || 'rgba(255, 214, 90, 0.26)';
    l.appendChild(f);
    setTimeout(() => f.remove(), 400);
  }

  // Единая точка для всех 20 игр: вызывается из AppState.winPayout
  function onWin(amount, multiplier, jackpotBonus) {
    try {
      const a = Math.round(amount || 0);
      const mult = Number(multiplier) || 1;
      const jb = Math.round(jackpotBonus || 0);
      if (jb > 0) {
        confetti(95);
        bigWinBanner('МЕГА-ДЖЕКПОТ!', '+' + fmtN(jb) + ' 🪙 · x' + mult.toFixed(1), 'mega');
        flash('rgba(255, 200, 60, 0.32)');
        shake('hard');
        return;
      }
      if (mult >= 25 || a >= 10000) {
        confetti(70);
        bigWinBanner('MEGA WIN!', '+' + fmtN(a) + ' 🪙 · x' + mult.toFixed(1), 'mega');
        flash('rgba(255, 196, 0, 0.28)');
        shake('hard');
        return;
      }
      if (mult >= 10 || a >= 2500) {
        confetti(45);
        bigWinBanner('BIG WIN!', '+' + fmtN(a) + ' 🪙', 'big');
        flash('rgba(255, 214, 90, 0.2)');
        return;
      }
      if (mult >= 5 || a >= 800) {
        confetti(22);
        bigWinBanner('КРУПНЫЙ ВЫИГРЫШ', '+' + fmtN(a) + ' 🪙', 'normal');
        return;
      }
      if (window.SFX && window.SFX.coin) window.SFX.coin();
    } catch (_) {}
  }

  return { confetti, bigWinBanner, shake, flash, onWin };
})();

    listeners.push(fn);
  }

  function notify() {
    listeners.forEach((fn) => {
      try { fn(state); } catch (e) {}
    });
  }

  function xpForLevel(lvl) {
    return Math.floor(95 * Math.pow(lvl, 1.38));
  }

  function addXp(amount) {
    state.xp += Math.round(amount);
    let leveledUp = false;
    while (state.xp >= xpForLevel(state.level)) {
      state.xp -= xpForLevel(state.level);
      state.level += 1;
      leveledUp = true;
    }
    if (leveledUp) {
      const r = getRank();
      if (window.UI) window.UI.toast(`🎉 Уровень интеллекта ${state.level}! Ранг: ${r.icon} ${r.title}`, 'gold');
      if (window.SFX && window.SFX.levelup) window.SFX.levelup(); else if (window.SFX) window.SFX.jackpot();
      if (window.FX) window.FX.confetti(30);
    }
  }

  function getRank() {
    let cur = RANKS[0];
    for (const r of RANKS) {
      if (state.level >= r.minLvl) cur = r;

  }

  function getPrestigeMult() {
    return 1 + (state.prestigeCores || 0) * 0.15;
  }

  function getTotalBrainMult() {
    const neuroMult = 1 + (state.upgrades.neuro_mult || 0) * 0.12;
    const rankMult = 1 + Math.min(0.60, (state.level - 1) * 0.02);
    const prestMult = getPrestigeMult();
    return neuroMult * rankMult * prestMult;
  }

  function getStreakMultiplier(streak = state.streak) {
    if (streak <= 0) return 1.0;
    // Gradual hard-earned streak bonus: +0.06x per consecutive answer, capped strictly at x2.20!
    return Math.min(2.20, Number((1.0 + streak * 0.06).toFixed(2)));
  }

  function unlockAchievement(id) {
    if (state.achievements[id]) return;
    const ach = ACHIEVEMENTS.find((a) => a.id === id);
    if (!ach) return;
    state.achievements[id] = Date.now();
    addXp(ach.rewardXp);
    if (window.UI) {
      window.UI.toast(`🏆 Достижение: «${ach.title}» (+${ach.rewardXp} XP)`, 'gold');
    }
  }

  function checkBrainAchievements(diffIdx) {
    if (state.stats.tasksSolved >= 1) unlockAchievement('first_solve');
    if (state.stats.tasksSolved >= 25) unlockAchievement('solve_25');
    if (state.stats.tasksSolved >= 100) unlockAchievement('solve_100');
    if (state.streak >= 5) unlockAchievement('streak_5');
    if (state.streak >= 12) unlockAchievement('streak_12');
    if (diffIdx >= 3) unlockAchievement('genius_solve');
    if (state.stats.totalCoinsEarnedByBrain >= 5000) unlockAchievement('earned_5k');
  }

  function recordTaskResult({ correct, category, diffIdx, speedRatio = 0.5 }) {
    const baseRewards = [15, 35, 75, 160];
    const baseXp = [12, 25, 55, 115];

    if (correct) {
      state.streak += 1;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      if (state.streak % 10 === 0 && (state.upgrades.combo_shield || 0) > 0) {
        state.shieldCharges = Math.min(state.upgrades.combo_shield, state.shieldCharges + 1);
      }

      const streakMult = getStreakMultiplier(state.streak);
      const brainMult = getTotalBrainMult();
      const speedBonus = 1 + Math.max(0, Math.min(1, speedRatio)) * 0.15;

      const earnedCoins = Math.max(8, Math.round(baseRewards[diffIdx] * streakMult * brainMult * speedBonus));
      const earnedXp = Math.round(baseXp[diffIdx] * Math.min(1.8, streakMult));

      state.coins += earnedCoins;
      unsyncedCoinDelta += earnedCoins;
      state.stats.tasksSolved += 1;
      state.stats.totalCoinsEarnedByBrain += earnedCoins;
      if (state.stats.byCategory[category] !== undefined) {
        state.stats.byCategory[category] += 1;
      }

      state.quests.items.forEach((item) => {
        if (item.claimed) return;
        if (item.id === 'q_math10') item.progress = Math.min(item.target, item.progress + 1);
        if (item.id === 'q_streak5') item.progress = Math.max(item.progress, Math.min(item.target, state.streak));
        if (item.id === 'q_hard3' && diffIdx >= 2) item.progress = Math.min(item.target, item.progress + 1);
        if (item.id === 'q_prob3' && (category === 'prob' || category === 'memory')) {
          item.progress = Math.min(item.target, item.progress + 1);
        }
      });

      const ec = state.endlessContract;
      if (ec) {
        if (ec.kind === 'solve') ec.progress = Math.min(ec.target, ec.progress + 1);
        if (ec.kind === 'streak') ec.progress = Math.max(ec.progress, Math.min(ec.target, state.streak));
        if (ec.kind === 'hard_solve' && diffIdx >= 1) ec.progress = Math.min(ec.target, ec.progress + 1);
      }

      addXp(earnedXp);
      checkBrainAchievements(diffIdx);
      save();
      return { earnedCoins, earnedXp, streak: state.streak, streakMult, penaltyCoins: 0 };
    } else {
      state.stats.tasksWrong += 1;
      let shieldUsed = false;
      let penaltyCoins = 0;
      if (state.streak > 1 && state.shieldCharges > 0) {
        state.shieldCharges -= 1;
        shieldUsed = true;
      } else {
        state.streak = 0;
        // Small anti-spam penalty when guessing randomly at higher difficulties!
        if (diffIdx >= 1 && state.coins > 0) {
          penaltyCoins = Math.min(state.coins, Math.round(baseRewards[diffIdx] * 0.25));
          state.coins -= penaltyCoins;
          unsyncedCoinDelta -= penaltyCoins;
        }
      }
      save();
      return { earnedCoins: 0, earnedXp: 0, streak: state.streak, shieldUsed, penaltyCoins };

  function placeBet(amount, gameId) {
    const bet = Math.floor(Number(amount) || 0);
    if (bet <= 0 || bet > state.coins) return false;
    state.coins -= bet;
    unsyncedCoinDelta -= bet;
    lastGameId = gameId || lastGameId;
    lastBetStaked = bet;

    const jpAdd = Math.max(1, Math.round(bet * 0.015));
    state.jackpotPool = (state.jackpotPool || 500) + jpAdd;
    unsyncedJpDelta += jpAdd;
    state.stats.gamesPlayed += 1;
    state.stats.totalWagered += bet;
    state.stats.playedGameIds[gameId] = (state.stats.playedGameIds[gameId] || 0) + 1;

    unlockAchievement('first_bet');
    if (Object.keys(state.stats.playedGameIds).length >= 8) {
      unlockAchievement('all_rounder');

    }

    if (multiplier >= 50 && lastBetStaked >= 100 && state.jackpotPool > 0) {
      const share = Math.min(1.0, lastBetStaked / 1000);
      const jp = Math.max(50, Math.round(state.jackpotPool * share));
      jackpotWonAmount = jp;
      totalCredited += jp;
      state.jackpotPool = Math.max(300, state.jackpotPool - jp);
      state.stats.jackpotsWon = (state.stats.jackpotsWon || 0) + 1;
      unlockAchievement('jackpot_hit');
      if (window.SFX) window.SFX.jackpot();
      if (window.UI) {
        window.UI.toast(`🏆 МЕГА-ДЖЕКПОТ СОРВАН (x${multiplier.toFixed(1)})! Бонус +${jp.toLocaleString('ru-RU')} 🪙!`, 'gold');
      }
    }

    state.coins += totalCredited;
    unsyncedCoinDelta += totalCredited;
    if (window.FX && window.FX.onWin) { try { window.FX.onWin(totalCredited, multiplier, jackpotWonAmount); } catch (_) {} }
    state.stats.totalWon += totalCredited;
    if (totalCredited > state.stats.biggestWin) state.stats.biggestWin = totalCredited;
    if (multiplier > state.stats.biggestMult) state.stats.biggestMult = Number(multiplier.toFixed(2));

    if (window.SocialArena && typeof window.SocialArena.emitGameEvent === 'function') {
      if (jackpotWonAmount > 0) {
        window.SocialArena.emitGameEvent({
          type: 'jackpot',
          amount: totalCredited,
          jackpotBonus: jackpotWonAmount,
          multiplier: Number(multiplier.toFixed(2)),
          gameId: lastGameId
        });
      } else if ((multiplier >= 15 && totalCredited >= 1500) || totalCredited >= 8000) {
        window.SocialArena.emitGameEvent({
          type: 'big_win',
          amount: totalCredited,
          multiplier: Number(multiplier.toFixed(2)),
          gameId: lastGameId
        });
      }
    }
    save();
    return totalCredited;
  }

  function getUpgradeCost(upgId) {
    const u = UPGRADES.find((x) => x.id === upgId);
    const lvl = state.upgrades[upgId] || 0;
    return Math.round(u.baseCost * Math.pow(u.costScale, lvl));
  }

  function buyUpgrade(upgId) {
    const u = UPGRADES.find((x) => x.id === upgId);
    if (!u) return false;
    const lvl = state.upgrades[upgId] || 0;
    if (lvl >= u.maxLevel) return false;
    const cost = getUpgradeCost(upgId);
    if (state.coins < cost) return false;
    state.coins -= cost;
    unsyncedCoinDelta -= cost;
    state.upgrades[upgId] = lvl + 1;
    if (upgId === 'combo_shield') {
      state.shieldCharges = state.upgrades.combo_shield;
    }
    if (window.SFX) window.SFX.win();
    save();
    return true;
  }

  function claimQuest(qId) {
    const item = state.quests.items.find((x) => x.id === qId);
    if (!item || item.claimed || item.progress < item.target) return false;
    item.claimed = true;
    const reward = Math.round(item.rewardCoins * getPrestigeMult());
    state.coins += reward;
    unsyncedCoinDelta += reward;
    state.stats.totalCoinsEarnedByBrain += reward;
    addXp(item.rewardXp);
    if (window.SFX) window.SFX.win();
    save();
    return true;
  }

  function claimEndlessContract() {
    const ec = state.endlessContract;
    if (!ec || ec.progress < ec.target) return null;
    const reward = Math.round(ec.rewardCoins * getPrestigeMult());
    const xp = ec.rewardXp;
    state.coins += reward;
    unsyncedCoinDelta += reward;
    state.stats.totalCoinsEarnedByBrain += reward;
    state.stats.contractsCompleted = (state.stats.contractsCompleted || 0) + 1;
    addXp(xp);
    const nextNum = ec.num + 1;
    state.endlessContract = createEndlessContract(nextNum);
    if (window.SFX) window.SFX.win();
    save();
    return { reward, rewardCoins: reward, xp, nextNum };
  }

  function getPrestigeGain() {
    if (state.coins < 50000) return 0;
    return Math.max(1, Math.floor(Math.sqrt(state.coins / 50000)));
  }

  function performPrestige() {
    const gain = getPrestigeGain();
    if (gain <= 0) return 0;
    const wipedCoins = state.coins;
    state.prestigeCores = (state.prestigeCores || 0) + gain;
    state.prestigeCount = (state.prestigeCount || 0) + 1;
    state.coins = 0;
    unsyncedCoinDelta -= wipedCoins;
    state.streak = 0;
    state.shieldCharges = 0;
    state.upgrades = {
      neuro_mult: 0,
      time_warp: 0,
      combo_shield: 0,
      prob_scanner: state.upgrades.prob_scanner || 0,
      vault_lock: state.upgrades.vault_lock || 0
    };
    unlockAchievement('first_prestige');
    if (window.SFX) window.SFX.jackpot();
    if (window.SocialArena && typeof window.SocialArena.emitGameEvent === 'function') {
      window.SocialArena.emitGameEvent({
        type: 'prestige',
        coresGained: gain,
        totalCores: state.prestigeCores
      });
    }
    save();
    return gain;
  }

  function recordBlitzBest(score) {
    if (score > (state.stats.bestBlitzScore || 0)) {
      state.stats.bestBlitzScore = score;
      save();
    }
  }

  function consumeSyncDelta() {
    const d = { coinsDelta: unsyncedCoinDelta, jpDelta: unsyncedJpDelta };
    unsyncedCoinDelta = 0;
    unsyncedJpDelta = 0;
    return d;
  }

  function applyServerSnapshot(serverCoins, sharedJackpot) {
    let changed = false;
    if (typeof serverCoins === 'number' && !Number.isNaN(serverCoins)) {
      const expected = Math.max(0, Math.round(serverCoins + unsyncedCoinDelta));
      if (expected !== state.coins) {
        state.coins = expected;
        changed = true;
      }
    }
    if (typeof sharedJackpot === 'number' && sharedJackpot > 0) {
      if (sharedJackpot !== state.jackpotPool) {
        state.jackpotPool = sharedJackpot;
        changed = true;
      }
    }
    if (changed) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      notify();
    }
  }

  function setExactCoinsFromAction(newCoins) {
    state.coins = Math.max(0, Math.round(newCoins));
    unsyncedCoinDelta = 0;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
    notify();
  }

  function resetAll() {
    state = defaultState();
    save();
  }

  load();

  return {
    get: () => state,
    RANKS,
    UPGRADES,
    ACHIEVEMENTS,
    xpForLevel,
    getRank,
    getPrestigeMult,
    getPrestigeMultiplier: getPrestigeMult,
    getTotalBrainMult,
    getStreakMultiplier,
    getPrestigeGain,
    performPrestige,
    recordTaskResult,
    recordBlitzBest,
    placeBet,
    winPayout,
    getUpgradeCost,
    buyUpgrade,
    claimQuest,
    claimEndlessContract,
    unlockAchievement,
    consumeSyncDelta,
    applyServerSnapshot,
    setExactCoinsFromAction,
    subscribe,
    save,
    resetAll,
    toggleMute() {
      state.muted = !state.muted;
      if (window.SFX) window.SFX.setMuted(state.muted);
      save();
      return state.muted;
    },
    setDiff(d) {
      state.selectedDiff = d;
      save();
    }
  };
})();

      const f = `${randInt(1, 5)}/${randInt(6, 15)}`;
      if (f !== ans) set.add(f);
    }
    return shuffle(Array.from(set).slice(0, 4));
  }

  async function fetchWithTimeout(url, opts = {}, ms = 7500) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
    try {
      const res = await fetch(url, { ...opts, signal: ctrl ? ctrl.signal : undefined });
      if (t) clearTimeout(t);
      return res;
    } catch (e) {
      if (t) clearTimeout(t);
      throw e;
    }
  }

  function addCloudItems(newItems) {
    const existingHashes = new Set(cloudQuestions.map((x) => hashQuestion(x.q)));
    let added = 0;
    for (const item of newItems) {
      if (!item || !item.q || !item.a || !Array.isArray(item.o) || item.o.length < 4) continue;
      const h = hashQuestion(item.q);
      if (existingHashes.has(h)) continue;
      existingHashes.add(h);
      cloudQuestions.push(item);
      added++;
    }
    if (added > 0) saveCloudBank();
    return added;
  }

  async function fetchQuestiqPacks(packCount = 5) {
    let manifest = null;
    let useJsDelivr = true;
    for (let i = 0; i < QUESTIQ_MANIFEST_URLS.length; i++) {
      try {
        const res = await fetchWithTimeout(QUESTIQ_MANIFEST_URLS[i]);
        if (res && res.ok) {
          manifest = await res.json();
          useJsDelivr = i === 0;
          break;
        }
      } catch (e) {}
    }
    if (!manifest || !Array.isArray(manifest.packs)) return 0;

    const ruPacks = manifest.packs.filter((p) => p.locale === 'ru' && p.url);
    const freshPacks = ruPacks.filter((p) => !loadedPackUrls.has(p.url));
    const pool = freshPacks.length >= packCount ? freshPacks : ruPacks;
    const chosen = shuffle(pool).slice(0, packCount);

    let totalAdded = 0;
    await Promise.all(chosen.map(async (pack) => {
      try {
        let packUrl = pack.url;
        if (useJsDelivr && packUrl.includes('raw.githubusercontent.com/iamsomon/questiq-content/main/')) {
          packUrl = packUrl.replace(
            'https://raw.githubusercontent.com/iamsomon/questiq-content/main/',
            'https://cdn.jsdelivr.net/gh/iamsomon/questiq-content@main/'
          );
        }
        const r = await fetchWithTimeout(packUrl);
        if (!r || !r.ok) return;
        const arr = await r.json();
        if (!Array.isArray(arr)) return;
        loadedPackUrls.add(pack.url);

        const mapped = [];
        for (const row of arr) {
          const ruLoc = row && row.localizations && row.localizations.ru;
          if (!ruLoc || !ruLoc.question || !Array.isArray(row.options) || row.options.length < 4) continue;
          const optsRu = row.options.map((o) => o && o.ru).filter(Boolean);
          const corrObj = row.options.find((o) => o && o.id === row.correctOptionId);
          const ansRu = corrObj && corrObj.ru;
          if (optsRu.length < 4 || !ansRu) continue;
          const dMap = { easy: 0, medium: 1, hard: 2 };
          let dVal = dMap[row.difficulty] !== undefined ? dMap[row.difficulty] : 1;
          if (row.difficulty === 'hard' && Math.random() < 0.45) dVal = 3;
          const topic = CAT_LABELS_RU[pack.category] || 'Эрудиция';
          mapped.push({
            d: dVal,
            sci: SCIENCE_PACK_CATS.has(pack.category),
            topic,
            q: `[${topic}] ${ruLoc.question}`,
            a: ansRu,
            o: optsRu.slice(0, 4),
            e: ruLoc.explanation || `Верный ответ: ${ansRu}`
          });
        }
        totalAdded += addCloudItems(mapped);
      } catch (e) {}
    }));
    return totalAdded;
  }

  async function fetchWikidataLiveBatch() {
    // Live SPARQL query for random countries/capitals & chemical elements/discoverers in Russian
    const offset = randInt(0, 90);
    const sparql = `SELECT ?itemLabel ?valLabel WHERE {
      ?item wdt:P31 wd:Q6256; wdt:P36 ?val.
      SERVICE wikibase:label { bd:serviceParam wikibase:language "ru". }
    } OFFSET ${offset} LIMIT 28`;
    try {
      const url = 'https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(sparql);
      const res = await fetchWithTimeout(url, { headers: { Accept: 'application/sparql-results+json' } }, 6500);
      if (!res || !res.ok) return 0;
      const data = await res.json();
      const rows = (data && data.results && data.results.bindings || [])
        .map((b) => ({
          c: b.itemLabel && b.itemLabel.value,
          cap: b.valLabel && b.valLabel.value
        }))
        .filter((x) => x.c && x.cap && !/^Q\d+$/.test(x.c) && !/^Q\d+$/.test(x.cap) && x.c !== x.cap);
      if (rows.length < 8) return 0;
      const allCaps = Array.from(new Set(rows.map((r) => r.cap)));
      const generated = [];
      for (const r of rows) {
        const wrong = shuffle(allCaps.filter((c) => c !== r.cap)).slice(0, 3);
        if (wrong.length < 3) continue;
        generated.push({
          d: randInt(0, 2),
          sci: false,
          topic: 'География Live',
          q: `[География Live] Столицей какого государства является город ${r.cap}?`,
          a: r.c,
          o: [r.c, ...shuffle(rows.map((x) => x.c).filter((c) => c !== r.c)).slice(0, 3)],
          e: `${r.cap} — официальная столица государства ${r.c} (данные Wikidata Live).`
        });
      }
      return addCloudItems(generated);
    } catch (e) {
      return 0;
    }
  }

  async function refreshOnlineQuestions(forceMore = false) {
    if (cloudSyncState.syncing) return { ok: false, added: 0 };
    cloudSyncState.syncing = true;
    cloudSyncState.error = null;
    notifyListeners();

    let added = 0;
    try {
      const [a1, a2] = await Promise.all([
        fetchQuestiqPacks(forceMore ? 7 : 4),
        fetchWikidataLiveBatch()
      ]);
      added = (a1 || 0) + (a2 || 0);
      cloudSyncState.lastSyncTs = Date.now();
      if (added === 0 && cloudQuestions.length === 0) {
        cloudSyncState.error = 'Офлайн-режим (работает встроенный генератор 10 000+ задач)';
      }
    } catch (e) {
      cloudSyncState.error = 'Сеть недоступна — активна встроенная база';
    } finally {
      cloudSyncState.syncing = false;
      notifyListeners();
    }
    return { ok: added > 0 || cloudQuestions.length > 0, added, totalCloud: cloudQuestions.length };
  }

  function genAlgebra(diff) {

        const x = randInt(4, 22), a = randInt(3, 9), b = randInt(5, 35);
        ans = x; q = `Найдите x:  ${a}x − ${b} = ${a * x - b}`;

        const k = randInt(2, 7), d = randInt(3, 8), add = randInt(4, 15);

        ans = x;
        const sB = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;

        explain = `Корни уравнения ${r1} и ${r2}. Меньший корень = ${r1}.`;
      } else if (t === 2) {
        const x = randInt(4, 18), y = randInt(2, 14);
        ans = x * y;
        q = `Если x + y = ${x + y} и x − y = ${x - y}, чему равно произведение x · y?`;
        explain = `x = ${x}, y = ${y}, произведение x·y = ${ans}.`;
      } else {
        const a1 = randInt(2, 9), d = randInt(3, 7), n = randInt(8, 16);
        ans = a1 + (n - 1) * d;

      } else if (t === 2) {
        const r1 = randInt(-9, -2), r2 = randInt(3, 12);
        const b = -(r1 + r2), c = r1 * r2;

    return {

      answer: String(ans),

  // =========================================================================
  // 3. PROBABILITY & COMBINATORICS (100% Procedural — ZERO Static Repeats!)
  // =========================================================================
  function fact(n) {
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }
  function comb(n, k) {
    if (k < 0 || k > n) return 0;
    return Math.round(fact(n) / (fact(k) * fact(n - k)));
  }

  function genProb(diff) {
    if (diff === 0) {
      const t = randInt(0, 3);
      if (t === 0) {
        const total = pick([10, 20, 25, 50]);

          if (!opts.includes(ans)) opts[0] = ans;
          return {
            type: 'choice',
            question: `В сейфе ${g} золотых и ${total - g} серебряных фишек. Какова вероятность вытянуть золотую (в %)?`,
            options: shuffle(opts),
            answer: ans,
            explain: `${g} из ${total} фишек = ${pct}%.`
          };
        }
      }
      if (t <= 1) {
        const sides = pick([6, 8, 10, 12, 20]);

          answer: `1/${den}`,
          explain: `Независимые события: (1/2)^${k} = 1/${den}.`

      }
    } else if (diff === 1) {
      const t = randInt(0, 3);
      if (t === 0) {

          type: 'choice',

          options: makeFractionOptions(safe, gridN),
          answer: simpFrac(safe, gridN),
          explain: `Безопасных клеток ${safe} из ${gridN} = ${simpFrac(safe, gridN)}.`
        };
      } else if (t === 1) {

          for (let d2 = 1; d2 <= 6; d2++) if (d1 + d2 === targetSum) ways++;

        return {

          options: makeFractionOptions(ways, 36),

      } else if (t === 2) {

          answer: String(ans),
          explain: `C(${n}, ${k}) = ${ans}.`

      } else if (t === 1) {
        const g = randInt(3, 6), b = randInt(4, 7);

          options: makeFractionOptions(num, den),

        };
      } else if (t === 2) {

        const wrongSet = [];
        for (const w of rawWrongs) {

        }
        return {
          type: 'choice',
          question: `Ставка ${bet} 🪙. Шанс выигрыша ${winPct}% (выплата ×${mult} от ставки, иначе 0). Чему равно матожидание ЧИСТОЙ прибыли?`,

      } else {

        };
      }
    } else {
      const t = randInt(0, 2);
      if (t === 0) {

        const fav = den - 1;
        return {
          type: 'choice',

          options: makeFractionOptions(fav, den),

          explain: `Противоположное событие «ни одного Орла» имеет шанс 1/${den}. Значит 1 − 1/${den} = ${fav}/${den}.`
        };
      } else if (t === 1) {
        const g = randInt(3, 6), r = randInt(3, 6);
        const tot = g + r;
        const num = 2 * g * r;
        const den = tot * (tot - 1);
        return {
          type: 'choice',
          question: `В мешке ${g} изумрудов и ${r} рубинов. Тянут 2 камня без возврата. Шанс, что камни РАЗНОГО цвета?`,
          options: makeFractionOptions(num, den),

  // =========================================================================
  // 4. LOGIC & SEQUENCES (14 Procedural Templates — ZERO Static Repeats!)
  // =========================================================================
  function genLogic(diff) {
    if (diff === 0) {
      const t = randInt(0, 2);
      if (t === 0) {
        const start = randInt(3, 25), step = randInt(3, 12);
        const seq = [0, 1, 2, 3].map((i) => start + i * step);
        const ans = start + 4 * step;
        return {
          type: 'choice',
          question: `Продолжите ряд:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 7),
          answer: String(ans),
          explain: `Шаг ряда +${step}: ${seq[3]} + ${step} = ${ans}.`
        };
      } else if (t === 1) {
        const start = randInt(60, 120), step = randInt(4, 11);
        const seq = [0, 1, 2, 3].map((i) => start - i * step);
        const ans = start - 4 * step;
        return {
          type: 'choice',
          question: `Найдите следующее число:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 7),

        };
      } else {
        const start = randInt(1, 5), ratio = pick([2, 3]);
        const seq = [0, 1, 2, 3].map((i) => start * Math.pow(ratio, i));
        const ans = start * Math.pow(ratio, 4);
        return {
          type: 'choice',
          question: `Продолжите геометрический ряд:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, Math.max(8, Math.round(ans * 0.2))),

    } else if (diff === 1) {
      const t = randInt(0, 3);
      if (t === 0) {
        const k = randInt(-5, 9);
        const shift = randInt(1, 3);
        const seq = [0, 1, 2, 3, 4].map((i) => (i + shift) ** 2 + k);
        const ans = (5 + shift) ** 2 + k;
        return {
          type: 'choice',
          question: `Найдите следующее число:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 9),
          answer: String(ans),
          explain: `Квадраты чисел ${k >= 0 ? `+ ${k}` : `− ${Math.abs(k)}`}: (${5 + shift})² ${k >= 0 ? `+ ${k}` : `− ${Math.abs(k)}`} = ${ans}.`
        };
      } else if (t === 1) {
        const f1 = randInt(1, 6), f2 = randInt(2, 8);
        const seq = [f1, f2];
        for (let i = 0; i < 4; i++) seq.push(seq[seq.length - 1] + seq[seq.length - 2]);
        const ans = seq.pop();
        return {
          type: 'choice',
          question: `Ряд суммы двух предыдущих:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 9),
          answer: String(ans),
          explain: `${seq[seq.length - 2]} + ${seq[seq.length - 1]} = ${ans}.`
        };
      } else if (t === 2) {
        const a0 = randInt(2, 9), d0 = randInt(2, 6);
        const seq = [a0];
        for (let i = 0; i < 5; i++) seq.push(seq[seq.length - 1] + d0 + i * 2);
        const ans = seq.pop();
        return {
          type: 'choice',
          question: `Разгадайте растущий шаг:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 8),
          answer: String(ans),
          explain: `Разности растут на +2 (${d0}, ${d0 + 2}, ${d0 + 4}, ${d0 + 6}, ${d0 + 8}) ⇒ ${ans}.`
        };
      } else {
        const diffPrice = pick([80, 100, 120, 150, 200]);
        const small = pick([5, 10, 15, 20, 25, 30]);
        const total = diffPrice + 2 * small;
        return {
          type: 'choice',
          question: `Кейс и ключ вместе стоят ${total} 🪙. Кейс дороже ключа ровно на ${diffPrice} 🪙. Сколько стоит ключ?`,
          options: shuffle([String(small), String(small * 2), String(total - diffPrice), String(small + 10)]),
          answer: String(small),
          explain: `2x + ${diffPrice} = ${total} ⇒ 2x = ${2 * small} ⇒ ключ стоит ${small} 🪙!`
        };
      }
    } else if (diff === 2) {
      const t = randInt(0, 3);
      if (t === 0) {
        const start = randInt(2, 7), mult = pick([2, 3]), add = randInt(-3, 5) || 1;
        const seq = [start];
        for (let i = 0; i < 4; i++) seq.push(seq[seq.length - 1] * mult + add);
        const ans = seq.pop();
        const opStr = add >= 0 ? `+ ${add}` : `− ${Math.abs(add)}`;
        return {
          type: 'choice',
          question: `Разгадайте правило ряда:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 14),
          answer: String(ans),
          explain: `Правило ×${mult} ${opStr}: ${seq[seq.length - 1]} × ${mult} ${opStr} = ${ans}.`
        };
      } else if (t === 1) {
        // Interleaved dual sequence!
        const a1 = randInt(3, 12), s1 = randInt(4, 9);
        const b1 = randInt(30, 60), s2 = randInt(3, 7);
        const seq = [a1, b1, a1 + s1, b1 - s2, a1 + 2 * s1, b1 - 2 * s2];
        const ans = a1 + 3 * s1;
        return {
          type: 'choice',
          question: `Двойной чередующийся ряд:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 8),
          answer: String(ans),
          explain: `Нечётные позиции идут с шагом +${s1}: ${a1}, ${a1 + s1}, ${a1 + 2 * s1}, ${ans}!`
        };
      } else if (t === 2) {
        const k = randInt(2, 5);
        const coinsCount = Math.pow(3, k);
        return {
          type: 'choice',
          question: `Среди ${coinsCount} монет ровно одна фальшивая (легче других). За какое МИНИМАЛЬНОЕ число взвешиваний на чашечных весах без гирь её гарантированно можно найти?`,
          options: shuffle([String(k), String(k + 1), String(k + 2), String(Math.max(1, k - 1))]),
          answer: String(k),
          explain: `Каждое взвешивание делит подозрительную группу на 3 части: log₃(${coinsCount}) = ${k} взвешиваний.`
        };
      } else {
        const cats = randInt(3, 9), mins = randInt(3, 9), target = cats * randInt(2, 5);
        return {
          type: 'choice',
          question: `Логика: ${cats} роботов собирают ${cats} микросхем за ${mins} минут. За сколько минут ${target} роботов соберут ${target} микросхем?`,
          options: shuffle([String(mins), String(target), String(mins * (target / cats)), '1']),
          answer: String(mins),
          explain: `1 робот собирает 1 микросхему за ${mins} минут, поэтому ${target} роботов параллельно справятся за те же ${mins} минут!`
        };
      }
    } else {
      const t = randInt(0, 3);
      if (t === 0) {
        const k = randInt(-4, 7) || 2;
        const seq = [1, 2, 3, 4].map((n) => n ** 3 + k);
        const ans = 125 + k;
        return {
          type: 'choice',
          question: `Найдите следующий элемент ряда:  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 18),
          answer: String(ans),
          explain: `Формула n³ ${k >= 0 ? `+ ${k}` : `− ${Math.abs(k)}`}: 5³ ${k >= 0 ? `+ ${k}` : `− ${Math.abs(k)}`} = ${ans}.`
        };
      } else if (t === 1) {
        const t1 = randInt(1, 3), t2 = randInt(1, 4), t3 = randInt(2, 5);
        const seq = [t1, t2, t3];
        for (let i = 0; i < 4; i++) seq.push(seq[seq.length - 1] + seq[seq.length - 2] + seq[seq.length - 3]);
        const ans = seq.pop();
        return {
          type: 'choice',
          question: `Ряд Трибоначчи (сумма трёх предыдущих):  ${seq.join(', ')}, ?`,
          options: makeNumericOptions(ans, 14),
          answer: String(ans),
          explain: `${seq[3]} + ${seq[4]} + ${seq[5]} = ${ans}.`
        };
      } else if (t === 2) {
        const days = randInt(12, 30);
        const ans = days - 1;
        return {
          type: 'choice',
          question: `Кувшинка на озере каждый день удваивает площадь покрытия и полностью закрывает озеро за ${days} дней. За сколько дней будет закрыта ровно ПОЛОВИНА озера?`,
          options: shuffle([String(ans), String(Math.floor(days / 2)), String(days - 2), String(Math.floor(days / 2) + 1)]),
          answer: String(ans),
          explain: `Так как площадь удваивается каждый день, половина озера была закрыта ровно за 1 день до конца — на ${ans}-й день!`
        };
      } else {
        const H = randInt(12, 25), up = randInt(4, 7), down = randInt(1, up - 2);
        const step = up - down;
        const days = Math.max(1, Math.ceil((H - up) / step)) + 1;
        return {
          type: 'choice',
          question: `Дрон поднимается по шахте высотой ${H} м: за день взлетает на +${up} м, за ночь спускается на −${down} м. На какой по счёту день он впервые достигнет вершины ${H} м?`,
          options: makeNumericOptions(days, 3),
          answer: String(days),
          explain: `Чистый шаг за сутки +${step} м, но в последний день скатываться уже не нужно: вершина достигается на ${days}-й день!`
        };
      }
    }
  }

  // =========================================================================
  // 5 & 6. SCIENCE + MEGA-TRIVIA (Cloud Bank + Curated + Dynamic Facts)
  // =========================================================================
  function genKnowledge(diff, scienceOnly) {
    const cloudPool = cloudQuestions.filter((x) => {
      if (scienceOnly && !x.sci) return false;
      return x.d === diff || Math.abs(x.d - diff) <= 1;
    });
    const unseenCloud = cloudPool.filter((x) => !isQuestionSeen(x.q));
    if (unseenCloud.length > 0 && (Math.random() < 0.78 || !scienceOnly)) {
      const item = pick(unseenCloud);
      return {
        type: 'choice',
        question: item.q,
        options: shuffle(item.o),
        answer: item.a,
        explain: item.e
      };
    }

    const builtinPool = BUILTIN_CURATED.filter((x) => (!scienceOnly || x.sci) && (x.d === diff || Math.abs(x.d - diff) <= 1));
    const unseenBuiltin = builtinPool.filter((x) => !isQuestionSeen(x.q));
    if (unseenBuiltin.length > 0 && Math.random() < 0.55) {
      const item = pick(unseenBuiltin);
      return {
        type: 'choice',
        question: item.q,
        options: shuffle(item.o),
        answer: item.a,
        explain: item.e
      };
    }

    // Trigger background cloud refill if running low on unseen cloud items
    if (unseenCloud.length < 10 && !cloudSyncState.syncing) {
      refreshOnlineQuestions(true);
    }

    return genDynamicFactQuestion(diff, scienceOnly);
  }

  // =========================================================================
  // 7. MEMORY MATRIX
  // =========================================================================
  function genMemory(diff) {
    const configs = [
      { size: 4, targets: 5, showMs: 1250 },
      { size: 4, targets: 7, showMs: 1350 },
      { size: 5, targets: 9, showMs: 1400 },
      { size: 5, targets: 12, showMs: 1450 }
    ];
    const cfg = configs[diff] || configs[0];
    const indices = shuffle(Array.from({ length: cfg.size * cfg.size }, (_, i) => i)).slice(0, cfg.targets);
    return {
      type: 'memory',
      size: cfg.size,
      targets: indices,
      showMs: cfg.showMs,
      explain: `Тренировка пространственной рабочей памяти (${cfg.size}×${cfg.size}, ${cfg.targets} энерго-узлов).`
    };
  }

  // =========================================================================
  // 8. STROOP COGNITIVE CONTROL
  // =========================================================================
  const STROOP_COLORS = [
    { id: 'red', label: 'КРАСНЫЙ', hex: '#ff3d71' },
    { id: 'blue', label: 'ГОЛУБОЙ', hex: '#00d4ff' },
    { id: 'green', label: 'ЗЕЛЁНЫЙ', hex: '#00e676' },
    { id: 'yellow', label: 'ЖЁЛТЫЙ', hex: '#ffd54f' }
  ];

  function genStroop(diff) {
    const stepsCount = [3, 4, 5, 6][diff] || 3;
    const steps = [];
    for (let i = 0; i < stepsCount; i++) {
      const wordObj = pick(STROOP_COLORS);
      const others = STROOP_COLORS.filter((c) => c.id !== wordObj.id);
      const inkObj = pick(others);
      const askInk = Math.random() < 0.52;
      steps.push({
        wordText: wordObj.label,
        inkHex: inkObj.hex,
        modeLabel: askInk ? '🎨 Выберите ЦВЕТ БУКВ (не читайте слово!)' : '📖 Выберите СМЫСЛ СЛОВА (игнорируйте цвет!)',
        correctId: askInk ? inkObj.id : wordObj.id
      });
    }
    return {
      type: 'stroop',
      steps,
      colors: STROOP_COLORS,
      explain: 'Эффект Струпа тренирует префронтальную кору и подавление автоматических импульсов!'
    };
  }

  // =========================================================================
  // SMART MIX DECK + ANTI-REPEAT GENERATOR
  // =========================================================================
  function nextMixCategory(choiceOnly = false) {
    const allowed = choiceOnly
      ? ['arith', 'algebra', 'prob', 'logic', 'science', 'trivia']
      : CATEGORIES.map((c) => c.id);
    mixBag = mixBag.filter((c) => allowed.includes(c));
    if (mixBag.length === 0) {
      mixBag = shuffle(allowed);
    }
    return mixBag.pop();
  }

  function rawGenerate(cat, diffIdx) {
    switch (cat) {
      case 'arith': return genArith(diffIdx);
      case 'algebra': return genAlgebra(diffIdx);
      case 'prob': return genProb(diffIdx);
      case 'logic': return genLogic(diffIdx);
      case 'science': return genKnowledge(diffIdx, true);
      case 'trivia': return genKnowledge(diffIdx, false);
      case 'memory': return genMemory(diffIdx);
      case 'stroop': return genStroop(diffIdx);
      default: return genArith(diffIdx);
    }
  }

  function sanitizeChoiceTask(task) {
    if (!task || task.type !== 'choice') return task;
    const ans = String(task.answer);
    const uniq = [ans];
    for (const o of (task.options || [])) {
      const s = String(o);
      if (!uniq.includes(s)) uniq.push(s);
      if (uniq.length >= 4) break;
    }
    let pad = 1;
    while (uniq.length < 4) {
      const numAns = Number(ans);
      const fallback = !Number.isNaN(numAns) ? String(numAns + pad * 3) : `Вариант ${pad}`;
      if (!uniq.includes(fallback)) uniq.push(fallback);
      pad++;
    }
    task.answer = ans;
    task.options = shuffle(uniq.slice(0, 4));
    return task;
  }

  function generate(categoryId, diffIdx = 0, opts = {}) {
    const d = Math.max(0, Math.min(3, Number(diffIdx) || 0));
    const actualCat = (!categoryId || categoryId === 'mix')
      ? nextMixCategory(!!opts.choiceOnly)
      : categoryId;

    let bestTask = null;
    for (let attempt = 0; attempt < 24; attempt++) {
      const cand = sanitizeChoiceTask(rawGenerate(actualCat, d));
      cand.categoryId = actualCat;
      bestTask = cand;
      if (!cand.question || !isQuestionSeen(cand.question)) {
        if (cand.question) markQuestionSeen(cand.question);
        return cand;
      }
    }
    if (bestTask && bestTask.question) markQuestionSeen(bestTask.question);
    return bestTask;
  }

  function getBankStatus() {
    const unseenCloud = cloudQuestions.filter((x) => !isQuestionSeen(x.q)).length;
    return {
      cloudTotal: cloudQuestions.length,
      cloudUnseen: unseenCloud,
      seenCount: seenList.length,
      syncing: cloudSyncState.syncing,
      lastSyncTs: cloudSyncState.lastSyncTs,
      error: cloudSyncState.error
    };
  }

  // Boot: restore cache + pull fresh packs from internet automatically!
  loadPersistedState();
  if (typeof window !== 'undefined') {
    setTimeout(() => {
      refreshOnlineQuestions(cloudQuestions.length < 120);
    }, 600);
  }

  return {
    DIFFICULTIES,
    CATEGORIES,
    generate,
    nextMixCategory,
    refreshOnlineQuestions,
    getBankStatus,
    resetSeenHistory,
    onStatusChange
  };
})();

window.GameCore = (function () {

    for (let d = 0; d < numDecks; d++) {
      for (const suit of SUITS) {
        for (let rIdx = 0; rIdx < RANKS.length; rIdx++) {
          deck.push({
            rank: RANKS[rIdx],
            suit: suit.s,
            red: suit.red,
            order: rIdx + 2 // 2..14 (A=14)
          });
        }
      }
    }
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  function renderCardHTML(card, opts = {}) {
    if (!card || opts.hidden) {
      return `<div class="playing-card back">🧠</div>`;
    }
    const heldClass = opts.held ? 'held' : '';
    const redClass = card.red ? 'red' : '';
    const idxAttr = opts.dataIdx !== undefined ? `data-card-idx="${opts.dataIdx}" style="cursor:pointer"` : '';
    const badge = opts.held ? `<div class="card-hold-badge">HOLD</div>` : '';
    return `
      <div class="playing-card ${redClass} ${heldClass}" ${idxAttr}>
        <div class="card-corner">${card.rank}${card.suit}</div>
        <div class="card-center-suit">${card.suit}</div>
        <div class="card-corner" style="align-self:flex-end; transform:rotate(180deg)">${card.rank}${card.suit}</div>
        ${badge}
      </div>
    `;
  }

  function fmt(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    let abs = Math.abs(num);
    const units = ['', 'к', 'млн', 'млрд', 'трлн'];
    let u = 0;
    while (abs >= 1000 && u < units.length - 1) { abs /= 1000; u++; }
    while (abs >= 999.5 && u < units.length - 1) { abs /= 1000; u++; }
    if (u === 0) return sign + String(Math.round(abs));
    const s = abs >= 100 ? String(Math.round(abs))
      : abs >= 10 ? String(Math.round(abs * 10) / 10).replace('.', ',')
      : String(Math.round(abs * 100) / 100).replace('.', ',');
    return sign + s + ' ' + units[u];
  }

  // Quick Math Rescue Modal right inside any casino game!
  function openQuickEarnModal(onEarnedCallback) {
    const st = AppState.get();
    const diff = st.selectedDiff || 0;
    const task = BrainTasks.generate('mix', diff, { choiceOnly: true });
    const cat = task.categoryId || 'arith';
    const catMeta = BrainTasks.CATEGORIES.find((c) => c.id === cat) || BrainTasks.CATEGORIES[0];
    const extraTime = (st.upgrades.time_warp || 0) * 1.5;
    const maxT = BrainTasks.DIFFICULTIES[diff].timeSec + extraTime;
    const startTs = Date.now();
    let qeSolved = false;
    let qeTimer = null;

    window.UI.openModal(`
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span class="hero-badge">${catMeta.icon} Быстрый заработок</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="num" id="qe-timer" style="font-size:12px; font-weight:800; color:var(--cyan);">⏱️ ${maxT.toFixed(1)}с</span>
          <button class="icon-btn" onclick="UI.closeModal()">✕</button>
        </div>
      </div>
      <div style="height:4px; background:rgba(255,255,255,0.08); border-radius:99px; margin-bottom:8px; overflow:hidden;">
        <div id="qe-bar" style="height:100%; width:100%; background:linear-gradient(90deg, var(--emerald), var(--cyan)); transition:width 0.15s linear;"></div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:8px;">
        ${BrainTasks.DIFFICULTIES.map((d) => `
          <button class="preset-btn qe-diff" data-d="${d.id}" style="padding:5px 4px; font-size:11px; ${diff === d.id ? 'border-color:var(--emerald); color:#fff; background:rgba(0,230,118,0.16);' : ''}">
            ${d.name}
          </button>
        `).join('')}
      </div>
      <div style="font-size:12px; color:var(--text-secondary);">Реши задачу до истечения таймера, чтобы пополнить банк:</div>
      <div class="task-question-box" style="font-size:18px; padding:14px 10px;">${task.question}</div>
      <div class="answers-grid" id="quick-earn-opts"></div>
      <div id="quick-earn-feedback" style="margin-top:12px; font-size:13px;"></div>
      <div style="margin-top:12px; display:flex; justify-content:space-between; gap:8px;">
        <button class="btn btn-ghost" style="flex:1" onclick="UI.closeModal(); App.navigate('earn');">Все 8 тренажёров →</button>
        <button class="btn btn-purple" id="quick-next-btn" style="flex:1; display:none;">Ещё задачку ⚡</button>
      </div>
    `);

    const optsBox = document.getElementById('quick-earn-opts');
    const qeTimerEl = document.getElementById('qe-timer');
    const qeBarEl = document.getElementById('qe-bar');

    function settleQuickTask(isOk, clickedBtn, reasonText) {
      if (qeSolved) return;
      qeSolved = true;
      if (qeTimer) { clearInterval(qeTimer); qeTimer = null; }
      const allBtns = optsBox ? optsBox.querySelectorAll('button') : [];
      allBtns.forEach((x) => (x.disabled = true));

      const elapsed = (Date.now() - startTs) / 1000;
      const speedRatio = Math.max(0, 1 - elapsed / maxT);
      const res = AppState.recordTaskResult({ correct: isOk, category: cat, diffIdx: diff, speedRatio });
      const fb = document.getElementById('quick-earn-feedback');
      if (isOk) {
        if (clickedBtn) clickedBtn.classList.add('correct');
        SFX.correct();
        if (fb) {
          fb.innerHTML = `<div style="color:var(--emerald); font-weight:800;">✅ Верно! +${res.earnedCoins} 🪙 (Комбо x${res.streakMult.toFixed(2)})</div>
                          <div style="color:var(--text-secondary); margin-top:4px;">${task.explain}</div>`;
        }
        if (onEarnedCallback) onEarnedCallback();
        if (activePanelRefresh) {
          try { activePanelRefresh(); } catch (e) {}
        }
      } else {
        if (clickedBtn) clickedBtn.classList.add('wrong');
        allBtns.forEach((x) => { if (x.textContent === task.answer) x.classList.add('correct'); });
        SFX.wrong();
        const fineTag = res.penaltyCoins > 0 ? ` · Штраф −${res.penaltyCoins} 🪙` : '';
        if (fb) {
          fb.innerHTML = `<div style="color:var(--crimson); font-weight:800;">❌ ${reasonText || ('Ответ: ' + task.answer)}${res.shieldUsed ? ' (🛡️ Щит!)' : fineTag}</div>
                          <div style="color:var(--text-secondary); margin-top:4px;">${task.explain}</div>`;
        }
      }
      const nextBtn = document.getElementById('quick-next-btn');
      if (nextBtn) {
        nextBtn.style.display = 'inline-flex';
        nextBtn.onclick = () => openQuickEarnModal(onEarnedCallback);
      }
    }

    qeTimer = setInterval(() => {
      if (qeSolved || !document.getElementById('quick-earn-opts')) {
        clearInterval(qeTimer);
        qeTimer = null;
        return;
      }
      const rem = Math.max(0, maxT - (Date.now() - startTs) / 1000);
      if (qeTimerEl) {
        qeTimerEl.textContent = `⏱️ ${rem.toFixed(1)}с`;
        qeTimerEl.style.color = rem <= 4.0 ? 'var(--crimson)' : 'var(--cyan)';
      }
      if (qeBarEl) {
        qeBarEl.style.width = `${(rem / maxT) * 100}%`;
        if (rem <= 4.0) qeBarEl.style.background = 'var(--crimson)';
      }
      if (rem <= 0) {
        settleQuickTask(false, null, `⏱️ Время вышло! Ответ: ${task.answer}`);
      }
    }, 100);

    document.querySelectorAll('.qe-diff').forEach((btn) => {
      btn.onclick = () => {
        if (qeTimer) { clearInterval(qeTimer); qeTimer = null; }
        SFX.tap();
        AppState.setDiff(Number(btn.dataset.d));
        openQuickEarnModal(onEarnedCallback);
      };
    });

    task.options.forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'answer-btn';
      b.textContent = opt;
      b.onclick = () => {
        const isOk = opt === task.answer;
        settleQuickTask(isOk, b, `Ответ: ${task.answer}`);
      };
      optsBox.appendChild(b);
    });
  }

  function renderBetControls(container, opts) {
    const { minBet = 5, onBetChange, actionLabel = 'Играть', onAction, disabled = false, extraHTML = '', autoSpin = null } = opts;
    if (!disabled && !(autoSpin && autoSpin.active)) {
      activePanelRefresh = () => {
        if (document.body.contains(container)) {
          renderBetControls(container, opts);
        }
      };
    }

    const coins = AppState.get().coins;
    if (defaultBet > coins && coins >= minBet && !(autoSpin && autoSpin.active)) defaultBet = coins;
    if (defaultBet < minBet) defaultBet = Math.max(minBet, Math.min(25, coins || 25));

    const needRescue = coins < minBet && !disabled && !(autoSpin && autoSpin.active);
    const lockInputs = disabled || (autoSpin && autoSpin.active);

    container.innerHTML = `
      ${needRescue ? `
        <div class="low-coins-banner">
          <div>
            <div style="font-weight:800; color:var(--emerald); font-size:14px;">🧠 Нужны IQ-монеты для ставки!</div>
            <div style="font-size:12px; color:var(--text-secondary);">В этом казино нет донатов — реши задачку за 5 секунд и играй!</div>
          </div>
          <button class="btn btn-emerald" id="rescue-earn-btn">⚡ Решить задачу (+🪙)</button>
        </div>
      ` : ''}
      <div class="bet-input-row">
        <div class="bet-field-wrap">
          <span>🪙</span>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="bet-input num" id="core-bet-input" min="${minBet}" step="1" value="${defaultBet}" ${lockInputs ? 'disabled' : ''}/>
        </div>
        <div class="bet-quick-btns">
          <button class="chip-mini-btn" data-op="half" ${lockInputs ? 'disabled' : ''}>½</button>
          <button class="chip-mini-btn" data-op="double" ${lockInputs ? 'disabled' : ''}>2×</button>
          <button class="chip-mini-btn" data-op="max" ${lockInputs ? 'disabled' : ''}>MAX</button>
        </div>
      </div>
      <div class="preset-row">
        ${[10, 25, 50, 100, 250, 500].map((v) => `<button class="preset-btn num" data-val="${v}" ${lockInputs ? 'disabled' : ''}>${v}</button>`).join('')}
      </div>
      ${extraHTML}
      ${onAction ? `
        <div style="display:flex; gap:8px;">
          <button class="btn btn-gold btn-lg" id="core-action-btn" style="flex:2;" ${lockInputs ? 'disabled' : ''}>${actionLabel}</button>
          ${autoSpin ? `
            <button class="btn ${autoSpin.active ? 'btn-crimson' : 'btn-purple'} btn-lg num" id="core-auto-btn" style="flex:1; padding-left:10px; padding-right:10px;">
              ${autoSpin.active ? `⏹️ СТОП (${autoSpin.count || 0})` : (autoSpin.label || '🔄 Авто')}
            </button>
          ` : ''}
        </div>
      ` : ''}
    `;

    const rescueBtn = container.querySelector('#rescue-earn-btn');
    if (rescueBtn) {
      rescueBtn.onclick = () => {
        SFX.tap();
        openQuickEarnModal();
      };
    }

    const input = container.querySelector('#core-bet-input');
    const syncBet = (val) => {
      const c = AppState.get().coins;
      let clean = Math.max(minBet, Math.floor(Math.abs(Number(val)) || minBet));
      if (c >= minBet && clean > c) clean = c;
      defaultBet = clean;
      if (input) input.value = clean;
      if (onBetChange) onBetChange(clean);
    };

    if (input) {
      input.addEventListener('change', () => syncBet(input.value));
      input.addEventListener('input', () => {
        const cleaned = Math.max(1, Math.floor(Math.abs(Number(input.value)) || 0));
        defaultBet = cleaned;
        if (onBetChange) onBetChange(defaultBet);
      });
    }

    container.querySelectorAll('.chip-mini-btn').forEach((btn) => {
      btn.onclick = () => {
        SFX.tap();
        const op = btn.dataset.op;
        const c = AppState.get().coins;
        if (op === 'half') syncBet(Math.floor(defaultBet / 2));
        if (op === 'double') syncBet(defaultBet * 2);
        if (op === 'max') syncBet(Math.max(minBet, c));
      };
    });

    container.querySelectorAll('.preset-btn[data-val]').forEach((btn) => {
      btn.onclick = () => {
        SFX.tap();
        syncBet(Number(btn.dataset.val));
      };
    });

    const actBtn = container.querySelector('#core-action-btn');
    if (actBtn && onAction) {
      actBtn.onclick = () => {
        const rawVal = input ? Number(input.value) : defaultBet;
        const bet = Math.floor(Math.abs(rawVal) || 0);
        if (AppState.get().coins < bet || bet < minBet) {
          SFX.wrong();
          openQuickEarnModal();
          return;
        }
        defaultBet = bet;
        if (input) input.value = bet;
        onAction(bet);
      };
    }

    const autoBtn = container.querySelector('#core-auto-btn');
    if (autoBtn && autoSpin && typeof autoSpin.onToggle === 'function') {
      autoBtn.onclick = () => {
        SFX.tap();
        if (autoSpin.active) {
          autoSpin.onToggle(defaultBet);
          return;
        }
        const rawVal = input ? Number(input.value) : defaultBet;
        const bet = Math.floor(Math.abs(rawVal) || 0);
        if (AppState.get().coins < bet || bet < minBet) {
          SFX.wrong();
          openQuickEarnModal();
          return;
        }
        defaultBet = bet;
        if (input) input.value = bet;
        autoSpin.onToggle(bet);
      };
    }
  }

  function getBet() {
    return defaultBet;
  }

  function hasScanner() {
    return (AppState.get().upgrades.prob_scanner || 0) > 0;
  }

  return {
    registerGame,
    getGames,
    clearActivePanelRefresh,
    setCustomPanelRefresh,
    createDeck,
    renderCardHTML,
    renderBetControls,
    openQuickEarnModal,
    getBet,
    fmt,
    hasScanner
  };
})();
